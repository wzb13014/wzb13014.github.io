

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>45001—2018 职业健康安全管理体系 要求及使用指南 · 知识库</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#0f1419; --bg2:#161b22; --bg3:#1c2330; --panel:#1a2230;
  --border:#2a3442; --text:#e6edf3; --text2:#9aa7b5; --text3:#6b7785;
  --accent:#3b82f6; --accent2:#22d3ee; --accent-soft:rgba(59,130,246,.15);
  --req:#f59e0b; --note:#8b95a3; --ok:#34d399; --danger:#f87171;
  --shadow:0 8px 30px rgba(0,0,0,.45); --radius:12px;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --bg3:#eef2f8; --panel:#ffffff;
  --border:#dce3ec; --text:#1a2330; --text2:#46566a; --text3:#7a899b;
  --accent:#2563eb; --accent2:#0891b2; --accent-soft:rgba(37,99,235,.1);
  --req:#c2710a; --note:#6b7785; --ok:#059669; --danger:#dc2626;
  --shadow:0 8px 30px rgba(20,40,80,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.75;
  font-size:16px; transition:background .25s,color .25s;
}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ============ 顶栏 ============ */
header{
  position:sticky;top:0;z-index:50;background:var(--bg2);
  border-bottom:1px solid var(--border);padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
}
.brand small{display:block;font-weight:400;color:var(--text3);font-size:11px}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:520px}
#search{
  width:100%;padding:9px 36px 9px 38px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg3);color:var(--text);
  font-size:14px;outline:none;transition:.2s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-wrap .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:none;color:var(--text3);font-size:18px;display:none}
.search-wrap .clr:hover{color:var(--danger)}
.search-count{position:absolute;right:38px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--text3);pointer-events:none}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text2);padding:7px 10px;border-radius:9px;
  font-size:13px;transition:.18s;white-space:nowrap;
}
.btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
.btn.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.btn .kbd{font-size:10px;opacity:.6}

/* ============ 布局 ============ */
.layout{display:flex;min-height:calc(100vh - 58px)}
/* 侧栏 */
aside{
  width:300px;flex:none;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .25s,margin .25s;
}
aside.collapsed{width:0;margin-left:-1px}
.side-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:8px}
.side-head input{
  flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:13px;outline:none;min-width:0;
}
.nav{flex:1;overflow-y:auto;padding:8px 6px 30px}
.nav-group{margin-bottom:2px}
.nav-chap{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  cursor:pointer;color:var(--text);font-weight:600;font-size:14px;transition:.15s;
}
.nav-chap:hover{background:var(--bg3)}
.nav-chap .num{
  flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;
}
.nav-chap .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-chap .cnt{font-size:11px;color:var(--text3);background:var(--bg3);
  padding:1px 7px;border-radius:20px}
.nav-chap .arrow{transition:transform .2s;color:var(--text3);font-size:11px}
.nav-chap.open .arrow{transform:rotate(90deg)}
.nav-items{display:none;padding:2px 0 4px 14px}
.nav-items.open{display:block}
.nav-item{
  display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:7px;
  cursor:pointer;color:var(--text2);font-size:13px;transition:.15s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text);border-left-color:var(--accent)}
.nav-item .id{color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.nav-item .it{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .star{margin-left:auto;color:var(--text3);font-size:12px;opacity:0}
.nav-item:hover .star,.nav-item.starred .star{opacity:1}
.nav-item.starred .star{color:var(--req)}

/* 主区 */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.breadcrumb{padding:10px 22px;border-bottom:1px solid var(--border);background:var(--bg2);
  font-size:13px;color:var(--text3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.breadcrumb b{color:var(--text)}
.crumbs a{color:var(--accent2)}
.content{flex:1;overflow-y:auto;padding:26px 30px 80px;max-width:1080px;margin:0 auto;width:100%}
.clause-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  border-bottom:2px solid var(--border);padding-bottom:16px;margin-bottom:22px}
.clause-num{
  flex:none;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:8px 14px;border-radius:10px;font-variant-numeric:tabular-nums;letter-spacing:.5px;
}
.clause-title{flex:1;min-width:200px}
.clause-title h1{font-size:25px;line-height:1.35;margin-bottom:4px}
.clause-title .sub{color:var(--text3);font-size:13px}
.clause-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--border);background:var(--bg3);color:var(--text2);
  padding:6px 11px;border-radius:8px;font-size:12.5px;transition:.18s;display:inline-flex;gap:5px;align-items:center}
.mini-btn:hover{color:var(--text);border-color:var(--accent)}
.mini-btn.on{color:var(--req);border-color:var(--req)}

/* 内容块 */
.block{margin-bottom:14px}
.block p{margin-bottom:12px}
.block .note{color:var(--note);font-size:14px;padding:10px 14px;border-left:3px solid var(--border);
  background:var(--bg2);border-radius:0 8px 8px 0;margin:10px 0}
.block .req-em{color:var(--req);font-weight:600}
ul.l{list-style:none;padding-left:4px;margin:8px 0}
ul.l>li{position:relative;padding:4px 0 4px 26px;margin-bottom:4px}
ul.l>li::before{content:attr(data-k);position:absolute;left:0;top:4px;font-weight:700;color:var(--accent2)}
ul.l2{padding-left:22px;margin:4px 0}
ul.l2>li{padding-left:24px}
ul.l2>li::before{color:var(--text3)}
.tip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;
  padding:12px 16px;margin:14px 0;font-size:14px}
mark{background:var(--req);color:#1a1205;padding:0 2px;border-radius:3px}
mark.cur{background:var(--accent);color:#fff}

/* 翻页 */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
  padding-top:20px;border-top:1px solid var(--border)}
.pager a{padding:12px 18px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg2);flex:1;max-width:48%;transition:.18s}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager .pl{color:var(--text3);font-size:12px}
.pager .pt{color:var(--text);font-weight:600;font-size:14px;display:block;margin-top:2px}
.pager a.next{text-align:right}

/* 进度条 */
.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  z-index:100;width:0;transition:width .3s}

/* ============ 右抽屉 ============ */
.drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--border);z-index:60;transform:translateX(105%);
  transition:transform .28s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:translateX(0)}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between}
.drawer .dh h3{font-size:16px}
.drawer .dbody{flex:1;overflow-y:auto;padding:16px 18px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.25s}
.mask.show{opacity:1;pointer-events:auto}

/* 搜索结果 */
.result{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;
  cursor:pointer;transition:.15s;background:var(--bg2)}
.result:hover{border-color:var(--accent);background:var(--bg3)}
.result .rid{color:var(--accent2);font-weight:700;font-size:13px}
.result .rt{font-weight:600;font-size:14px;margin:2px 0}
.result .rs{color:var(--text2);font-size:13px;line-height:1.5}
.empty{color:var(--text3);text-align:center;padding:40px 10px}

/* 术语表 */
.term{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.term b{color:var(--accent2)}
.term p{color:var(--text2);font-size:13px;margin-top:4px}

/* 统计卡 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--text3);margin-top:2px}

/* 测验 */
.quiz-q{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.quiz-q .qt{font-weight:600;margin-bottom:10px}
.quiz-q label{display:block;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
  margin-bottom:6px;cursor:pointer;transition:.15s;font-size:14px}
.quiz-q label:hover{background:var(--bg3)}
.quiz-q label.ok{background:rgba(52,211,153,.16);border-color:var(--ok);color:var(--ok)}
.quiz-q label.bad{background:rgba(248,113,113,.16);border-color:var(--danger);color:var(--danger)}
.quiz-q .exp{font-size:13px;color:var(--text2);margin-top:8px;display:none}
.quiz-q.answered .exp{display:block}

/* 图 */
.diagram-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin:14px 0}
.diagram-wrap h4{margin-bottom:12px;font-size:15px}
.svg-box{width:100%;overflow-x:auto;text-align:center}
.svg-box svg{max-width:100%;height:auto}
.legend{font-size:12px;color:var(--text3);margin-top:8px}

/* 移动端 */
.hamburger{display:none}
@media(max-width:900px){
  aside{position:fixed;top:58px;bottom:0;left:0;z-index:40;box-shadow:var(--shadow)}
  .hamburger{display:inline-flex}
  .content{padding:18px 14px 70px}
  .clause-title h1{font-size:20px}
}
@media(max-width:560px){
  .brand small{display:none}
  .tools .btn span.txt{display:none}
  .clause-num{font-size:13px;padding:6px 10px}
}
/* 打印 */
@media print{
  aside,.tools,header .search-wrap,.pager,.clause-actions,.hamburger{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .layout{display:block}
  .content{max-width:100%;padding:0}
  .clause-head{border-color:#999}
  mark{background:#ffe28a;color:#000}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header>
  <button class="btn hamburger" id="toggleNav" title="目录">☰</button>
  <div class="brand">
    <div class="logo">OHS</div>
    <div>45001—2018 知识库
      <small>职业健康安全管理体系 要求及使用指南（等同采用 ISO 45001:2018）</small>
    </div>
  </div>
  <div class="search-wrap">
    <span class="ic">🔍</span>
    <input id="search" placeholder="全文搜索：如“风险”“危险源”“职业健康安全方针”“管理评审”…" autocomplete="off">
    <span class="search-count" id="searchCount"></span>
    <button class="clr" id="searchClear">×</button>
  </div>
  <div class="tools">
    <button class="btn" id="btnNav" title="目录树">📑<span class="txt">目录</span></button>
    <button class="btn" id="btnStar" title="我的收藏">⭐<span class="txt">收藏</span></button>
    <button class="btn" id="btnGloss" title="术语表">📖<span class="txt">术语</span></button>
    <button class="btn" id="btnGraph" title="结构图">🗺️<span class="txt">图谱</span></button>
    <button class="btn" id="btnQuiz" title="自测">🎯<span class="txt">自测</span></button>
    <button class="btn" id="btnStat" title="统计">📊<span class="txt">统计</span></button>
    <button class="btn" id="btnTheme" title="主题">🌓</button>
    <button class="btn" id="btnFontD" title="缩小字号">A−</button>
    <button class="btn" id="btnFontU" title="放大字号">A+</button>
    <button class="btn" id="btnPrint" title="打印/导出PDF">🖨️</button>
  </div>
</header>

<div class="layout">
  <aside id="aside">
    <div class="side-head">
      <input id="navFilter" placeholder="筛选条款…">
      <button class="btn" id="collapseNav" title="收起">⟨</button>
    </div>
    <div class="nav" id="nav"></div>
  </aside>

  <main>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- 右抽屉：通用容器 -->
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dh">
    <h3 id="drawerTitle">面板</h3>
    <button class="btn" id="drawerClose">✕</button>
  </div>
  <div class="dbody" id="drawerBody"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
/* =====================================================================
   GB/T 45001—2020 数据（等同采用 ISO 45001:2018）
   每条 clause: {id, num, title, en?, blocks:[...]}
   block 类型:
     {t:'p', x:'文本'}           段落
     {t:'note', x:'文本'}        注
     {t:'ul', items:[...]}       列表，item 可为 字符串 或 {t:'ul',items:[...]}
   ===================================================================== */
const CLAUSES = [
 {
  "id": "0",
  "num": "引言",
  "title": "引言（Introduction）",
  "blocks": [
   {
    "t": "note",
    "x": "本引言为理解本标准的要求提供背景，包括：0.1 背景；0.2 职业健康安全管理体系的目的；0.3 成功因素；0.4 “策划—实施—检查—改进”循环（PDCA）；0.5 本标准内容。"
   }
  ]
 },
 {
  "id": "0.1",
  "num": "0.1",
  "title": "背景",
  "blocks": [
   {
    "t": "p",
    "x": "组织应对工作人员和可能受其活动影响的其他人员的职业健康安全负责，包括促进和保护他们的生理和心理健康。采用职业健康安全管理体系旨在使组织能够提供健康安全的工作场所，防止与工作相关的伤害和健康损害，并持续改进其职业健康安全绩效。在职业健康安全领域，国家专门制定了一系列职业健康安全相关法律法规（如劳动法、安全生产法、职业病防治法、消防法、道路交通安全法、矿山安全法等） 。这些法律法规所确立的职业健康安全制度和要求是组织建立和保持职业健康安全管理体系所必须考虑的制度、政策和技术背景。"
   }
  ]
 },
 {
  "id": "0.2",
  "num": "0.2",
  "title": "职业健康安全管理体系的目的",
  "blocks": [
   {
    "t": "p",
    "x": "职业健康安全管理体系的作用是为管理职业健康安全风险和机遇提供一个框架。职业健康安全管理体系的目的和预期结果是防止对工作人员造成与工作相关的伤害和健康损害，并提供健康安全的工作场所；因此，对组织而言，采取有效的预防和保护措施以消除危险源和最大限度地降低职业健康安全风险至关重要。组织通过其职业健康安全管理体系应用这些措施时，能够提高其职业健康安全绩效。如果及早采取措施以把握改进职业健康安全绩效的机会，职业健康安全管理体系将会更加有效和高效。实施符合本标准的职业健康安全管理体系，能使组织管理其职业健康安全风险并提升其职业健康安全绩效。职业健康安全管理体系可有助于组织满足法律法规要求和其他要求。"
   }
  ]
 },
 {
  "id": "0.3",
  "num": "0.3",
  "title": "成功因素",
  "blocks": [
   {
    "t": "p",
    "x": "对组织而言，实施职业健康安全管理体系是一项战略和经营决策。职业健康安全管理体系的成功取决于领导作用、承诺以及组织各层次和职能的参与。职业健康安全管理体系的实施和保持，其有效性和实现预期结果的能力取决于诸多关键因素。这些关键因素可包括："
   },
   {
    "t": "ul",
    "items": [
     "a）最高管理者的领导作用、承诺、职责和担当；",
     "b）最高管理者在组织内建立、引导和促进支持实现职业健康安全管理体系预期结果的文化；",
     "c）沟通；d）工作人员及其代表（若有）的协商和参与；",
     "e）为保持职业健康安全管理体系而所需的资源配置；",
     "f）符合组织总体战略目标和方向的职业健康安全方针；g）辨识危险源、控制职业健康安全风险和利用职业健康安全机遇的有效过程；",
     "h）为提升职业健康安全绩效而对职业健康安全管理体系绩效的持续监视和评价；",
     "i）将职业健康安全管理体系融入组织的业务过程；",
     "j）符合职业健康安全方针并必须考虑组织的危险源、职业健康安全风险和职业健康安全机遇的职业健康安全目标；k）符合法律法规要求和其他要求。成功实施本标准可使工作人员和其他相关方确信组织已建立了有效的职业健康安全管理体系。然而，采用本标准并不能够完全保证防止工作人员受到与工作相关的伤害和健康损害，提供健康安全的工作场所和改进职业健康安全绩效。为了确保组织职业健康安全管理体系成功，文件化信息的详略水平、复杂性和文件化程度以及所需资源取决于多方面因素，例如：",
     "—— 组织所处的环境（如工作人员数量、规模、地理位置、文化、法律法规要求和其他要求）；",
     "—— 组织职业健康安全管理体系的范围；",
     "—— 组织活动的性质和相关的职业健康安全风险。"
    ]
   }
  ]

 {
  "id": "0.4",

  "title": "“策划—实施—检查—改进”循环（PDCA）",
  "blocks": [
   {
    "t": "ul",
    "items": [
     "-实施",
     "-检查",
     "-改进”循环本标准中所采用的职业健康安全管理体系的方法是基于“策划-实施-检查-改进（PDCA）”的概念。PDCA 概念是一个迭代过程,可被组织用于实现持续改进。它可应用于管理体系及其每个单独的要素，具体如下：",
     "—— 策划（P：Plan）：确定和评价职业健康安全风险、职业健康安全机遇以及其他风险和其他机遇，制定职业健康安全目标并建立所需的过程，以实现与组织职业健康安全方针相一致的结果。",
     "—— 实施（D：Do）：实施所策划的过程。",
     "—— 检查（：Check）：依据职业健康安全方针和目标，对活动和过程进行监视和测量，并报告结果。",
     "—— 改进（A：Act）：采取措施持续改进职业健康安全绩效，以实现预期结果。本标准将PDCA概念融入一个新框架中，如图1 所示。领导作用和工作人员参与（",

     "4）工作人员和其他相关方的需求和期望（4.2）内部和外部议题（4.1）职业健康安全管理体系范围（4.3/4.4）"

 {

  "title": "本标准内容",
  "blocks": [
   {
    "t": "p",
    "x": "本标准符合国际标准化组织（ISO）对管理体系标准的要求。这些要求包括一个统一的高层结构和相同的核心正文以及具有核心定义的通用术语， 旨在方便本标准的使用者实施多个ISO管理体系标准。尽管本标准的要素可与其他管理体系兼容或整合，但本标准并不包含针对其他主题（如质量、社会责任、环境、治安保卫或财务管理等）的要求。本标准包含了组织可用于实施职业健康安全管理体系和开展符合性评价的要求。希望证实符合本标准的组织可通过以下方式来实现："
   },
   {
    "t": "ul",
    "items": [
     "——开展自我评价和声明；",
     "——寻求组织的相关方（如顾客）对其符合性进行确认；",
     "——寻求组织的外部机构对其自我声明的确认；",
     "——寻求外部组织对其职业健康安全管理体系进行认证或注册。本标准的第1 章至第3 章阐述了适用于本标准的范围、规范性引用文件以及术语和定义，第4 章至第10 章包含了可用于评价与本标准符合性的要求。附录A提供了这些要求的解释性信息。附录"
    ]
   },
   {
    "t": "p",
    "x": "NA给出了本标准与GB/T‐之间的对应情况。第3 章中的术语和定义按照概念的顺序进行编排。本标准索引（一）给出了按英文字母顺序排列的术语索引，索引（二）给出了按汉语拼音顺序排列的术语索引。本标准使用以下助动词："
   },
   {
    "t": "ul",
    "items": [

    ]
   }
  ]

 {
  "id": "1",
  "num": "1",
  "title": "范围",
  "blocks": [
   {
    "t": "p",
    "x": "本标准规定了职业健康安全（OH&S）管理体系的要求，并给出了其使用指南，以使组织能够通过防止与工作相关的伤害和健康损害以及主动改进其职业健康安全绩效来提供安全和健康的工作场所。本标准适用于任何具有以下愿望的组织：通过建立、实施和保持职业健康安全管理体系，以改进健康安全、消除危险源并尽可能降低职业健康安全风险（包括体系缺陷）、利用职业健康安全机遇，以及应对与其活动相关的职业健康安全管理体系不符合。本标准有助于组织实现其职业健康安全管理体系的预期结果。依照组织的职业健康安全方针，其职业健康安全管理体系的预期结果包括："
   },
   {
    "t": "ul",
    "items": [
     "a）持续改进职业健康安全绩效；",
     "b）满足法律法规要求和其他要求；",
     "c）实现职业健康安全目标。本标准适用于任何规模、类型和活动的组织。它适用于组织控制下的职业健康安全风险，这些风险必须考虑到诸如组织运行所处环境、组织工作人员和其他相关方的需求和期望等因素。本标准既不规定具体的职业健康安全绩效准则，也不提供职业健康安全管理体系的设计规范。本标准使组织能够借助其职业健康安全管理体系整合健康和安全的其他方面，如工作人员的福利和（或）幸福等。本标准不涉及对工作人员和其他有关相关方的风险以外的议题，如产品安全、财产损失或环境影响等。本标准能够全部或部分地用于系统改进职业健康安全管理。然而，只有当本标准的所有要求均被包含在了组织的职业健康安全管理体系中并全部得到满足，有关符合本标准的声明才能被认可。"
    ]
   }
  ]
 },

   {

    "x": "在策划职业健康安全管理体系时，组织应考虑4.1 （所处的环境）所提及的议题、4.2 （相关方）所提及的要求和4.3 （职业健康安全管理体系范围） ，并确定所需应对的风险和机遇，以："
   },
   {
    "t": "ul",
    "items": [
     "a）确保职业健康安全管理体系实现预期结果；",
     "b）防止或减少不期望的影响；",
     "c）实现持续改进。在确定所需应对的与职业健康安全管理体系及其预期结果有关的风险和机遇时，组织必须考虑：",
     "——危险源（见6.1.2.1） ；",
     "——职业健康安全风险和其他风险（见6.1.2.2） ；",
     "——职业健康安全机遇和其他机遇（见6.1.2.3） ；",
     "——法律法规要求和其他要求（见6.1.3） 。在策划过程中，组织应结合组织及其过程或职业健康安全管理体系的变更来确定和评价与职业健康安全管理体系预期结果有关的风险和机遇。对于所策划的变更，无论是永久性的还是临时性的，这种评价均应在变更实施前进行（见8.1.3） 。组织应保持以下方面的文件化信息：",
     "——风险和机遇；",
     "——确定和应对其风险和机遇（见6.1.2至6.1.4）所需的过程和措施。其文件化程度应足以让人确信这些过程和措施可按策划执行。"
    ]
   }
  ]
 },
 {
  "id": "6.1.2",
  "num": "6.1.2",
  "title": "危险源辨识及风险和机遇的评价",
  "blocks": []
 },
 {
  "id": "6.1.2.1",
  "num": "6.1.2.1",
  "title": "危险源辨识",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施和保持用于持续和主动的危险源辨识的过程。该过程必须考虑（但不限于） ："
   },
   {
    "t": "ul",
    "items": [
     "a）工作如何组织，社会因素（包括工作负荷、工作时间、欺骗、骚扰和欺压） ，领导作用和组织的文化；",
     "b）常规和非常规的活动和状况，包括由以下方面所产生的危险源：",
     "1）基础设施、设备、原料、材料和工作场所的物理环境；",
     "2）产品和服务的设计、研究、开发、测试、生产、装配、施工、交付、维护或处置；",
     "3）人的因素；",
     "4）工作如何执行。10 c）组织内部或外部以往发生的相关事件（包括紧急情况）及其原因；",
     "d）潜在的紧急情况；",
     "e）人员，包括考虑：",
     "1）那些有机会进入工作场所的人员及其活动，包括工作人员、承包方、访问者和其他人员；",
     "2）那些处于工作场所附近可能受组织活动影响的人员；",
     "3）处于不受组织直接控制的场所的工作人员；",
     "f）其他议题，包括考虑：",
     "1）工作区域、过程、装置、机器和（或）设备、操作程序和工作组织的设计，包括它们对所涉及工作人员的需求和能力的适应性；",
     "2）由组织控制下的工作相关活动所导致的、发生在工作场所附近的状况；",
     "3）发生在工作场所附近、不受组织控制、可能对工作场所内的人员造成伤害和健康损害的状况；",
     "g）组织、运行、过程、活动和职业健康安全管理体系中的实际或拟定的变更（见8.1.3） ；",
     "h）危险源的知识和相关信息的变更。"
    ]
   }
  ]
 },
 {
  "id": "6.1.2.2",
  "num": "6.1.2.2",
  "title": "职业健康安全风险和职业健康安全管理体系的其他风险的评价",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施和保持过程，以："
   },
   {
    "t": "ul",
    "items": [
     "a）评价来自于已辨识的危险源的职业健康安全风险，同时必须考虑现有控制的有效性；",
     "b）确定和评价与建立、实施、运行和保持职业健康安全管理体系相关的其他风险。组织的职业健康安全风险评价方法和准则应在范围、性质和时机方面予以界定，以确保其是主动的而非被动的，并被系统地使用。有关方法和准则的文件化信息应予以保持和保留。"
    ]
   }
  ]
 },
 {
  "id": "6.1.2.3",
  "num": "6.1.2.3",
  "title": "职业健康安全机遇和职业健康安全管理体系的其他机遇的评价",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施和保持过程，以评价："
   },
   {
    "t": "ul",
    "items": [
     "a）提升职业健康安全绩效的职业健康安全机遇，同时必须考虑所策划的对组织及其方针、过程或活动的变更，以及：",
     "1）使工作、工作组织和工作环境适合于工作人员的机遇；",
     "2）消除危险源和降低职业健康安全风险的机遇；",
     "b）改进职业健康安全管理体系的其他机遇。"
    ]
   },
   {
    "t": "note",
    "x": "注：职业健康安全风险和职业健康安全机遇可能会给组织带来其他风险和其他机遇。"
   }
  ]
 },
 {
  "id": "6.1.3",
  "num": "6.1.3",
  "title": "法律法规要求和其他要求的确定",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施和保持过程，以："
   },
   {
    "t": "ul",
    "items": [
     "a）确定并获取最新的适用于组织的危险源、职业健康安全风险和职业健康安全管理体系的法律法规要求和其他要求；",
     "b）确定如何将这些法律法规要求和其他要求应用于组织，以及所需沟通的内容；",
     "c）在建立、实施、保持和持续改进其职业健康安全管理体系时，必须考虑这些法律法规要求和其他要求。组织应保持和保留有关法律法规要求和其他要求的文件化信息， 并确保及时更新以反映任何变化。"
    ]
   },
   {
    "t": "note",
    "x": "注：法律法规要求和其他要求可能会给组织带来风险和机遇。"
   }
  ]
 },
 {
  "id": "6.1.4",
  "num": "6.1.4",
  "title": "措施的策划",
  "blocks": [
   {
    "t": "p",
    "x": "组织应策划："
   },
   {
    "t": "ul",
    "items": [
     "a）措施，以：",
     "1）应对这些风险和机遇（见6.1.2.2 和6.1.2.3） ；",
     "2）满足法律法规要求和其他要求（见6.1.3） ；",
     "3）对紧急情况做出准备和响应（见8.2） ；",
     "b）如何：",
     "1）在其职业健康安全管理体系过程中或其他业务过程中融入并实施这些措施；",
     "2）评价这些措施的有效性。在策划措施时，组织必须考虑控制的层级（见8.1.2）和职业健康安全管理体系的输出。在策划措施时，组织还应考虑最佳实践、可选技术方案以及财务、运行和经营等要求。"
    ]
   }
  ]
 },
 {
  "id": "6.2",
  "num": "6.2",
  "title": "职业健康安全目标及其实现的策划",
  "blocks": []
 },
 {
  "id": "6.2.1",
  "num": "6.2.1",
  "title": "职业健康安全目标",
  "blocks": [
   {
    "t": "p",
    "x": "组织应在相关职能和层次上制定职业健康安全目标，以保持和持续改进职业健康安全管理体系和职业健康安全绩效（见10.3） 。职业健康安全目标应："
   },
   {
    "t": "ul",
    "items": [
     "a）与职业健康安全方针一致；",
     "b）可测量（可行时） ，或能够进行绩效评价；",
     "c）必须考虑：",
     "1）适用的要求；",
     "2）风险和机遇的评价结果（见6.1.2.2和6.1.2.3） ；",
     "3）与工作人员及其代表（若有）协商（见5.4）的结果；",
     "d）得到监视；",
     "e）予以沟通；",
     "f）在适当时予以更新。"
    ]
   }
  ]
 },
 {
  "id": "6.2.2",
  "num": "6.2.2",
  "title": "实现职业健康安全目标的策划",
  "blocks": [
   {
    "t": "p",
    "x": "在策划如何实现职业健康安全目标时，组织应确定："
   },
   {
    "t": "ul",
    "items": [
     "a）要做什么；",
     "b）需要什么资源；",
     "c）由谁负责；",
     "d）何时完成；",
     "e）如何评价结果，包括用于监视的参数；",
     "f）如何将实现职业健康安全目标的措施融入其业务过程。组织应保持和保留职业健康安全目标和实现职业健康安全目标的策划的文件化信息。"
    ]
   }
  ]
 },

  "id": "7",
  "num": "7",
  "title": "支持",
  "blocks": []
 },
 {
  "id": "7.1",
  "num": "7.1",
  "title": "资源",
  "blocks": [
   {
    "t": "p",
    "x": "组织应确定并提供建立、实施、保持和持续改进职业健康安全管理体系所需的资源。"
   }
  ]
 },
 {
  "id": "7.2",
  "num": "7.2",
  "title": "能力",
  "blocks": [
   {
    "t": "p",
    "x": "组织应："
   },
   {
    "t": "ul",
    "items": [
     "a）确定影响或可能影响其职业健康安全绩效的工作人员所必需具备的能力；",
     "b）基于适当的教育、培训或经历，确保工作人员具备胜任工作的能力（包括具备辨识危险源的能力） ；",
     "c）在适用时，采取措施以获得和保持所必需的能力，并评价所采取措施的有效性；",
     "d）保留适当的文件化信息作为能力证据。"
    ]
   },
   {
    "t": "note",
    "x": "注： 适用措施可包括：向现有所雇人员提供培训、指导或重新分配工作；外聘或将工作承包给能胜任工作的人员等。"
   }
  ]
 },
 {
  "id": "7.3",
  "num": "7.3",
  "title": "意识",
  "blocks": [
   {
    "t": "p",
    "x": "工作人员应意识到："
   },
   {
    "t": "ul",
    "items": [
     "a）职业健康安全方针和职业健康安全目标；",
     "b）其对职业健康安全管理体系有效性的贡献作用，包括提升职业健康安全绩效的益处；",
     "c）不符合职业健康安全管理体系要求的影响和潜在后果；",
     "d）与其相关的事件和调查结果；",
     "e）与其相关的危险源、职业健康安全风险和所确定的措施；",
     "f）从其所认为的存在急迫且严重危及其生命或健康的工作状况中逃离的能力，以及为保护其免遭由此而产生的不当后果所做出的安排。"
    ]
   }
  ]
 },
 {
  "id": "7.4",
  "num": "7.4",
  "title": "沟通",
  "blocks": []
 },
 {
  "id": "7.4.1",
  "num": "7.4.1",
  "title": "总则",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施并保持与职业健康安全管理体系有关的内外部沟通所需的过程，包括确定："
   },
   {
    "t": "ul",
    "items": [
     "a）沟通什么；",
     "b）何时沟通；",
     "c）与谁沟通：",
     "1）与组织内不同层次和职能；",
     "2）与进入工作场所的承包方和访问者；",
     "3）与其他相关方；",
     "d）如何沟通。在考虑沟通需求时，组织必须考虑到各种差异（如性别、语言、文化、读写能力、残障） 。在建立沟通过程中，组织应确保外部相关方的观点被考虑。在建立沟通过程时，组织：",
     "——必须考虑其法律法规要求和其他要求；",
     "——应确保所沟通的职业健康安全信息与职业健康安全管理体系内所形成的信息一致且可靠。组织应对有关其职业健康安全管理体系的沟通做出响应。适当时，组织应保留文件化信息作为其沟通的证据。"
    ]
   }
  ]
 },
 {
  "id": "7.4.2",
  "num": "7.4.2",
  "title": "内部沟通",
  "blocks": [
   {
    "t": "p",
    "x": "组织应："
   },
   {
    "t": "ul",
    "items": [
     "a）就职业健康安全管理体系的相关信息在其不同层次和职能之间进行内部沟通，适当时还包括职业健康安全管理体系的变更；",
     "b）确保其沟通过程能够使工作人员为持续改进做出贡献。"
    ]
   }
  ]
 },
 {

  "num": "7.4.3",
  "title": "外部沟通",
  "blocks": [
   {
    "t": "p",
    "x": "组织应按其所建立的沟通过程就职业健康安全管理体系的相关信息进行外部沟通，并必须考虑法律法规要求和其他要求。"
   }
  ]
 },
 {
  "id": "7.5",
  "num": "7.5",
  "title": "文件化信息",

 },
 {

  "num": "7.5.1",

  "blocks": [

    "x": "组织的职业健康安全管理体系应包括："

   {

    "items": [

    ]
   },
   {
    "t": "note",
    "x": "注：对于不同组织而言，其职业健康安全管理体系的文件化信息的程度可能因以下方面存在差异而不同："

   {

    "items": [
     "——组织的规模及其活动、过程、产品和服务的类型；",
     "——证实满足法律法规要求和其他要求的需要；",
     "——过程的复杂性及其相互作用；",
     "——工作人员的能力。"
    ]
   }
  ]
 },
 {
  "id": "7.5.2",
  "num": "7.5.2",
  "title": "创建和更新",
  "blocks": [
   {
    "t": "p",
    "x": "创建和更新文件化信息时，组织应确保适当的："
   },
   {
    "t": "ul",
    "items": [
     "a）标识和说明（如标题、日期、作者或文件编号） ；",
     "b）形式（如语言文字、软件版本、图表）与载体（如纸质载体、电子载体） ；",
     "c）评审和批准，以确保适宜性和充分性。"
    ]
   }
  ]
 },
 {
  "id": "7.5.3",
  "num": "7.5.3",
  "title": "文件化信息的控制",
  "blocks": [
   {
    "t": "p",
    "x": "职业健康安全管理体系和本标准所要求的文件化信息应予以控制，以确保："
   },
   {
    "t": "ul",
    "items": [
     "a）在需要的场所和时间均可获得并适用；",
     "b）得到充分的保护（如防止失密、不当使用或完整性受损） 。适用时，组织应针对下列活动来控制文件化信息：",
     "——分发、访问、检索和使用；",

     "——变更控制（如版本控制） ；",
     "——保留和处置。组织应识别其所确定的、策划和运行职业健康安全管理体系所必需的、来自外部的文件化信息，适当时应对其予以控制。"
    ]
   },
   {
    "t": "note",
    "x": "注1：“访问”可能指仅允许查阅文件化信息的决定，或可能指允许并授权查阅和更改文件化信息的决定。"
   },
   {
    "t": "note",
    "x": "注2：“访问”相关文件化信息包括工作人员及其代表（若有）的“访问”。"

  ]
 },

 {
  "id": "8.1.1",
  "num": "8.1.1",
  "title": "总则",
  "blocks": [
   {
    "t": "p",
    "x": "为了满足职业健康安全管理体系要求和实施第6 章所确定的措施，组织应策划、实施、控制和保持所需的过程，通过："
   },
   {
    "t": "ul",
    "items": [
     "a）建立过程准则；",
     "b）按照准则实施过程控制；",
     "c）保持和保留必要的文件化信息，以确信过程已按策划得到实施；",
     "d）使工作适合于工作人员。在多雇主的工作场所，组织应与其他组织协调职业健康安全管理体系的相关部分。"
    ]
   }
  ]
 },
 {
  "id": "8.1.2",
  "num": "8.1.2",
  "title": "消除危险源和降低职业健康安全风险",
  "blocks": [
   {
    "t": "p",
    "x": "组织应通过采用下列控制层级，建立、实施和保持用于消除危险源和降低职业健康安全风险的过程："
   },
   {
    "t": "ul",
    "items": [
     "a）消除危险源；",
     "b）用危险性低的过程、操作、材料或设备替代；",
     "c）采用工程控制和重新组织工作；",
     "d）采用管理控制，包括培训；",
     "e）使用适当的个体防护装备。"
    ]
   },
   {
    "t": "note",

 {
  "id": "8.1.3",
  "num": "8.1.3",
  "title": "变更管理",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立过程，用于实施和控制所策划的、影响职业健康安全绩效的临时性和永久性变更。这些变更包括："
   },
   {
    "t": "ul",
    "items": [

     "——工作组织；",
     "——工作条件；",
     "——设备；",
     "——劳动力；",
     "b）法律法规要求和其他要求的变更；",
     "c）有关危险源和职业健康安全风险的知识或信息的变更；",
     "d）知识和技术的发展。组织应评审非预期性变更的后果，必要时采取措施，以减轻任何不利影响。"

   },
   {
    "t": "note",
    "x": "注：变更可带来风险和机遇。"
   }
  ]

  "title": "总则",
  "blocks": [

     "4）运行控制和其他控制的有效性；",

     "c）组织评价其职业健康安全绩效所依据的准则；",
     "d）何时应实施监视和测量；",
     "e）何时应分析、评价和沟通监视和测量的结果。组织应评价其职业健康安全绩效并确定职业健康安全管理体系的有效性。组织应确保监视和测量设备在适用时得到校准或验证，并被适当使用和维护。"

   {

   {
    "t": "ul",
    "items": [
     "——作为监视、测量、分析和评价绩效的结果的证据；",

   }
  ]

 {

  "title": "事件、不符合和纠正措施",
  "blocks": [
   {
    "t": "p",
    "x": "组织应建立、实施和保持包括报告、调查和采取措施在内的过程，以确定和管理事件和不符合。当事件或不符合发生时，组织应："

   {
    "t": "ul",
    "items": [
     "a）及时对事件和不符合做出反应，并在适用时：",

     "2）处置后果；",
     "b）在工作人员的参与（见5.4）和其他相关方的参加下，通过下列活动，评价是否采取纠正措施，以消除导致事件或不符合的根本原因，防止事件或不符合再次发生或在其他场合发生：",
     "1）调查事件或评审不符合；",
     "2）确定导致事件或不符合的原因；",
     "3）确定类似事件是否曾经发生过，不符合是否存在，或它们是否可能会发生；",
     "c）在适当时，对现有的职业健康安全风险和其他风险的评价进行评审（见6.1） ；",
     "d）按照控制层级（见8.1.2）和变更管理（见8.1.3） ，确定并实施任何所需的措施，包括纠正措施；",
     "e）在采取措施前，评价与新的或变化的危险源相关的职业健康安全风险；",

     "g）在必要时，变更职业健康安全管理体系。纠正措施应与事件或不符合所产生的影响或潜在影响相适应。组织应保留文件化信息作为以下方面的证据：",

 {
  "id": "A.3",
  "num": "A.3",
  "title": "术语和定义",
  "blocks": [
   {
    "t": "p",
    "x": "除了第3 章给出的术语和定义外，以下还对所选概念进行了说明，以防止错误理解："
   },
   {
    "t": "ul",
    "items": [
     "a）“持续（continual） ”指发生在一段时期内的持续，但可能有间断；而“连续（continuous） ”指不间断的持续，因此应当使用“持续（continual） ”来描述改进。",
     "b）“考虑（consider） ”意指有必要考虑，但可拒绝考虑； “必须考虑（take into account） ”意指有必要考虑，但不能拒绝考虑。",
     "c）“适当的 （appropriate） ” 与 “适用的 （applicable） ” 不得互换。 “适当的” 意指适合于或适于……的，并意味着某种程度的自由；而“适用的”意指与应用有关或有可能应用，且意味着如果能够做到，就应该要做。",
     "d）本标准使用了术语“相关方（interested party） ” ， “利益相关方（stakeholder） ”是其同义词，代表了相同的概念。",
     "e）“确保（ensure） ”一词意指：可将职责委派给他人，但仍承担确保措施得到实施的问责。",
     "f）“文件化信息 （documented information） ” 被用于包含 “文件 （documents） ” 和 “记录 （records） ” 。本标准使用短语“保留（retain）文件化信息作为……的证据”来表示记录， “应作为文件化信息予以保持（maintain） ”来表示文件，包括程序。短语“以保留文件化信息作为……的证据（to retain documented information as evidentiary of…） ”并非要求所保留的信息将满足法律法规的证据要求，而旨在规定所需保留的记录的类型；",
     "g）“在组织共同控制下（under the shared control of the organization） ”的活动是指，按照法律法规要求和其他要求，对于所开展的工作，就其职业健康安全绩效方面，组织与他方共同控制工作的方式或方法，或者共同把握工作方向。组织可按照职业健康安全管理体系的相关要求，批准使用特定的术语及其含义。但如果使用标准之外的这些术语，则仍需要符合本标准。"
    ]
   }
  ]

   {

 {
  "id": "A.5",
  "num": "A.5",
  "title": "领导作用和工作人员参与",
  "blocks": [
   {
    "t": "p",
    "x": "A.5.1 领导作用和承诺组织最高管理者的领导作用和承诺（包括意识、响应、积极的支持和反馈）是职业健康安全管理体系成功并实现其预期结果的关键，为此，最高管理者负有亲自参与或指导的特定职责。支持组织职业健康安全管理体系的文化在很大程度上取决于最高管理者，它是个体和群体的价值观、态度、管理实践、观念、能力及活动模式的产物，而这些则决定了其职业健康安全管理体系的承诺、风格和水平。该文化具有（但不限于）下述特征：工作人员的积极参与；基于相互信任的合作与沟通；通过积极参与对职业健康安全机遇的探寻而达成对职业健康安全管理体系重要性的共识；对预防和保护措施的有效性的信心。 最高管理者证实其领导作用的一个重要方式是鼓励工作人员报告事件、危险源、风险和机遇，并保护其免遭报复（例如，当他们这样做时会面临解雇或纪律处分的威胁） 。"
   },
   {
    "t": "p",
    "x": "A.5.2 职业健康安全方针职业健康安全方针是最高管理者作为承诺而声明的一组原则。它概述了组织支持和持续改进其职业健康安全绩效的长期方向。职业健康安全方针提供了一个总体方向，并为组织制定目标和采取措施以实现职业健康安全管理体系的预期结果提供了框架。这些承诺体现在组织所建立的过程中，以确保职业健康安全管理体系坚实、可信和可靠（包括应对本标准的特定要求） 。术语“尽可能降低”用于与职业健康安全风险有关的方面，以阐明组织对其职业健康安全管理体系的愿望。术语“降低”用于描述实现的过程。在建立职业健康安全方针时，组织宜考虑与其它方针的一致性和协调性。"
   },
   {
    "t": "p",
    "x": "A.5.3 组织的角色、职责和权限为了实现职业健康安全管理体系的预期结果，组织职业健康安全管理体系所涉及到的人员宜清晰理解其角色、职责和权限。虽然最高管理者对职业健康安全管理体系拥有总体职责和权限，但工作场所中的每个人不仅必须考虑其自身的健康和安全，还须考虑他人的健康和安全。“负有责任的最高管理者” ， 意味着最高管理者可为决策和活动接受组织治理机构、 法律监管机构以及更广泛意义上的相关方的问责。这意味着最高管理者承担最终责任，并与因某事未完成、未妥善处置、不起作用或未实现其目标而被追究责任的人员一起承担连带责任。工作人员宜能够报告危险情况，以便组织采取措施。工作人员宜能够按照要求向有关主管部门报告其关心的问题，而不会因此而遭受解雇、纪律处分或其他此类报复的威胁。5.3 中所确定的特定角色和职责可指派给某个人承担， 也可由几个人共同分担， 或指派给最高管理者中的某个成员。"
   },
   {
    "t": "p",
    "x": "A.5.4 工作人员的协商和参与工作人员及其代表（若有）的协商和参与是职业健康安全管理体系取得成功的关键因素。组织宜通过建立过程而对此予以鼓励。协商意味着一种涉及对话和交换意见的双向沟通。协商包括及时向工作人员及其代表（若有）提供必要信息，以使其给出知情的反馈意见，供组织在做出决策前加以考虑。参与能使工作人员为与职业健康安全绩效测量和变更建议有关的决策过程做出贡献。对职业健康安全管理体系的反馈依赖于工作人员的参与。组织宜确保鼓励各层次工作人员报告危险情况，以便预防措施落实到位和采取纠正措施。如果工作人员在提供建议时无惧遭受解雇、纪律处分或其他类似报复的威胁，那么所收到的建议将会更为有效。"

   {
    "t": "p",
    "x": "A.6.1.1 总则策划并非单一事件，而是一个持续的过程。它既为工作人员也为职业健康安全管理体系预测环境变化并持续确定风险和机遇。非预期的结果可包括与工作相关的伤害和健康损害、不符合法律法规要求和其他要求，或损害声誉。策划需整体考虑管理体系的活动与要求之间的关系和相互作用。职业健康安全机遇涉及危险源辨识、如何沟通危险源，以及已知危险源的分析和减轻。其他机遇涉及体系改进策略。改进职业健康安全绩效的机遇的示例：a)发挥检查和审核作用；b)工作危险源分析（工作安全分析）和相关任务评价；c)通过减轻单调的工作或具有潜在危险的预设工作速率的工作来改进职业健康安全绩效；d)工作许可及其他的认可和控制方法；e)事件或不符合调查和纠正措施；f)人类工效学和其他与伤害预防有关的评价。改进职业健康安全绩效的其他机遇的示例："

   {
    "t": "p",
    "x": "A.6.1.2.1 危险源辨识持续主动的危险源辨识始于任何新工作场所、设施、产品或组织的概念设计阶段。它宜随着设计的细化及其随后的运行持续进行，并贯穿其整个生命周期，以反映当前的、变化的和未来的活动。虽然本标准不涉及产品安全（即最终产品用户的安全） ，但产品的制造、建造、装配或测试过程中所存在的危害工作人员的危险源宜予以考虑。危险源辨识有助于组织认识和理解工作场所中的危险源及其对工作人员的危害，以便评价、优先排序并消除危险源或降低职业健康安全风险。危险源可能是物理的、化学的、生物的、心理的、机械的、电的或基于运动或能量的。6.1.2.1 所列并非详尽无遗。"

   {

    "x": "注： 以下所列条目编号从a）到f）与6.1.2.1中所列条目的编号并非完全对应。组织的危险源辨识过程宜考虑：a)常规和非常规的活动和状况：1)常规的活动和状况经由日常运行和正常工作活动产生危险源；2)非常规的活动和状况是指偶然出现的或非计划的活动和状况；3)短期的活动或长期的活动可产生不同的危险源；b)人的因素：1)与人的能力、局限性及其他特征有关；2)为了人能够安全和舒适的使用而应用于工具、机器、系统、活动或环境的信息；3)宜考虑三个方面：活动、工作人员和组织，以及它们之间是如何相互作用并对职业健康安全产生影响的；c)新的或变化的危险源：1)可在因过于熟悉环境或环境变化而导致工作过程恶化、被更改、被适应或被演变时产生；2)对工作实际开展情况的了解（如与工作人员一起观察和讨论危险源）能识别职业健康安全风险是否增加或降低；d)潜在紧急情况：1)需立即做出响应的、意外的或非计划的状况（如工作场所的机器着火；工作场所附近的自然灾害；工作人员正在从事与工作有关活动的其他地点的自然灾害）;2)包括诸如在工作人员正从事与工作相关活动的地点发生了内乱而需要他们紧急疏散的情况。e)人员：1)工作场所附近、可能受组织活动影响的人员（如路人、承包方或近邻） ；2)处于不在组织直接控制下的地点的工作人员，如从事流动工作的人员或前往其他地点从事与工作有关活动的人员（如邮政工作人员、公共汽车司机、前往客户现场工作的服务人员） ；3)在家工作或独自工作的工作人员；f)有关危险源的知识或信息的变化；1)有关危险源的知识、信息和新的理解可能来自于公开的文献、研究与开发、工作人员的反馈，以及组织自身运行经验的评审；2)这些来源能够提供有关危险源和职业健康安全风险的新信息。"

   {
    "t": "p",
    "x": "A.6.2.1 职业健康安全目标制定目标是为了保持和改进职业健康安全绩效。目标宜与风险和机遇以及组织所识别的、实现职业健康安全管理体系预期结果所必需的绩效准则相关。职业健康安全目标可与其他业务目标相融合， 并宜在相关职能和层次设立。 目标可以是战略性的、战术性的或运行层面的：a)战略性目标可被设立为改进职业健康安全管理体系整体绩效（如消除噪声暴露）；b)战术性目标可被设立在设施、项目或过程层面（如从源头降低噪声）；c)运行层面的目标可被设立在活动层面（如围挡单台机器以降低噪声）。职业健康安全目标的测量可以是定性的或定量的。 定性测量可以是粗略的估计， 例如那些从调查、访谈和观察中所获得的结果。组织不必为其所确定的每个风险和机遇均设立职业健康安全目标。"

/* 全文搜索（在所有条款文本中检索） */
function clauseText(c){
  return c.blocks.map(b=>{
    if(b.t==='ul') return b.items.map(it=>typeof it==='string'?it:(it.items?it.items.join(' '):'')).join(' ');
    return b.x||'';
  }).join(' ');
}
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildNav(filter=''){
  const nav = $('#nav'); nav.innerHTML='';

/* ---------- 渲染条款内容 ---------- */
function renderBlocks(blocks, highlight=''){
  const re = highlight? new RegExp('('+escapeRe(highlight)+')','gi') : null;
  const hl = t=> re? t.replace(re,'<mark>$1</mark>') : escapeHtml(t);
  let html='';
  blocks.forEach(b=>{
    if(b.t==='p'){ html+=`<p>${hl(b.x)}</p>`; }
    else if(b.t==='note'){ html+=`<div class="block"><div class="note">${hl(b.x)}</div></div>`; }
    else if(b.t==='ul'){ html+=renderList(b,hl); }
  });
  return html;
}
function renderList(ul,hl){
  const letter=/^[a-z]\s*[）)、]/i;
  let html='<ul class="l">';
  ul.items.forEach(it=>{
    if(typeof it==='string'){
      const k = it.match(/^([a-z])\s*[）)、]/i)? it.match(/^([a-z])\s*[）)、]/i)[1]+'）'
               : it.match(/^(\d+)\s*[）)、.]/)? it.match(/^(\d+)\s*[）)、.]/)[1]+'）' : '';
      const content = k? it.slice(it.indexOf(k)+k.length).trim() : it;
      html+=`<li data-k="${k||'·'}">${hl(content)}</li>`;
    } else if(it.t==='ul'){
      html+=renderList(it,hl).replace('<ul class="l">','<ul class="l l2">');
    }
  });
  html+='</ul>';
  return html;
}

  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  // 内容
  const idx = CLAUSES.findIndex(x=>x.id===id);

  $('#content').innerHTML = `

      </div>
    </div>

    <div class="pager">
      ${prev?`<a class="prev" onclick="goto('${prev.id}')"><span class="pl">← 上一条</span><span class="pt">${prev.num} ${prev.title}</span></a>`:'<span></span>'}
      ${next?`<a class="next" onclick="goto('${next.id}')"><span class="pl">下一条 →</span><span class="pt">${next.num} ${next.title}</span></a>`:'<span></span>'}
    </div>`;

  $('#copyBtn').addEventListener('click',()=>{
    const txt = `${c.num} ${c.title}\n\n`+clauseText(c);

function highlightReq(){
  const body=$('#clauseBody'); if(!body) return;

  if(body.dataset.hl==='1'){ goto(currentId,currentHl); body.dataset.hl='0'; return; }
  const reg=/((?:组织|最高管理者|职业健康安全方针|产品|服务)?应[^，。；、（）()\n]{0,40}?)(?:[，。；、]|$)/g;

  body.querySelectorAll('p,li,.note').forEach(node=>{
    node.innerHTML = node.innerHTML.replace(/应/g,'<span class="req-em">应</span>');

function doSearch(q){
  q=q.trim();
  if(!q){ $('#searchCount').textContent=''; $('#searchClear').style.display='none'; goto(currentId||'0.1',currentHl); return; }
  $('#searchClear').style.display='block';
  const results=[];
  CLAUSES.forEach(c=>{
    const t=clauseText(c); const i=t.toLowerCase().indexOf(q.toLowerCase());
    if(i>=0){
      const start=Math.max(0,i-30); const snip=t.slice(start,i+ (t.length>i+30?60:q.length));
      results.push({c, snip});
    }
  });
  $('#searchCount').textContent = results.length? `${results.length} 条` : '无';
  let h='';
  if(!results.length) h='<div class="empty">未找到匹配“'+escapeHtml(q)+'”的条款。</div>';
  results.forEach(({c,snip})=>{
    const reg=new RegExp('('+escapeRe(q)+')','gi');
    const s=escapeHtml(snip).replace(reg,'<mark>$1</mark>');
    h+=`<div class="result" onclick="goto('${c.id}','${escapeHtml(q).replace(/'/g,"\\'")}')">
      <div class="rid">${c.num} · ${c.title}</div>
      <div class="rs">…${s}…</div></div>`;
  });
  // 将搜索结果放入侧栏下方？这里用抽屉展示，避免覆盖正文
  openDrawer('🔍 搜索结果：'+results.length+' 条','search',h);
}

  $('#mask').addEventListener('click',closeDrawer);
  $('#btnTheme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';LS.set('theme',theme);applyTheme();toast('主题：'+(theme==='dark'?'深色':'浅色'));});
  $('#btnFontU').addEventListener('click',()=>{fontSize=Math.min(24,fontSize+1);LS.set('font',fontSize);applyFont();});
  $('#btnFontD').addEventListener('click',()=>{fontSize=Math.max(12,fontSize-1);LS.set('font',fontSize);applyFont();});
  $('#btnPrint').addEventListener('click',()=>window.print());
  $('#navFilter').addEventListener('input',e=>buildNav(e.target.value));
  // 搜索
  const sb=$('#search');
  sb.addEventListener('input',e=>{ const v=e.target.value; if(!v){$('#searchCount').textContent='';$('#searchClear').style.display='none';return;} doSearch(v); });
  sb.addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(sb.value); });
  $('#searchClear').addEventListener('click',()=>{sb.value='';$('#searchCount').textContent='';$('#searchClear').style.display='none';closeDrawer();goto(currentId,currentHl);});
  // 键盘快捷键
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    const idx=CLAUSES.findIndex(x=>x.id===currentId);
    if(e.key==='ArrowRight'&&idx<CLAUSES.length-1) goto(CLAUSES[idx+1].id);
    if(e.key==='ArrowLeft'&&idx>0) goto(CLAUSES[idx-1].id);
    if(e.key==='/'&&!e.ctrlKey){e.preventDefault();sb.focus();}
    if(e.key==='Escape') closeDrawer();
  });
  // 关闭抽屉时若处于搜索态则不清空，仅隐藏
}
init();
</script>
</body>
</html>
