<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>签名生成器 · 液态玻璃 · 52款风格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ========== 变量 ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

body{
  --bg:#07070f;
  --glass:rgba(255,255,255,.065);
  --glass-2:rgba(255,255,255,.10);
  --glass-3:rgba(255,255,255,.19);
  --stroke:rgba(255,255,255,.13);
  --stroke-2:rgba(255,255,255,.30);
  --text:#f4f5fa;
  --dim:rgba(244,245,250,.55);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --top-shine:rgba(255,255,255,.32);
  --track:rgba(255,255,255,.14);
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  transition:background .55s var(--ease),color .55s var(--ease);
}

body.light{
  --bg:#e9edf6;
  --glass:rgba(255,255,255,.52);
  --glass-2:rgba(255,255,255,.68);
  --glass-3:rgba(255,255,255,.88);
  --stroke:rgba(255,255,255,.85);
  --stroke-2:rgba(255,255,255,1);
  --text:#111420;
  --dim:rgba(17,20,32,.55);
  --shadow:0 24px 60px rgba(70,90,150,.16);
  --top-shine:rgba(255,255,255,1);
  --track:rgba(0,0,0,.10);
}

/* ========== 极光背景 ========== */
.aurora{position:fixed;inset:-15%;z-index:-2;overflow:hidden;}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform;}
.aurora .b1{width:46vmax;height:46vmax;background:#4361ee;top:-14vmax;left:-12vmax;animation:drift1 28s ease-in-out infinite;}
.aurora .b2{width:40vmax;height:40vmax;background:#9333ea;bottom:-18vmax;right:-12vmax;animation:drift2 32s ease-in-out infinite;}
.aurora .b3{width:34vmax;height:34vmax;background:#06b6d4;top:36%;left:52%;animation:drift3 26s ease-in-out infinite;}
.aurora .b4{width:30vmax;height:30vmax;background:#f43f5e;bottom:4%;left:2%;animation:drift1 38s ease-in-out infinite reverse;}
body.light .aurora span{opacity:.34;}

@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(8vmax,6vmax) scale(1.12);}66%{transform:translate(-4vmax,10vmax) scale(.94);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-10vmax,-8vmax) scale(1.15);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}40%{transform:translate(-8vmax,-6vmax) scale(1.1);}70%{transform:translate(6vmax,4vmax) scale(.92);}}

/* ========== 布局 ========== */
.app{
  width:min(1340px,100%);
  margin:0 auto;
  padding:24px 22px 60px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ========== 顶栏 ========== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;}
.brand{display:flex;align-items:center;gap:13px;}
.brand-icon{
  width:48px;height:48px;border-radius:16px;
  display:grid;place-items:center;font-size:23px;
  background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.05));
  border:1px solid var(--stroke);
  box-shadow:inset 0 1px 0 var(--top-shine),0 10px 24px rgba(0,0,0,.24);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  animation:floaty 4s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.brand h1{font-size:1.25rem;font-weight:650;letter-spacing:.01em;}
.brand p{font-size:.74rem;color:var(--dim);margin-top:2px;}

.icon-btn{
  width:46px;height:46px;border-radius:15px;flex:none;
  border:1px solid var(--stroke);background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  color:var(--text);font-size:19px;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:inset 0 1px 0 var(--top-shine),0 10px 22px rgba(0,0,0,.2);
  transition:transform .35s var(--spring),background .25s;
}
.icon-btn:active{transform:scale(.88);}

/* ========== 玻璃卡片 ========== */
.card{
  position:relative;
  border-radius:26px;
  padding:18px;
  background:var(--glass);
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  backdrop-filter:blur(32px) saturate(180%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--top-shine);
  overflow:hidden;
  transition:background .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease);
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.13),transparent 40%,transparent 68%,rgba(255,255,255,.05));
}

.card-title{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.82rem;font-weight:650;color:var(--dim);
  letter-spacing:.05em;margin-bottom:12px;
}
.count{font-size:.72rem;font-weight:500;letter-spacing:0;color:var(--dim);opacity:.8;}
.label-sm{font-size:.76rem;font-weight:600;color:var(--dim);margin-bottom:9px;letter-spacing:.03em;}

/* ========== 输入 ========== */
.input-shell{
  display:flex;align-items:center;gap:8px;
  border-radius:18px;padding:5px 5px 5px 16px;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.2);
  transition:border-color .25s,box-shadow .25s;
}
.input-shell:focus-within{
  border-color:rgba(91,140,255,.75);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.2),0 0 0 4px rgba(91,140,255,.18);
}
.input-shell input[type=text]{
  flex:1;min-width:0;background:none;border:none;outline:none;
  color:var(--text);font-size:1.1rem;font-family:inherit;
  padding:10px 0;
}
.input-shell input[type=text]::placeholder{color:var(--dim);}
.mini-btn{
  width:38px;height:38px;flex:none;border-radius:12px;border:none;
  background:var(--glass-3);color:var(--dim);cursor:pointer;font-size:14px;
  transition:transform .3s var(--spring),color .2s;
}
.mini-btn:hover{color:var(--text);}
.mini-btn:active{transform:scale(.86);}

/* ========== 分段控件 ========== */
.segmented{
  position:relative;display:flex;padding:4px;margin-bottom:14px;
  border-radius:999px;background:var(--glass-2);border:1px solid var(--stroke);
}
.seg-btn{
  flex:1;position:relative;z-index:1;padding:9px 0;
  border:none;background:none;color:var(--dim);
  font-family:inherit;font-size:.84rem;font-weight:600;
  cursor:pointer;border-radius:999px;
  transition:color .3s var(--ease);
}
.seg-btn.active{color:var(--text);}
.seg-thumb{
  position:absolute;top:4px;left:4px;
  width:calc(50% - 4px);height:calc(100% - 8px);
  border-radius:999px;
  background:var(--glass-3);
  border:1px solid var(--stroke-2);
  box-shadow:inset 0 1px 0 var(--top-shine),0 6px 16px rgba(0,0,0,.2);
  transition:transform .48s var(--spring);
  pointer-events:none;
}
.seg-thumb.right{transform:translateX(100%);}

/* ========== 字体网格 ========== */
.font-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:9px;
  max-height:430px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:2px 4px 2px 2px;
  margin-right:-4px;
}
.font-grid::-webkit-scrollbar{width:6px;}
.font-grid::-webkit-scrollbar-track{background:transparent;}
.font-grid::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:99px;}

.font-card{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:13px 8px 10px;
  border-radius:18px;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  cursor:pointer;user-select:none;
  transition:transform .35s var(--spring),background .25s,border-color .25s,box-shadow .25s;
}
.font-card:hover{transform:translateY(-3px) scale(1.03);background:var(--glass-3);}
.font-card:active{transform:scale(.95);}
.font-card.active{
  border-color:rgba(120,170,255,.9);
  background:var(--glass-3);
  box-shadow:0 0 0 1.5px rgba(120,170,255,.75),0 0 26px rgba(80,140,255,.45);
}
.font-card .fp{
  font-size:1.42rem;line-height:1.2;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  padding:2px 4px;
}
.font-card .fn{
  font-size:.62rem;color:var(--dim);letter-spacing:.02em;
  font-family:-apple-system,'PingFang SC',sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}

/* ===== 卡片预览样式（与 canvas 渲染呼应） ===== */
.fp[data-s="ink"]{text-shadow:0 0 1px currentColor,.6px .6px 0 currentColor;}
.fp[data-s="outline"]{-webkit-text-stroke:1.2px currentColor;-webkit-text-fill-color:transparent;}
.fp[data-s="double"]{-webkit-text-stroke:1.4px currentColor;opacity:.92;}
.fp[data-s="shadow"]{text-shadow:2px 2px 0 rgba(0,0,0,.4);}
.fp[data-s="3d"]{text-shadow:1px 1px 0 rgba(0,0,0,.5),2px 2px 0 rgba(0,0,0,.4),3px 3px 0 rgba(0,0,0,.28);}
.fp[data-s="neon"]{text-shadow:0 0 5px currentColor,0 0 12px currentColor,0 0 22px currentColor;}
.fp[data-s="gradient"]{
  background-image:linear-gradient(135deg,currentColor 0%,rgba(167,139,250,.95) 55%,currentColor 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.fp[data-s="sketch"]{opacity:.72;text-shadow:.7px 0 0 currentColor;}
.fp[data-s="stamp"]{border:1.5px solid currentColor;border-radius:2px;padding:0 4px;line-height:1.1;}
.fp[data-s="pixel"]{text-shadow:1px 1px 0 rgba(0,0,0,.4);letter-spacing:-.6px;}
.fp[data-s="glitch"]{text-shadow:-1px 0 #00e5ff,1px 0 #ff2bd6;}
.fp[data-s="engrave"]{text-shadow:-.6px -.6px 0 rgba(255,255,255,.55),.6px .6px 0 rgba(0,0,0,.4);}
.fp[data-s="gold"]{
  background-image:linear-gradient(180deg,#fff8d6 0%,currentColor 32%,#fff3b0 50%,currentColor 66%,#8a6300 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.fp[data-s="dot"]{opacity:.82;letter-spacing:.5px;}
.fp[data-s="plain"]{opacity:.92;}
/* 新增 12 种 */
.fp[data-s="chalk"]{opacity:.82;text-shadow:1px 1px 0 rgba(0,0,0,.14);}
.fp[data-s="watercolor"]{opacity:.85;text-shadow:1px 1px 2px rgba(90,110,200,.4),-1px -1px 2px rgba(180,120,220,.35);}
.fp[data-s="blueprint"]{
  background-image:linear-gradient(currentColor .7px,transparent .7px),linear-gradient(90deg,currentColor .7px,transparent .7px);
  background-size:3.5px 3.5px;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.fp[data-s="invert"]{
  background:currentColor;color:#fff;
  -webkit-text-fill-color:#fff;
  padding:0 5px;border-radius:3px;line-height:1.15;
}
.fp[data-s="woodcut"]{text-shadow:1px 0 0 currentColor,0 1px 0 currentColor;opacity:.85;}
.fp[data-s="stripes"]{
  background-image:repeating-linear-gradient(45deg,currentColor 0 1.8px,transparent 1.8px 4.5px);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.fp[data-s="dashed"]{-webkit-text-stroke:1px currentColor;-webkit-text-fill-color:transparent;opacity:.8;text-decoration:underline dotted;}
.fp[data-s="offset"]{text-shadow:-1.5px -1.5px 0 rgba(150,180,255,.65),1.5px 1.5px 0 rgba(0,0,0,.4);}
.fp[data-s="motion"]{text-shadow:-1px 0 0 currentColor,-2px 0 0 currentColor,-3px 0 0 currentColor,-4px 0 0 currentColor;opacity:.78;}
.fp[data-s="halo"]{text-shadow:0 0 4px currentColor,0 0 8px currentColor,0 0 14px currentColor;}
.fp[data-s="grid"]{
  background-image:linear-gradient(currentColor .7px,transparent .7px),linear-gradient(90deg,currentColor .7px,transparent .7px);
  background-size:2.5px 2.5px;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.fp[data-s="sticker"]{
  text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff;
  -webkit-text-stroke:.4px currentColor;
}

/* ========== 色板 ========== */
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.swatch{
  width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;
  border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 4px 12px rgba(0,0,0,.22);
  transition:transform .3s var(--spring),box-shadow .25s;
}
.swatch:hover{transform:scale(1.15);}
.swatch.active{
  transform:scale(1.08);
  box-shadow:0 0 0 2px var(--text),0 0 20px rgba(150,180,255,.5),inset 0 0 0 1px rgba(255,255,255,.3);
}

input[type=color]{
  -webkit-appearance:none;appearance:none;
  width:32px;height:32px;flex:none;padding:0;border:none;cursor:pointer;
  border-radius:50%;
  background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff3b30);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.22);
  transition:transform .3s var(--spring);
}
input[type=color]:hover{transform:scale(1.12);}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%;}
input[type=color]::-moz-color-swatch{border:none;border-radius:50%;}

/* ========== 控制行 ========== */
.ctrl-row{
  display:flex;align-items:center;gap:10px;
  margin-top:13px;
}
.ctrl-label{
  font-size:.74rem;font-weight:600;color:var(--dim);
  width:44px;flex:none;letter-spacing:.02em;
}
.ctrl-row input[type=range]{
  flex:1;min-width:60px;
}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  height:8px;border-radius:99px;outline:none;cursor:pointer;
  background-color:var(--track);
  background-image:linear-gradient(90deg,#5b8cff,#a78bfa);
  background-repeat:no-repeat;
  background-size:var(--fill,50%) 100%;
  transition:background-color .5s var(--ease);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:none;
  box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);
  transition:transform .28s var(--spring);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:#fff;border:none;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track{height:8px;background:transparent;border-radius:99px;}

.num-stepper{
  display:flex;align-items:center;gap:2px;flex:none;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:var(--glass-2);
  padding:2px 3px 2px 2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.14);
}
.num-stepper input[type=number]{
  width:48px;height:26px;
  border:none;background:none;outline:none;
  color:var(--text);font-family:inherit;font-size:.82rem;font-weight:650;
  text-align:center;
  font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.num-stepper input[type=number]::-webkit-inner-spin-button,
.num-stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.num-stepper input[type=number]:focus{color:#8fb3ff;}

.stepper-btns{display:flex;flex-direction:column;gap:1px;}
.stepper-btns button{
  width:22px;height:14px;flex:none;
  border:none;border-radius:5px;
  background:var(--glass-3);color:var(--dim);
  cursor:pointer;font-size:7px;line-height:1;
  display:grid;place-items:center;
  transition:background .18s,color .18s,transform .14s var(--spring);
}
.stepper-btns button:hover{color:var(--text);background:rgba(140,170,255,.35);}
.stepper-btns button:active{transform:scale(.82);color:#fff;}

/* ========== 预览纸 ========== */
.paper{
  position:relative;
  border-radius:22px;
  min-height:224px;
  display:grid;place-items:center;
  padding:20px;
  overflow:hidden;
  background:linear-gradient(180deg,#ffffff,#fafbff);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 12px 32px rgba(0,0,0,.22);
}
.paper::before{
  content:'';position:absolute;left:8%;right:8%;bottom:48px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.14) 16%,rgba(0,0,0,.14) 84%,transparent);
}
.paper::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.03) 1px,transparent 1px);
  background-size:4px 4px;
  opacity:.7;
}
#previewCanvas{display:block;max-width:100%;position:relative;z-index:1;}
.placeholder{
  color:#b9c0cd;font-size:.95rem;font-style:italic;
  position:relative;z-index:1;pointer-events:none;
}

/* ========== 选项胶囊 ========== */
.opt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.opt-label{font-size:.74rem;font-weight:600;color:var(--dim);margin-right:2px;letter-spacing:.03em;}
.chip{
  padding:8px 14px;border-radius:999px;
  font-size:.75rem;font-weight:600;font-family:inherit;
  border:1px solid var(--stroke);
  background:var(--glass-2);color:var(--dim);
  cursor:pointer;
  transition:all .28s var(--ease),transform .28s var(--spring);
}
.chip:hover{color:var(--text);}
.chip:active{transform:scale(.94);}
.chip.active{
  background:linear-gradient(135deg,#5b8cff,#8b5cf6);
  border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(91,140,255,.42);
}

/* ========== 按钮 ========== */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.btn{
  flex:1;min-width:130px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 20px;border-radius:20px;
  border:1px solid var(--stroke);
  font-size:.93rem;font-weight:650;font-family:inherit;
  background:var(--glass);color:var(--text);cursor:pointer;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--top-shine),0 12px 28px rgba(0,0,0,.2);
  transition:transform .32s var(--spring),box-shadow .28s,opacity .25s,background .5s var(--ease);
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg,#5b8cff,#8b5cf6);
  border-color:rgba(255,255,255,.28);
  color:#fff;
  box-shadow:0 14px 34px rgba(91,140,255,.45),inset 0 1px 0 rgba(255,255,255,.42);
}
.btn-primary:hover{box-shadow:0 18px 42px rgba(91,140,255,.58),inset 0 1px 0 rgba(255,255,255,.42);}
.btn:disabled{opacity:.38;pointer-events:none;}
.btn-ghost{flex:0 0 auto;min-width:auto;padding:15px 18px;font-size:1rem;}

.hint{text-align:center;font-size:.71rem;color:var(--dim);padding:2px 0 0;letter-spacing:.02em;}

/* ========== 两栏布局 ========== */
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:14px;
  align-items:start;
}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;}

/* ========== Toast ========== */
.toast{
  position:fixed;left:50%;bottom:32px;z-index:200;
  transform:translate(-50%,160%);
  padding:12px 24px;border-radius:999px;
  background:rgba(18,18,26,.76);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:.86rem;font-weight:550;white-space:nowrap;
  box-shadow:0 18px 44px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;
  transition:transform .55s var(--spring),opacity .3s;
}
.toast.show{transform:translate(-50%,0);opacity:1;}

/* ========== 响应式 ========== */
@media (max-width:980px){
  .layout{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .app{padding:16px 12px 48px;gap:12px;}
  .card{padding:15px;border-radius:22px;}
  .brand h1{font-size:1.1rem;}

function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16) } : { r:26, g:26, b:26 };
}
function lighten(hex, amt){
  const c = hexToRgb(hex);
  return '#' + [c.r,c.g,c.b].map(function(v){
    const x = Math.round(v + (255 - v) * amt);
    return x.toString(16).padStart(2,'0');
  }).join('');
}
function darken(hex, amt){
  const c = hexToRgb(hex);
  return '#' + [c.r,c.g,c.b].map(function(v){
    const x = Math.round(v * (1 - amt));
    return Math.max(0, Math.min(255, x)).toString(16).padStart(2,'0');
  }).join('');
}

const CONTROLS = [
  { key:'fontSize',      slider:'sizeSlider',    num:'sizeNum',    min:50, max:160, step:2   },
  { key:'letterSpacing', slider:'lsSlider',      num:'lsNum',      min:-4, max:24,  step:1   },
  { key:'skew',          slider:'skewSlider',    num:'skewNum',    min:-15,max:25,  step:1   },
  { key:'bold',          slider:'boldSlider',    num:'boldNum',    min:0,  max:6,   step:0.5 },
  { key:'opacity',       slider:'opacitySlider', num:'opacityNum', min:30, max:100, step:5   }
];

/* ==================================================================
   字体加载（合并成少量请求）
   ================================================================== */
let fontsLoaded = false;

function loadAllFonts(){
  if(fontsLoaded) return;
  fontsLoaded = true;

  const seen = {};
  const families = [];
  chineseFonts.concat(englishFonts).forEach(function(cfg){
    if(cfg.g && !seen[cfg.g]){
      seen[cfg.g] = 1;
      families.push(cfg.g);
    }
  });

  /* 每 6 个 family 一批，避免 URL 过长 */
  const batch = 6;
  for(let i=0;i<families.length;i+=batch){
    const group = families.slice(i, i+batch);
    const url = 'https://fonts.googleapis.com/css2?' +
      group.map(function(f){ return 'family=' + f; }).join('&') +
      '&display=swap';
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = url;
    link.onload = function(){
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(requestRender);
      requestRender();
    };
    document.head.appendChild(link);
  }
}

/* ==================================================================
   Canvas 工具
   ================================================================== */
const supportsLS = (function(){
  try{
    const c = document.createElement('canvas').getContext('2d');
    c.letterSpacing = '2px';
    return c.letterSpacing === '2px';
  }catch(e){ return false; }
})();

function measureWidth(ctx, text, ls){
  if(supportsLS || !ls) return ctx.measureText(text).width;
  const chars = Array.from(text);
  let w = 0;
  for(let i=0;i<chars.length;i++) w += ctx.measureText(chars[i]).width;
  return w + ls * (chars.length - 1);
}

/* 生成条纹/网格图案 */
function makePattern(ctx, kind, color, size){
  const pc = document.createElement('canvas');
  pc.width = size; pc.height = size;
  const p = pc.getContext('2d');
  p.fillStyle = color;
  p.strokeStyle = color;
  if(kind === 'dot'){
    p.beginPath();
    p.arc(size/2, size/2, size * 0.3, 0, Math.PI*2);
    p.fill();
  } else if(kind === 'stripes'){
    p.lineWidth = size * 0.35;
    p.beginPath();
    p.moveTo(-2, size+2);
    p.lineTo(size+2, -2);
    p.stroke();
  } else if(kind === 'grid'){
    p.lineWidth = 1.4;
    p.beginPath();
    p.moveTo(0, 0.5); p.lineTo(size, 0.5);
    p.moveTo(0.5, 0); p.lineTo(0.5, size);
    p.stroke();
  } else if(kind === 'blueprint'){
    p.lineWidth = 0.8;
    p.beginPath();
    p.moveTo(0, 0.5); p.lineTo(size, 0.5);
    p.moveTo(0.5, 0); p.lineTo(0.5, size);
    p.stroke();
  } else if(kind === 'chalk'){
    for(let i=0;i<16;i++){
      p.globalAlpha = 0.3 + Math.random() * 0.7;
      p.fillRect(Math.random()*size, Math.random()*size, 1.1, 1.1);
    }
  }
  return ctx.createPattern(pc, 'repeat');
}

/* ==================================================================
   渲染管线 —— 26 种完全不同画法
   ================================================================== */
function paintMode(ctx, text, mode, color, fontSize, textWidth, bold, seedText){
  const lw = bold * (fontSize / 95);
  const rnd = mulberry32(hashString(seedText + '|' + mode));
  const w = textWidth / 2;

  switch(mode){

    /* 1 — 墨迹：多层抖动描边模拟毛笔洇墨 */
    case 'ink': {
      ctx.fillStyle = color; ctx.strokeStyle = color;
      if(lw > 0) ctx.lineWidth = lw;
      if(lw > 0) ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.save();
      for(let i=0;i<7;i++){
        ctx.globalAlpha = 0.14 + rnd() * 0.12;
        ctx.lineWidth = fontSize * (0.012 + rnd() * 0.022) + lw;
        ctx.strokeText(text, (rnd()-0.5)*fontSize*0.07, (rnd()-0.5)*fontSize*0.07);
      }
      ctx.restore();
      break;
    }

    /* 2 — 空心 */
    case 'outline': {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(fontSize * 0.024, lw + 1.4);
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 3 — 双描边 */
    case 'double': {
      ctx.strokeStyle = color;
      ctx.lineWidth = fontSize * 0.06 + lw;
      ctx.strokeText(text, 0, 0);
      ctx.lineWidth = Math.max(fontSize * 0.014, lw * 0.4 + 0.9);
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 4 — 硬影 */
    case 'shadow': {
      const off = fontSize * 0.05;
      ctx.fillStyle = color;
      for(let i=8;i>=1;i--){
        ctx.globalAlpha = 0.055 * i;
        ctx.fillText(text, off*i*0.85, off*i*0.85);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 5 — 立体 */
    case '3d': {
      const depth = fontSize * 0.1;
      const steps = Math.max(7, Math.round(fontSize / 12));
      const dark = darken(color, 0.52);
      ctx.fillStyle = dark; ctx.strokeStyle = dark;
      if(lw > 0) ctx.lineWidth = lw;
      for(let i=steps;i>=1;i--){
        const y = depth * i / steps;
        if(lw > 0) ctx.strokeText(text, 0, y);
        ctx.fillText(text, 0, y);
      }
      ctx.fillStyle = color; ctx.strokeStyle = color;
      if(lw > 0) ctx.lineWidth = lw;
      if(lw > 0) ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = lighten(color, 0.6);
      ctx.fillText(text, -fontSize * 0.012, -fontSize * 0.012);
      ctx.globalAlpha = 1;
      break;
    }

    /* 6 — 霓虹发光 */
    case 'neon': {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = fontSize * 0.5;
      ctx.fillText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.shadowBlur = fontSize * 0.16;
      ctx.fillStyle = lighten(color, 0.78);
      ctx.fillText(text, 0, 0);
      ctx.shadowBlur = 0;
      break;
    }

    /* 7 — 渐变 */
    case 'gradient': {
      const h = fontSize * 0.6;
      const grad = ctx.createLinearGradient(-w, -h, w, h);
      grad.addColorStop(0, color);
      grad.addColorStop(0.35, lighten(color, 0.62));
      grad.addColorStop(0.7, color);
      grad.addColorStop(1, lighten(color, 0.35));
      ctx.fillStyle = grad; ctx.strokeStyle = color;
      if(lw > 0) ctx.lineWidth = lw;
      if(lw > 0) ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 8 — 素描 */
    case 'sketch': {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.9, fontSize * 0.011) + lw * 0.4;
      for(let i=0;i<11;i++){
        ctx.globalAlpha = 0.22 + rnd() * 0.48;
        ctx.strokeText(text, (rnd()-0.5)*fontSize*0.07, (rnd()-0.5)*fontSize*0.07);
      }
      ctx.globalAlpha = 1;
      break;
    }

    /* 9 — 印章 */
    case 'stamp': {
      const pad = fontSize * 0.3;
      const bw = w + pad;
      const bh = fontSize * 0.52 + pad * 0.55;
      const r = fontSize * 0.075;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, fontSize * 0.055);
      roundRect(ctx, -bw, -bh, bw*2, bh*2, r); ctx.stroke();
      ctx.lineWidth = Math.max(1, fontSize * 0.018);
      roundRect(ctx, -bw*0.9, -bh*0.82, bw*1.8, bh*1.64, r*0.7); ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 10 — 像素 */
    case 'pixel': {
      const px = Math.max(2, Math.round(fontSize / 13));
      ctx.fillStyle = darken(color, 0.45);
      ctx.fillText(text, px*2, px*2);
      ctx.fillText(text, px, px);
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 11 — 故障 */
    case 'glitch': {
      const off = fontSize * 0.03;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = '#00e5ff';
      ctx.fillText(text, -off, 0);
      ctx.fillStyle = '#ff2bd6';
      ctx.fillText(text, off, 0);
      ctx.restore();
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 12 — 雕刻 */
    case 'engrave': {
      ctx.strokeStyle = 'rgba(255,255,255,.72)';
      ctx.lineWidth = Math.max(1, fontSize * 0.02);
      ctx.strokeText(text, -fontSize * 0.014, -fontSize * 0.014);
      ctx.strokeStyle = 'rgba(0,0,0,.5)';
      ctx.strokeText(text, fontSize * 0.014, fontSize * 0.014);
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 13 — 金属 */
    case 'gold': {
      const h = fontSize * 0.6;
      const grad = ctx.createLinearGradient(0, -h, 0, h);
      grad.addColorStop(0,    lighten(color, 0.78));
      grad.addColorStop(0.16, lighten(color, 0.28));
      grad.addColorStop(0.42, color);
      grad.addColorStop(0.5,  lighten(color, 0.9));
      grad.addColorStop(0.58, color);
      grad.addColorStop(0.82, darken(color, 0.28));
      grad.addColorStop(1,    lighten(color, 0.45));
      ctx.fillStyle = grad;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = darken(color, 0.55);
      ctx.lineWidth = Math.max(1, fontSize * 0.012);
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 14 — 点阵 */
    case 'dot': {
      const size = Math.max(6, Math.round(fontSize / 8));
      const pattern = makePattern(ctx, 'dot', color, size);
      ctx.fillStyle = pattern;
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.8, fontSize * 0.008);
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 15 — 粉笔 */
    case 'chalk': {
      const size = Math.max(7, Math.round(fontSize / 10));
      const pattern = makePattern(ctx, 'chalk', color, size);
      ctx.fillStyle = pattern;
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.6, fontSize * 0.006) + lw * 0.4;
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 16 — 水彩 */
    case 'watercolor': {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      for(let i=0;i<6;i++){
        ctx.globalAlpha = 0.16 + rnd() * 0.12;
        ctx.fillStyle = i % 2 ? lighten(color, 0.35) : color;
        ctx.fillText(text, (rnd()-0.5)*fontSize*0.14, (rnd()-0.5)*fontSize*0.14);
      }
      ctx.restore();
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 17 — 蓝图 */
    case 'blueprint': {
      const size = Math.max(6, Math.round(fontSize / 12));
      const pattern = makePattern(ctx, 'blueprint', color, size);
      ctx.fillStyle = pattern;
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.8, fontSize * 0.01) + lw * 0.5;
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 18 — 反白 */
    case 'invert': {
      const pad = fontSize * 0.28;
      const bh = fontSize * 0.62 + pad * 0.5;
      const bw = w + pad;
      ctx.fillStyle = color;
      roundRect(ctx, -bw, -bh, bw*2, bh*2, fontSize*0.08);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 19 — 木刻 */
    case 'woodcut': {
      ctx.fillStyle = color;
      ctx.fillText(text, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      const steps = Math.round(fontSize / 5);
      for(let i=0;i<steps;i++){
        ctx.globalAlpha = 0.18 + rnd() * 0.35;
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        const y = -fontSize * 0.5 + i * (fontSize / steps);
        ctx.fillRect(-textWidth/2 - 5, y, textWidth + 10, 0.8 + rnd() * 1.2);
      }
      ctx.restore();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.9, fontSize * 0.012) + lw * 0.5;
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 20 — 条纹 */
    case 'stripes': {
      const size = Math.max(7, Math.round(fontSize / 11));
      const pattern = makePattern(ctx, 'stripes', color, size);
      ctx.fillStyle = pattern;
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.6, fontSize * 0.008) + lw * 0.4;
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 21 — 虚线 */
    case 'dashed': {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(fontSize * 0.028, lw + 1.4);
      ctx.setLineDash([fontSize * 0.1, fontSize * 0.06]);
      ctx.strokeText(text, 0, 0);
      ctx.setLineDash([]);
      break;
    }

    /* 22 — 双色错位 */
    case 'offset': {
      const off = fontSize * 0.045;
      ctx.save();
      ctx.translate(-off, -off);
      ctx.fillStyle = lighten(color, 0.55);
      ctx.fillText(text, 0, 0);
      ctx.restore();
      ctx.save();
      ctx.translate(off, off);
      ctx.fillStyle = darken(color, 0.32);
      ctx.fillText(text, 0, 0);
      ctx.restore();
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 23 — 运动拖影 */
    case 'motion': {
      const span = fontSize * 0.36;
      const steps = 9;
      ctx.fillStyle = color;
      for(let i=steps;i>=1;i--){
        ctx.globalAlpha = 0.04 + 0.08 * (1 - i / steps);
        ctx.fillText(text, -span * i / steps, 0);
      }
      ctx.globalAlpha = 1;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 24 — 光晕 */
    case 'halo': {
      for(let i=5;i>=1;i--){
        ctx.globalAlpha = 0.12 + (5-i)*0.04;
        ctx.strokeStyle = lighten(color, 0.4);
        ctx.lineWidth = fontSize * 0.012 * i;
        ctx.strokeText(text, 0, 0);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 25 — 网格 */
    case 'grid': {
      const size = Math.max(7, Math.round(fontSize / 10));
      const pattern = makePattern(ctx, 'grid', color, size);
      ctx.fillStyle = pattern;
      ctx.fillText(text, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.8, fontSize * 0.012) + lw * 0.4;
      ctx.strokeText(text, 0, 0);
      break;
    }

    /* 26 — 贴纸白边 */
    case 'sticker': {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.96)';
      ctx.lineWidth = fontSize * 0.11 + lw;
      ctx.strokeText(text, 0, 0);
      ctx.lineWidth = fontSize * 0.07 + lw;
      ctx.strokeText(text, 0, 0);
      ctx.fillStyle = color;
      if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
      ctx.fillText(text, 0, 0);
      break;
    }

    /* 兜底 */
    case 'plain':
    default: {
      ctx.fillStyle = color; ctx.strokeStyle = color;
      ctx.shadowColor = 'rgba(0,0,0,.08)';
      ctx.shadowBlur = fontSize * 0.05;
      ctx.shadowOffsetX = fontSize * 0.01;
      ctx.shadowOffsetY = fontSize * 0.03;
      if(lw > 0) ctx.lineWidth = lw;
      if(lw > 0) ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      break;
    }
  }
}

/* 通用效果（用户覆盖） */
function paintGeneric(ctx, text, mode, color, fontSize, textWidth, bold){
  const lw = bold * (fontSize / 95);
  if(mode === 'glow'){
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = fontSize * 0.4;
    if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; }
    if(lw > 0) ctx.strokeText(text, 0, 0);
    ctx.fillText(text, 0, 0);
    ctx.fillText(text, 0, 0);
    ctx.shadowBlur = 0;
  } else if(mode === 'outline'){
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(fontSize * 0.026, lw + 1.4);
    ctx.strokeText(text, 0, 0);
  } else if(mode === 'shadow'){
    const off = fontSize * 0.05;
    ctx.fillStyle = color;
    for(let i=6;i>=1;i--){
      ctx.globalAlpha = 0.09 * i;
      ctx.fillText(text, off*i, off*i);
    }
    ctx.globalAlpha = 1;
    if(lw > 0){ ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0); }
    ctx.fillText(text, 0, 0);
  } else if(mode === 'gradient'){
    const h = fontSize * 0.6;
    const grad = ctx.createLinearGradient(-textWidth/2, -h, textWidth/2, h);
    grad.addColorStop(0, color);
    grad.addColorStop(1, lighten(color, 0.62));
    ctx.fillStyle = grad; ctx.strokeStyle = color;
    if(lw > 0) ctx.lineWidth = lw;
    if(lw > 0) ctx.strokeText(text, 0, 0);
    ctx.fillText(text, 0, 0);
  } else {
    ctx.fillStyle = color; ctx.strokeStyle = color;
    if(lw > 0) ctx.lineWidth = lw;
    if(lw > 0) ctx.strokeText(text, 0, 0);
    ctx.fillText(text, 0, 0);
  }
}

/* 装饰线 */
function drawDecoration(ctx, type, fontSize, color, textWidth){
  ctx.save();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.2, fontSize * 0.024);
  ctx.lineCap = 'round';
  ctx.globalAlpha = ctx.globalAlpha * 0.85;

  const w = textWidth / 2;
  const yBase = fontSize * 0.48;

  if(type === 'underline'){
    ctx.beginPath();
    ctx.moveTo(-w - fontSize*0.07, yBase);
    ctx.lineTo(w + fontSize*0.07, yBase);
    ctx.stroke();
  } else if(type === 'double'){
    ctx.beginPath();
    ctx.moveTo(-w - fontSize*0.07, yBase);
    ctx.lineTo(w + fontSize*0.07, yBase);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-w * 0.78, yBase + fontSize * 0.1);
    ctx.lineTo(w * 0.78, yBase + fontSize * 0.1);
    ctx.stroke();
  } else if(type === 'dots'){
    const r = Math.max(1.6, fontSize * 0.032);
    const gap = fontSize * 0.13;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(-w - fontSize*0.17 - i*gap, 0, r, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w + fontSize*0.17 + i*gap, 0, r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================================================================
   统一绘制
   ================================================================== */
function drawSignature(ctx, text, cfg, opts){
  ctx.save();
  ctx.globalAlpha = opts.opacity;
  ctx.translate(opts.cx, opts.cy);
  if(opts.skew){
    ctx.transform(1, 0, -Math.tan(opts.skew * Math.PI / 180), 1, 0, 0);
  }
  ctx.font = (cfg.weight || 400) + ' ' + opts.fontSize + 'px ' + cfg.family;
  if(supportsLS) ctx.letterSpacing = opts.letterSpacing + 'px';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const textWidth = measureWidth(ctx, text, opts.letterSpacing);

  if(opts.effect && opts.effect !== 'font'){
    /* 用户明确选择了通用效果，覆盖字体默认配方 */
    paintGeneric(ctx, text, opts.effect, opts.color, opts.fontSize, textWidth, opts.bold);
  } else {
    /* 使用字体自身的独立渲染配方 */
    paintMode(ctx, text, cfg.style || 'plain', opts.color, opts.fontSize, textWidth, opts.bold, text);
  }

  if(opts.decoration && opts.decoration !== 'none'){
    drawDecoration(ctx, opts.decoration, opts.fontSize, opts.color, textWidth);
  }

  ctx.restore();
}

function getCurrentFont(){
  const list = state.fontType === 'chinese' ? chineseFonts : englishFonts;
  return list.filter(function(f){ return f.id === state.fontId; })[0] || list[0];
}

/* ==================================================================
   预览渲染
   ================================================================== */
let rafId = null;

function requestRender(){
  if(rafId) return;
  rafId = requestAnimationFrame(function(){
    rafId = null;
    drawPreview();
  });
}

function drawPreview(){
  const text = state.name.trim();

  if(!text){
    previewCanvas.style.display = 'none';
    placeholder.style.display = 'block';
    btnExport.disabled = true;
    btnCopy.disabled = true;
    return;
  }
  previewCanvas.style.display = 'block';
  placeholder.style.display = 'none';
  btnExport.disabled = false;
  btnCopy.disabled = false;

  const cfg = getCurrentFont();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const paperW = paper.clientWidth;
  const cssW = Math.max(paperW - 40, 160);
  const cssH = 190;

  previewCanvas.width  = Math.round(cssW * dpr);
  previewCanvas.height = Math.round(cssH * dpr);
  previewCanvas.style.width  = cssW + 'px';
  previewCanvas.style.height = cssH + 'px';

  const ctx = previewCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  let fontSize = state.fontSize * Math.min(2.1, cssW / 620);
  fontSize = Math.min(fontSize, 210);

  let ls = state.letterSpacing * (fontSize / state.fontSize);

  ctx.font = (cfg.weight || 400) + ' ' + fontSize + 'px ' + cfg.family;
  if(supportsLS) ctx.letterSpacing = ls + 'px';

  let tw = measureWidth(ctx, text, ls);
  const maxW = cssW - 56;
  if(tw > maxW){
    fontSize *= maxW / tw;
    ls = state.letterSpacing * (fontSize / state.fontSize);
  }

  drawSignature(ctx, text, cfg, {
    fontSize: fontSize,
    color: state.color,
    letterSpacing: ls,
    skew: state.skew,
    bold: state.bold,
    opacity: state.opacity / 100,
    effect: state.effect,
    decoration: state.decoration,
    cx: cssW / 2,
    cy: cssH / 2 - 4
  });
}

/* ==================================================================
   导出 / 复制
   ================================================================== */
function buildExportCanvas(scale, bg){
  const cfg = getCurrentFont();
  const text = state.name.trim();
  const fs = state.fontSize;

  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = (cfg.weight || 400) + ' ' + fs + 'px ' + cfg.family;
  if(supportsLS) mctx.letterSpacing = state.letterSpacing + 'px';

  let tw = measureWidth(mctx, text, state.letterSpacing);
  tw += Math.abs(Math.tan(state.skew * Math.PI / 180)) * fs * 0.6;
  tw += state.bold * 2;

  const decoPad = state.decoration !== 'none' ? fs * 0.6 : 0;
  const padX = Math.round(fs * 0.55) + decoPad;
  const padY = Math.round(fs * 0.42);
  const w = Math.max(Math.ceil(tw) + padX * 2, 240);
  const h = Math.max(Math.ceil(fs * 1.55) + padY * 2, 140);

  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(w * scale);
  canvas.height = Math.round(h * scale);

  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  if(bg && bg !== 'transparent'){
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
  }

  drawSignature(ctx, text, cfg, {
    fontSize: fs,
    color: state.color,
    letterSpacing: state.letterSpacing,
    skew: state.skew,
    bold: state.bold,
    opacity: state.opacity / 100,
    effect: state.effect,
    decoration: state.decoration,
    cx: w / 2,
    cy: h / 2
  });

  return canvas;
}

function safeName(text){
  return text.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_') || 'signature';
}

function exportPNG(){
  const text = state.name.trim();
  if(!text){ showToast('请先输入名字'); return; }

  let canvas;
  try{
    canvas = buildExportCanvas(state.exportScale, state.bg);
  }catch(e){
    showToast('生成失败，请换个字体试试');
    return;
  }

  canvas.toBlob(function(blob){
    if(!blob){ showToast('导出失败，请重试'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '签名_' + safeName(text) + '_' + state.exportScale + 'x.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2500);
    showToast('已导出 PNG ✨');
  }, 'image/png');
}

async function copyPNG(){
  const text = state.name.trim();
  if(!text){ showToast('请先输入名字'); return; }
  if(!navigator.clipboard || !window.ClipboardItem){
    showToast('浏览器不支持，请使用导出');
    return;
  }
  try{
    const canvas = buildExportCanvas(2, state.bg);
    const item = new ClipboardItem({
      'image/png': new Promise(function(resolve, reject){
        canvas.toBlob(function(b){
          if(b) resolve(b); else reject(new Error('toBlob failed'));
        }, 'image/png');
      })
    });
    await navigator.clipboard.write([item]);
    showToast('已复制到剪贴板 ✅');
  }catch(err){
    showToast('复制失败，请用导出按钮');
  }
}

/* ==================================================================
   Toast
   ================================================================== */
let toastTimer = null;
function showToast(msg){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 2200);
}

/* ==================================================================
   UI 构建
   ================================================================== */
function buildFontGrid(){
  const list = state.fontType === 'chinese' ? chineseFonts : englishFonts;
  const frag = document.createDocumentFragment();

  list.forEach(function(cfg){
    const card = document.createElement('div');
    card.className = 'font-card' + (cfg.id === state.fontId ? ' active' : '');
    card.dataset.fontId = cfg.id;
    card.title = cfg.label;
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');

    const fp = document.createElement('span');
    fp.className = 'fp';
    fp.dataset.s = cfg.style || 'plain';
    fp.style.fontFamily = cfg.family;
    fp.style.fontWeight = cfg.weight || 400;
    fp.textContent = cfg.preview;

    const fn = document.createElement('span');
    fn.className = 'fn';
    fn.textContent = cfg.label;

    card.appendChild(fp);
    card.appendChild(fn);

    card.addEventListener('click', function(){ selectFont(cfg.id); });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectFont(cfg.id); }
    });
    frag.appendChild(card);
  });

  fontGrid.innerHTML = '';
  fontGrid.appendChild(frag);
  fontCount.textContent = list.length + ' 款';
}

function buildSwatches(){
  swatchBox.innerHTML = '';
  presetColors.forEach(function(pc){
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = pc.color;
    dot.dataset.color = pc.color;
    dot.title = pc.label;
    dot.setAttribute('role','button');
    dot.setAttribute('aria-label', pc.label);
    dot.addEventListener('click', function(){ selectColor(pc.color); });
    swatchBox.appendChild(dot);
  });
  swatchBox.appendChild(customColor);
}

function selectFont(fontId){
  state.fontId = fontId;
  const cards = fontGrid.querySelectorAll('.font-card');
  for(let i=0;i<cards.length;i++){
    cards[i].classList.toggle('active', cards[i].dataset.fontId === fontId);
  }
  requestRender();
  saveState();
}

function selectColor(color){
  state.color = color;
  const dots = swatchBox.querySelectorAll('.swatch');
  for(let i=0;i<dots.length;i++){
    dots[i].classList.toggle('active',
      (dots[i].dataset.color || '').toLowerCase() === color.toLowerCase());
  }
  customColor.value = /^#[0-9a-f]{6}$/i.test(color) ? color : '#1a1a1a';
  requestRender();
  saveState();
}

function switchFontType(type){
  if(state.fontType === type) return;
  state.fontType = type;
  const list = type === 'chinese' ? chineseFonts : englishFonts;
  state.fontId = list[0].id;

  segThumb.classList.toggle('right', type === 'english');
  for(let i=0;i<segBtns.length;i++){
    segBtns[i].classList.toggle('active', segBtns[i].dataset.type === type);
  }
  buildFontGrid();
  requestRender();
  saveState();
}

/* ==================================================================
   滑块 + 数字 + 步进
   ================================================================== */
function updateFill(el){
  const min = parseFloat(el.min);
  const max = parseFloat(el.max);
  const val = parseFloat(el.value);
  const pct = ((val - min) / (max - min)) * 100;
  el.style.setProperty('--fill', pct + '%');
}

function applyValue(key, value, fromStep){
  const c = CONTROLS.filter(function(x){ return x.key === key; })[0];
  if(!c) return;
  const v = clamp(value, c.min, c.max);
  const snapped = Math.round(v / c.step) * c.step;
  const final = clamp(+snapped.toFixed(4), c.min, c.max);

  state[key] = final;

  const slider = document.getElementById(c.slider);
  const num    = document.getElementById(c.num);

  if(+slider.value !== final) slider.value = final;
  if(document.activeElement !== num || fromStep){
    num.value = final;
  }
  updateFill(slider);

  requestRender();
  saveState();
}

function syncControls(){
  CONTROLS.forEach(function(c){
    const v = state[c.key];
    const slider = document.getElementById(c.slider);
    const num    = document.getElementById(c.num);
    slider.value = v;
    num.value = v;
    updateFill(slider);
  });
}

/* ==================================================================
   主题
   ================================================================== */
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  btnTheme.textContent = theme === 'light' ? '☀️' : '🌙';
}

/* ==================================================================
   同步 UI
   ================================================================== */
function syncUI(){
  applyTheme(state.theme);

  nameInput.value = state.name;
  charCount.textContent = state.name.length + ' / 30';

  segThumb.classList.toggle('right', state.fontType === 'english');
  for(let i=0;i<segBtns.length;i++){
    segBtns[i].classList.toggle('active', segBtns[i].dataset.type === state.fontType);
  }

  syncControls();

  for(let i=0;i<scaleChips.length;i++){
    scaleChips[i].classList.toggle('active', +scaleChips[i].dataset.scale === state.exportScale);
  }
  for(let i=0;i<bgChips.length;i++){
    bgChips[i].classList.toggle('active', bgChips[i].dataset.bg === state.bg);
  }
  for(let i=0;i<effectChips.length;i++){
    effectChips[i].classList.toggle('active', effectChips[i].dataset.effect === state.effect);
  }
  for(let i=0;i<decoChips.length;i++){
    decoChips[i].classList.toggle('active', decoChips[i].dataset.deco === state.decoration);
  }

  selectColor(state.color);
  buildFontGrid();
}

/* ==================================================================
   事件绑定
   ================================================================== */
nameInput.addEventListener('input', function(){
  state.name = nameInput.value;
  charCount.textContent = state.name.length + ' / 30';
  requestRender();
});

btnClear.addEventListener('click', function(){
  nameInput.value = '';
  state.name = '';
  charCount.textContent = '0 / 30';
  requestRender();
  nameInput.focus();
});

segBtns.forEach(function(btn){
  btn.addEventListener('click', function(){ switchFontType(btn.dataset.type); });
});

customColor.addEventListener('input', function(){ selectColor(customColor.value); });

CONTROLS.forEach(function(c){
  const slider = document.getElementById(c.slider);
  const num    = document.getElementById(c.num);

  slider.addEventListener('input', function(){
    applyValue(c.key, +slider.value, false);
  });

  num.addEventListener('input', function(){
    const v = parseFloat(num.value);
    if(isNaN(v)) return;
    applyValue(c.key, v, false);
  });

  num.addEventListener('blur', function(){
    num.value = state[c.key];
  });

  num.addEventListener('keydown', function(e){
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      applyValue(c.key, state[c.key] + c.step, true);
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      applyValue(c.key, state[c.key] - c.step, true);
    }
  });
});

stepBtns.forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.preventDefault();
    const key = btn.dataset.key;
    const dir = +btn.dataset.dir;
    const c = CONTROLS.filter(function(x){ return x.key === key; })[0];
    if(!c) return;
    applyValue(key, state[key] + dir * c.step, true);
  });
});

scaleChips.forEach(function(chip){
  chip.addEventListener('click', function(){
    state.exportScale = +chip.dataset.scale;
    scaleChips.forEach(function(c){ c.classList.toggle('active', c === chip); });
    saveState();
  });
});

bgChips.forEach(function(chip){
  chip.addEventListener('click', function(){
    state.bg = chip.dataset.bg;
    bgChips.forEach(function(c){ c.classList.toggle('active', c === chip); });
    saveState();
  });
});

effectChips.forEach(function(chip){
  chip.addEventListener('click', function(){
    state.effect = chip.dataset.effect;
    effectChips.forEach(function(c){ c.classList.toggle('active', c === chip); });
    requestRender();
    saveState();
  });
});

decoChips.forEach(function(chip){
  chip.addEventListener('click', function(){
    state.decoration = chip.dataset.deco;
    decoChips.forEach(function(c){ c.classList.toggle('active', c === chip); });
    requestRender();
    saveState();
  });
});

btnExport.addEventListener('click', exportPNG);
btnCopy.addEventListener('click', copyPNG);

btnTheme.addEventListener('click', function(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme(state.theme);
  saveState();
});

/* 随机风格 */
btnRandom.addEventListener('click', function(){
  const hasCJK = /[\u4e00-\u9fa5]/.test(state.name);
  const wantChinese = state.name ? hasCJK : Math.random() < 0.5;
  const pool = wantChinese ? chineseFonts : englishFonts;
  const type = wantChinese ? 'chinese' : 'english';

  if(state.fontType !== type){
    state.fontType = type;
    segThumb.classList.toggle('right', type === 'english');
    segBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.type === type); });
  }

  const font = pool[Math.floor(Math.random() * pool.length)];
  state.fontId = font.id;
  state.color = presetColors[Math.floor(Math.random() * presetColors.length)].color;
  state.fontSize = 78 + Math.floor(Math.random() * 11) * 6;
  state.letterSpacing = Math.floor(Math.random() * 9);
  state.skew = Math.floor(Math.random() * 21) - 8;
  state.bold = [0, 0, 0.5, 1, 1.5][Math.floor(Math.random() * 5)];
  state.opacity = 70 + Math.floor(Math.random() * 7) * 5;
  state.effect = 'font';
  state.decoration = ['none','none','underline','double','dots'][Math.floor(Math.random() * 5)];

  syncUI();
  requestRender();
  saveState();
  showToast('已随机生成风格 🎲');
});

btnReset.addEventListener('click', function(){
  Object.keys(defaultState).forEach(function(k){
    state[k] = defaultState[k];
  });
  syncUI();
  requestRender();
  saveState();
  showToast('已重置所有设置');
});

let resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(requestRender, 180);
});

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    if(state.name.trim()) exportPNG();
  }
  if(e.key === 'Escape' && document.activeElement === nameInput){
    nameInput.blur();
  }
});

syncUI();
loadAllFonts();
