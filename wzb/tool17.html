<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本导出工具 · Liquid Glass</title>
<style>
:root{
  --text:#18202b;
  --muted:#6d7480;
  --glass:rgba(255,255,255,.56);
  --glass-strong:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.72);
  --shadow:0 24px 70px rgba(31,48,74,.16), inset 0 1px 0 rgba(255,255,255,.8);
  --blue:#1677ff;
  --blue2:#5aa2ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%,rgba(126,190,255,.48),transparent 32%),
    radial-gradient(circle at 88% 18%,rgba(210,183,255,.42),transparent 31%),
    radial-gradient(circle at 50% 92%,rgba(117,229,211,.35),transparent 34%),
    linear-gradient(135deg,#edf5ff 0%,#f7f4ff 48%,#eefaf8 100%);
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(10px);pointer-events:none;z-index:-1
}
body:before{width:260px;height:260px;background:rgba(255,255,255,.52);left:-70px;top:38%}
body:after{width:340px;height:340px;background:rgba(255,255,255,.35);right:-100px;bottom:4%}
.app{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:28px 0 38px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(218,235,255,.46));
  border:1px solid var(--line);box-shadow:0 12px 30px rgba(56,93,145,.15),inset 0 1px 1px #fff;
  backdrop-filter:blur(22px) saturate(1.4);font-size:23px
}
.brand h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.5px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.status{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;
  background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.72);
  backdrop-filter:blur(18px);font-size:12px;color:#687282
}
.dot{width:7px;height:7px;border-radius:50%;background:#28c76f;box-shadow:0 0 0 4px rgba(40,199,111,.12)}
.card{
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);
  border-radius:30px;overflow:hidden;
}
.hero{padding:27px 28px 20px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
h2{font-size:27px;letter-spacing:-1px;margin:0 0 7px}
.sub{color:var(--muted);font-size:14px;margin:0;line-height:1.65}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);font-size:11px;color:#657082}
.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,280px);gap:18px;padding:0 28px 28px;align-items:stretch}
.editor,.settings{min-height:100%;
  background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.72);
  border-radius:22px;padding:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.72)
}
.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.label{font-size:12px;font-weight:700;color:#4d5665}
.counter{font-size:11px;color:#8b93a0}
input,textarea{
  width:100%;border:1px solid rgba(255,255,255,.88);outline:none;color:var(--text);
  background:rgba(255,255,255,.6);box-shadow:inset 0 1px 5px rgba(61,82,110,.05),0 1px 0 rgba(255,255,255,.7);
  transition:.2s ease;font:inherit
}
input{height:46px;padding:0 14px;border-radius:14px;font-size:14px}
textarea{height:clamp(300px, 42vh, 430px);resize:vertical;min-height:260px;padding:15px;border-radius:17px;font-size:14px;line-height:1.75}
input:focus,textarea:focus{border-color:rgba(22,119,255,.38);box-shadow:0 0 0 4px rgba(22,119,255,.09),inset 0 1px 5px rgba(61,82,110,.05)}
textarea::placeholder,input::placeholder{color:#a2a9b4}
.settings{display:flex;flex-direction:column;gap:15px;justify-content:flex-start}
.setting-title{font-size:13px;font-weight:750}
.tip{font-size:11px;color:#8a929e;line-height:1.6}
.divider{height:1px;background:rgba(120,140,165,.13);margin:1px 0}
.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.38);font-size:12px}
.switch{width:38px;height:22px;padding:2px;border-radius:999px;background:#b8c1ce;transition:.2s;cursor:pointer}
.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.2s}
.switch.on{background:var(--blue)} .switch.on i{transform:translateX(16px)}
.actions{display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
button{
  border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;transition:.18s ease;
  border-radius:14px;height:45px;padding:0 16px
}
.primary{
  flex:1 1 100%;min-width:0;color:#fff;background:linear-gradient(135deg,#1677ff,#4e9cff);
  box-shadow:0 9px 20px rgba(22,119,255,.24),inset 0 1px 0 rgba(255,255,255,.4)
}
.secondary{color:#566171;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.78)}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.98)}
.footer{display:flex;justify-content:space-between;color:#89919d;font-size:11px;padding:13px 4px 0}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:12px 16px;border-radius:999px;background:rgba(28,35,47,.84);color:#fff;font-size:12px;
  backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.18);transition:.25s
}
.toast.show{opacity:1;transform:translate(-50%,0)}


.feature-bar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.mini-btn{
  height:32px;padding:0 11px;border-radius:10px;border:1px solid rgba(255,255,255,.72);
  background:rgba(255,255,255,.45);color:#596475;font-size:11px;font-weight:650;cursor:pointer;
  transition:.18s ease;backdrop-filter:blur(12px)
}
.mini-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.68)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats-grid>div{
  padding:10px 9px;border-radius:13px;background:rgba(255,255,255,.36);
  border:1px solid rgba(255,255,255,.58);display:flex;flex-direction:column;gap:2px
}
.stats-grid b{font-size:16px;letter-spacing:-.3px}
.stats-grid span{font-size:10px;color:#8a929e}

.focus-restore{
  position:fixed;right:22px;bottom:22px;z-index:20;
  display:none;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.76);
  background:rgba(255,255,255,.68);color:#4f5b6b;font-size:12px;font-weight:750;
  box-shadow:0 14px 34px rgba(31,48,74,.18),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);
}
body.focus-mode .focus-restore{display:flex}
body.dark .focus-restore{
  background:rgba(35,41,52,.82);border-color:rgba(255,255,255,.13);color:#f0f3f8;
  box-shadow:0 14px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08)
}
@media(max-width:800px){
  .content{grid-template-columns:1fr}
}
@media(max-width:520px){
  .focus-restore{right:14px;bottom:14px}
}

body.focus-mode .hero,
body.focus-mode .topbar{display:none}
body.focus-mode .app{width:min(1000px,calc(100% - 24px));padding-top:18px}
body.focus-mode .settings{display:none}
body.focus-mode .content{grid-template-columns:1fr;padding:18px}
body.focus-mode .editor{padding:22px}
body.dark .mini-btn{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.12);color:#d8dee8}
body.dark .mini-btn:hover{background:rgba(255,255,255,.13)}
body.dark .stats-grid>div{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
body.dark .stats-grid span{color:#8f9aaa}

/* iOS 26 Light / Dark theme */
body.dark{
  --text:#f5f7fb;
  --muted:#aeb6c4;
  --glass:rgba(24,28,36,.56);
  --glass-strong:rgba(28,33,43,.72);
  --line:rgba(255,255,255,.13);
  --shadow:0 24px 70px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
  --blue:#4d9cff;
  --blue2:#77b5ff;
  background:
    radial-gradient(circle at 10% 10%,rgba(52,108,178,.34),transparent 32%),
    radial-gradient(circle at 88% 18%,rgba(108,73,156,.28),transparent 31%),
    radial-gradient(circle at 50% 92%,rgba(43,130,119,.22),transparent 34%),
    linear-gradient(135deg,#0b111b 0%,#151522 48%,#0c1717 100%);
}
body.dark .logo,
body.dark .status,
body.dark .card,
body.dark .editor,
body.dark .settings{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.12);
}
body.dark input,
body.dark textarea,
body.dark .option,
body.dark .secondary,
body.dark .badge{
  background:rgba(255,255,255,.075);
  border-color:rgba(255,255,255,.12);
  color:var(--text);
}
body.dark input::placeholder,
body.dark textarea::placeholder{color:#737d8d}
body.dark .divider{background:rgba(255,255,255,.09)}
body.dark .secondary{color:#d8dee8}
body.dark .tip,
body.dark .counter,
body.dark .footer,
body.dark .sub,
body.dark .brand p{color:#9aa5b5}
body.dark .switch{background:#4b5564}
body.dark .switch.on{background:var(--blue)}
body.dark .dot{box-shadow:0 0 0 4px rgba(40,199,111,.13)}
.theme-toggle{
  width:42px;height:42px;padding:0;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.72);
  color:#536070;box-shadow:0 10px 24px rgba(56,93,145,.12),inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  font-size:18px;
}
body.dark .theme-toggle{
  background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.12);color:#f4f7fb;
  box-shadow:0 10px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);
}
.theme-toggle:hover{transform:translateY(-1px)}
@media(max-width:520px){.theme-toggle{width:40px;height:40px}}

@media(max-width:800px){
  .content{grid-template-columns:1fr}
  .hero-row{flex-direction:column}.badges{justify-content:flex-start}
}
@media(max-width:520px){
  .app{width:min(100% - 18px,1120px);padding-top:12px}
  .hero,.content{padding-left:15px;padding-right:15px}
  .hero{padding-top:20px}.card{border-radius:24px}
  h2{font-size:23px}.topbar{margin-bottom:12px}.status{display:none}
  textarea{height:300px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">✦</div>
      <div><h1>文本导出工具</h1><p>简洁、快速、完全本地处理</p></div>
    </div>
    <div style="display:flex;align-items:center;gap:9px">
      <div class="status"><span class="dot"></span>本地运行 · 无需上传</div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换浅色/深色模式" title="切换浅色/深色模式">☾</button>
    </div>
  </header>

  <main class="card">
    <section class="hero">
      <div class="hero-row">
        <div>
          <h2>把文字保存成 TXT</h2>
          <p class="sub">输入文本，设置文件名，一键导出 UTF-8 编码的纯文本文件。</p>
        </div>
        <div class="badges"><span class="badge">UTF-8</span><span class="badge">自动保存</span><span class="badge">离线可用</span></div>
      </div>
    </section>

    <section class="content">
      <div class="editor">
        <div class="field-head"><span class="label">文件名</span><span class="counter" id="sizeInfo">0 字</span></div>
        <input id="filename" placeholder="例如：我的文档" value="我的文档">
        <div style="height:14px"></div>
        <div class="field-head"><span class="label">文本内容</span><span class="counter" id="count">0 字符</span></div>
        
        <div class="feature-bar">
          <button class="mini-btn" id="importBtn">↑ 导入 TXT</button>
          <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
          <button class="mini-btn" id="pasteBtn">⌘ 粘贴</button>
          <button class="mini-btn" id="findBtn">⌕ 查找/替换</button>
          <button class="mini-btn" id="cleanBtn">✦ 清理格式</button>
          <button class="mini-btn" id="undoBtn">↶ 撤销</button>
          <button class="mini-btn" id="redoBtn">↷ 重做</button>
        </div>
<textarea id="content" placeholder="在这里输入或粘贴文本内容……"></textarea>
        <div class="footer"><span id="saveState">等待输入</span><span>内容仅保存在当前浏览器</span></div>
      </div>

      <aside class="settings">
        <div class="setting-title">导出设置</div>
        <div class="option"><span>UTF-8 BOM</span><div class="switch on" id="bomSwitch"><i></i></div></div>
        <div class="tip">开启后可提高部分 Windows 文本编辑器对中文 UTF-8 文件的识别兼容性。</div>
        <div class="divider"></div>
        <div class="setting-title">快捷操作</div>
        <button class="primary" id="exportBtn">↓ 导出 TXT</button>
        <button class="secondary" id="copyBtn">复制全部内容</button>
        <button class="secondary" id="clearBtn">清空内容</button>
        <div class="divider"></div>
        
        <div class="divider"></div>
        <div class="setting-title">实时统计</div>
        <div class="stats-grid">
          <div><b id="statChars">0</b><span>字符</span></div>
          <div><b id="statWords">0</b><span>词语</span></div>
          <div><b id="statLines">0</b><span>行</span></div>
          <div><b id="statBytes">0 B</b><span>大小</span></div>
        </div>
        <div class="option"><span>专注阅读模式</span><div class="switch" id="focusSwitch"><i></i></div></div>
<div class="tip">提示：输入内容会自动保存。重新打开页面后可继续编辑。</div>
      </aside>
    </section>
  </main>
</div>
<button class="focus-restore" id="focusRestore">↙ 恢复完整界面</button>
<div class="toast" id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const content=document.getElementById('content');
  const filename=document.getElementById('filename');
  const count=document.getElementById('count');
  const sizeInfo=document.getElementById('sizeInfo');
  const saveState=document.getElementById('saveState');
  const toast=document.getElementById('toast');
  const bomSwitch=document.getElementById('bomSwitch');
  let bom=true;

  const show=(msg)=>{
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(show.t); show.t=setTimeout(()=>toast.classList.remove('show'),1800);
  };
  const update=()=>{
    const text=content.value;
    count.textContent=`${text.length.toLocaleString()} 字符`;
    sizeInfo.textContent=`${text.length.toLocaleString()} 字`;
    saveState.textContent=text ? '已自动保存' : '等待输入';
    localStorage.setItem('txtExportToolContent',text);
    localStorage.setItem('txtExportToolFilename',filename.value);
  };
  content.addEventListener('input',update);
  filename.addEventListener('input',update);

  const saved=localStorage.getItem('txtExportToolContent');
  const savedName=localStorage.getItem('txtExportToolFilename');
  if(saved){content.value=saved; if(savedName) filename.value=savedName; update();}

  bomSwitch.addEventListener('click',()=>{
    bom=!bom; bomSwitch.classList.toggle('on',bom);
  });

  document.getElementById('copyBtn').addEventListener('click',async()=>{
    if(!content.value){show('没有可复制的内容');return;}
    try{await navigator.clipboard.writeText(content.value);show('已复制全部内容');}
    catch{show('复制失败，请手动复制');}
  });

  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(content.value && !confirm('确定要清空当前内容吗？')) return;
    content.value=''; update(); show('内容已清空');
  });

  document.getElementById('exportBtn').addEventListener('click',()=>{
    if(!content.value.trim()){show('请输入要导出的文本内容');content.focus();return;}
    let name=filename.value.trim()||'未命名文档';
    name=name.replace(/[\\/:*?"<>|]/g,'_');
    if(!/\.txt$/i.test(name)) name+='.txt';
    const data=(bom?'\uFEFF':'')+content.value;
    const blob=new Blob([data],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),500);
    show(`已导出：${name}`);
  });
  // 首屏布局协调：让左侧输入框与右侧功能栏的默认高度保持视觉一致
  const editorPanel=document.querySelector('.editor');
  const settingsPanel=document.querySelector('.settings');
  const syncEditorHeight=()=>{
    if(!editorPanel || !settingsPanel || document.body.classList.contains('focus-mode')) return;
    const target=Math.max(300, Math.min(430, settingsPanel.getBoundingClientRect().height - 122));
    content.style.height=target+'px';
  };
  window.addEventListener('load',syncEditorHeight);
  window.addEventListener('resize',syncEditorHeight);
  setTimeout(syncEditorHeight,80);

  // 扩展功能：导入、粘贴、查找替换、格式清理、撤销/重做、实时统计、专注模式
  const fileInput=document.getElementById('fileInput');
  const importBtn=document.getElementById('importBtn');
  const pasteBtn=document.getElementById('pasteBtn');
  const findBtn=document.getElementById('findBtn');
  const cleanBtn=document.getElementById('cleanBtn');
  const undoBtn=document.getElementById('undoBtn');
  const redoBtn=document.getElementById('redoBtn');
  const focusSwitch=document.getElementById('focusSwitch');
  const statChars=document.getElementById('statChars');
  const statWords=document.getElementById('statWords');
  const statLines=document.getElementById('statLines');
  const statBytes=document.getElementById('statBytes');

  let history=[], historyIndex=-1, restoring=false;
  const pushHistory=()=>{
    if(restoring) return;
    const v=content.value;
    if(history[historyIndex]===v) return;
    history=history.slice(0,historyIndex+1);
    history.push(v);
    if(history.length>80) history.shift();
    historyIndex=history.length-1;
  };
  const refreshStats=()=>{
    const text=content.value;
    const words=(text.trim().match(/\S+/g)||[]).length;
    const lines=text ? text.split(/\r\n|\r|\n/).length : 0;
    const bytes=new Blob([text]).size;
    statChars.textContent=text.length.toLocaleString();
    statWords.textContent=words.toLocaleString();
    statLines.textContent=lines.toLocaleString();
    statBytes.textContent=bytes<1024 ? `${bytes} B` : `${(bytes/1024).toFixed(1)} KB`;
  };
  const syncAll=()=>{update();refreshStats();};
  content.addEventListener('input',()=>{pushHistory();refreshStats();});
  pushHistory(); refreshStats();

  importBtn.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',()=>{
    const file=fileInput.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{content.value=reader.result;filename.value=file.name.replace(/\.txt$/i,'');pushHistory();syncAll();show(`已导入：${file.name}`);};
    reader.onerror=()=>show('文件读取失败');
    reader.readAsText(file,'UTF-8');
    fileInput.value='';
  });

  pasteBtn.addEventListener('click',async()=>{
    try{
      const text=await navigator.clipboard.readText();
      if(!text){show('剪贴板没有文本');return;}
      const start=content.selectionStart,end=content.selectionEnd;
      content.value=content.value.slice(0,start)+text+content.value.slice(end);
      content.selectionStart=content.selectionEnd=start+text.length;
      pushHistory();syncAll();content.focus();show('已粘贴文本');
    }catch{show('浏览器禁止读取剪贴板，请使用 Ctrl+V');}
  });

  findBtn.addEventListener('click',()=>{
    const find=prompt('查找内容：');
    if(find===null || find==='') return;
    const replace=prompt(`将「${find}」替换为：`, '');
    if(replace===null)return;
    const escaped=find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const regex=new RegExp(escaped,'g');
    const matches=content.value.match(regex);
    if(!matches){show('未找到匹配内容');return;}
    content.value=content.value.replace(regex,replace);
    pushHistory();syncAll();show(`已替换 ${matches.length} 处`);
  });

  cleanBtn.addEventListener('click',()=>{
    if(!content.value){show('没有可清理的内容');return;}
    const cleaned=content.value
      .replace(/\uFEFF/g,'')
      .replace(/[ \t]+\n/g,'\n')
      .replace(/\n{3,}/g,'\n\n')
      .replace(/^\s+|\s+$/g,'');
    if(cleaned===content.value){show('当前格式已经很干净');return;}
    content.value=cleaned;pushHistory();syncAll();show('已清理多余空格与空行');
  });

  undoBtn.addEventListener('click',()=>{
    if(historyIndex<=0){show('没有可撤销的操作');return;}
    historyIndex--;restoring=true;content.value=history[historyIndex];restoring=false;syncAll();show('已撤销');
  });
  redoBtn.addEventListener('click',()=>{
    if(historyIndex>=history.length-1){show('没有可重做的操作');return;}
    historyIndex++;restoring=true;content.value=history[historyIndex];restoring=false;syncAll();show('已重做');
  });

  const setFocusMode=(on)=>{
    document.body.classList.toggle('focus-mode',on);
    if(on) content.style.height=''; else setTimeout(syncEditorHeight,30);
    focusSwitch.classList.toggle('on',on);
    if(!on) document.getElementById('content').focus();
  };
  focusSwitch.addEventListener('click',()=>{
    const on=!document.body.classList.contains('focus-mode');
    setFocusMode(on);
    show(on?'已进入专注模式':'已退出专注模式');
  });
  document.getElementById('focusRestore').addEventListener('click',()=>{
    setFocusMode(false);
    show('已恢复完整界面');
  });

  // 支持把 TXT 文件直接拖入编辑器
  ['dragenter','dragover'].forEach(evt=>content.addEventListener(evt,e=>{e.preventDefault();content.style.borderColor='rgba(22,119,255,.55)';}));
  ['dragleave','drop'].forEach(evt=>content.addEventListener(evt,e=>{e.preventDefault();content.style.borderColor='';}));
  content.addEventListener('drop',e=>{
    const file=e.dataTransfer.files[0];
    if(!file)return;
    if(!/\.txt$/i.test(file.name) && file.type!=='text/plain'){show('这里只支持 TXT 文本文件');return;}
    const reader=new FileReader();
    reader.onload=()=>{content.value=reader.result;filename.value=file.name.replace(/\.txt$/i,'');pushHistory();syncAll();show(`已导入：${file.name}`);};
    reader.readAsText(file,'UTF-8');
  });

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
      e.preventDefault();document.getElementById('exportBtn').click();
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){
      e.preventDefault();findBtn.click();
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
      e.preventDefault();undoBtn.click();
    }
    if(e.key==='Escape' && document.body.classList.contains('focus-mode')){e.preventDefault();setFocusMode(false);show('已恢复完整界面');}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){
      e.preventDefault();redoBtn.click();
    }
  });

  // 浅色 / 深色模式：跟随系统首次进入，并记住用户选择
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('txtExportToolTheme');
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialDark = savedTheme ? savedTheme === 'dark' : systemDark;

  const applyTheme = (dark, save=true) => {
    document.body.classList.toggle('dark', dark);
    themeToggle.textContent = dark ? '☀' : '☾';
    themeToggle.title = dark ? '切换浅色模式' : '切换深色模式';
    themeToggle.setAttribute('aria-label', themeToggle.title);
    if(save) localStorage.setItem('txtExportToolTheme', dark ? 'dark' : 'light');
  };

  applyTheme(initialDark, false);

  themeToggle.addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
    show(document.body.classList.contains('dark') ? '已切换深色模式' : '已切换浅色模式');
  });

});
</script>
</body>
</html>
