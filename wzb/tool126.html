<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贺卡生成器 · Card Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&family=Dancing+Script:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700;900&family=Quicksand:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#16171f; --panel:#1f212c; --panel2:#262936; --panel3:#313547;
    --border:#363a4d; --text:#eef0f8; --muted:#939ab4; --accent:#7c9bff;
    --accent2:#ff8ac4; --good:#3fd6a0; --warn:#ffb454; --danger:#ff6f6f;
    --radius:14px; --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Quicksand","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden; font-size:14px;
  }
  button{font-family:inherit;cursor:pointer;color:var(--text);}
  input,select{font-family:inherit;color:var(--text);}
  /* layout */
  .app{display:flex;flex-direction:column;height:100vh;}
  header{
    display:flex;align-items:center;gap:10px;padding:11px 18px;
    background:linear-gradient(90deg,#1c1e29,#262a3a);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 14px rgba(0,0,0,.3);
  }
  header .logo{font-weight:700;font-size:16px;letter-spacing:.4px;display:flex;align-items:center;gap:9px;
    background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  header .logo .dot{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent);-webkit-text-fill-color:initial;}
  header .spacer{flex:1;}
  .tbtn{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:8px 13px;font-size:13px;transition:.16s;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
  }
  .tbtn:hover{background:var(--panel3);border-color:var(--accent);transform:translateY(-1px);}
  .tbtn:active{transform:translateY(0);}
  .tbtn.primary{background:linear-gradient(135deg,var(--accent),#9a7cff);border:none;color:#fff;font-weight:600;}
  .tbtn.primary:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(124,155,255,.4);}
  .tbtn.good{background:linear-gradient(135deg,#28c98f,#3fd6a0);border:none;color:#05281d;font-weight:600;}
  main{display:grid;grid-template-columns:300px 1fr 300px;flex:1;min-height:0;}
  aside{background:var(--panel);overflow-y:auto;padding:14px;}
  aside.left{border-right:1px solid var(--border);}
  aside.right{border-left:1px solid var(--border);}
  .stage{
    position:relative;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 18% 18%,#2a2e40 0,transparent 42%),
      radial-gradient(circle at 82% 82%,#242838 0,transparent 42%),
      #121319;
    overflow:auto;padding:24px;
  }
  /* section */
  .sec{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;background:linear-gradient(180deg,var(--panel2),#232633);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .sec>h3{
    margin:0;padding:12px 13px;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:8px;user-select:none;
    background:rgba(0,0,0,.12);border-left:3px solid var(--accent);transition:.15s;
  }
  .sec>h3:hover{background:rgba(124,155,255,.08);}
  .sec>h3 .chev{margin-left:auto;transition:.2s;opacity:.6;font-size:11px;}
  .sec.collapsed>h3 .chev{transform:rotate(-90deg);}
  .sec .body{padding:13px;display:flex;flex-direction:column;gap:11px;}
  .sec.collapsed .body{display:none;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field>label{font-size:12px;color:var(--muted);}
  .row{display:flex;gap:8px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  input[type=text],input[type=number],select,textarea{
    background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:13px;width:100%;color:var(--text);transition:.15s;
  }
  input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,155,255,.18);}
  textarea{resize:vertical;min-height:54px;line-height:1.4;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{width:100%;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--bg);padding:3px;cursor:pointer;transition:.15s;}
  input[type=color]:focus{outline:none;border-color:var(--accent);}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg);}
  .seg button{flex:1;background:transparent;border:none;padding:9px 4px;font-size:12px;color:var(--muted);transition:.15s;}
  .seg button:hover{background:var(--panel3);color:var(--text);}
  .seg button.active{background:linear-gradient(135deg,var(--accent),#9a7cff);color:#fff;font-weight:600;}
  .chip{
    background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;
    display:flex;align-items:center;gap:6px;transition:.15s;cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);transform:translateY(-1px);}
  .chip.sel{border-color:var(--accent);background:rgba(124,155,255,.16);color:#fff;}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .emoji-grid button{background:var(--bg);border:1px solid var(--border);border-radius:9px;font-size:20px;padding:6px 0;line-height:1;transition:.15s;}
  .emoji-grid button:hover{border-color:var(--accent2);transform:translateY(-2px);background:var(--panel3);}
  .shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .shape-grid button{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 0;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .shape-grid button:hover{border-color:var(--accent2);background:var(--panel3);}
  .shape-grid svg{width:26px;height:26px;}
  .swatch-row{display:flex;flex-wrap:wrap;gap:7px;}
  .swatch{width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer;transition:.12s;box-shadow:0 1px 6px rgba(0,0,0,.25);}
  .swatch:hover{transform:scale(1.1);}
  .swatch.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent);}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.55;}
  .btn-mini{background:var(--panel3);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;transition:.15s;flex:1;}
  .btn-mini:hover{border-color:var(--accent);background:var(--panel2);}
  .btn-mini.danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn-mini.good:hover{border-color:var(--good);color:var(--good);}
  /* card */
  .card-wrap{position:relative;transform-origin:center center;}
  .card{
    position:relative;overflow:hidden;border-radius:var(--radius);box-shadow:var(--shadow);
    user-select:none;
  }
  .card .bg-layer{position:absolute;inset:0;z-index:0;}
  .card .el{
    position:absolute;z-index:1;cursor:move;
  }
  .card .el.text{
    white-space:pre-wrap;word-break:break-word;line-height:1.35;
  }
  .card .el.shape,.card .el.emoji{display:flex;align-items:center;justify-content:center;}
  .card .el.selected{outline:2px dashed var(--accent);outline-offset:2px;filter:drop-shadow(0 0 6px rgba(124,155,255,.5));}
  .card .el .edithint{position:absolute;right:0;top:-18px;font-size:10px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap;}
  .float-anim{animation:floaty 3s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .confetti-canvas{position:absolute;inset:0;pointer-events:none;z-index:5;}
  /* element floating toolbar */
  .el-toolbar{
    position:absolute;display:flex;gap:4px;background:rgba(18,20,28,.94);border:1px solid var(--border);
    border-radius:10px;padding:4px;z-index:50;transform:translateY(-100%);margin-top:-8px;
    box-shadow:0 8px 22px rgba(0,0,0,.5);backdrop-filter:blur(4px);
  }
  .el-toolbar button{background:var(--panel3);border:none;border-radius:7px;width:28px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.12s;}
  .el-toolbar button:hover{background:var(--accent);transform:translateY(-1px);}
  .el-toolbar button.del:hover{background:var(--danger);}
  /* right panel placeholder */
  .empty-tip{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;
    border:1px dashed var(--border);border-radius:var(--radius);background:rgba(0,0,0,.12);}
  .empty-tip .big{font-size:36px;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(124,155,255,.3));}
  /* top tool action group */
  .group-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:2px 0;}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--muted);}
  .scalebox{position:absolute;left:24px;bottom:18px;background:rgba(18,20,28,.85);border:1px solid var(--border);border-radius:12px;padding:9px 13px;display:flex;align-items:center;gap:10px;z-index:20;backdrop-filter:blur(4px);box-shadow:var(--shadow);}
  .scalebox input[type=range]{width:120px;}
  /* toast */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#15171f;border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:999;box-shadow:var(--shadow);pointer-events:none;font-size:13px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* scrollbars */
  aside::-webkit-scrollbar,.stage::-webkit-scrollbar{width:9px;height:9px;}
  aside::-webkit-scrollbar-thumb,.stage::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px;}
  aside::-webkit-scrollbar-thumb:hover,.stage::-webkit-scrollbar-thumb:hover{background:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="dot"></span>贺卡生成器 · Card Studio</div>
    <div class="pill" id="dimPill">420 × 600</div>
    <div class="spacer"></div>
    <button class="tbtn" id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button class="tbtn" id="redoBtn" title="重做 (Ctrl+Y)">↷ 重做</button>
    <button class="tbtn" id="saveBtn">📤 导出 JSON</button>
    <button class="tbtn" id="loadBtn">📥 导入 JSON</button>
    <button class="tbtn" id="clearBtn">🗑 清空</button>
    <button class="tbtn primary" id="exportPngBtn">⬇ PNG</button>
    <button class="tbtn" id="exportJpgBtn">🖼 JPG</button>
  </header>

  <main>
    <!-- LEFT: global settings -->
    <aside class="left" id="leftPanel"></aside>

    <!-- CENTER: stage -->
    <section class="stage" id="stage">
      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">
          <div class="bg-layer" id="bgLayer"></div>
          <canvas class="confetti-canvas" id="confetti"></canvas>
        </div>
      </div>
      <div class="scalebox">
        <span style="font-size:12px;color:var(--muted)">缩放</span>
        <input type="range" id="stageScale" min="0.3" max="1.6" step="0.05" value="1">
        <span id="scaleVal" style="font-size:12px;width:38px">100%</span>
      </div>
    </section>

    <!-- RIGHT: selected element properties -->
    <aside class="right" id="rightPanel"></aside>
  </main>
</div>
<div id="toast"></div>
<input type="file" id="jsonInput" accept="application/json,.json" style="display:none">

/* ---------- state ---------- */
let DIMS = {portrait:[420,600], landscape:[600,420], square:[520,520]};
let state = {
  template:"birthday",
  orientation:"portrait",
  bg:{type:"gradient",c1:"#ff9a9e",c2:"#fecfef",angle:135,color:"#ffdde1",image:null},
  animation:"none",
  elements:[]
};
let cardW = DIMS.portrait[0], cardH = DIMS.portrait[1];
let selectedId = null;
let stageScale = 1;
let uid = 1;
const newId = () => "el"+(uid++);
let history = [], hidx = -1;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const card = $("card");
const bgLayer = $("bgLayer");
const cardWrap = $("cardWrap");

function resolve(val){
  // resolve special strings like "cardW", "cardH", "cardW-48", "cardW/2-90"
  if(typeof val === "number") return val;
  if(typeof val === "string"){
    let s = val.replace(/cardW/g, cardW).replace(/cardH/g, cardH);
    try { return Function('"use strict";return ('+s+')')(); } catch(e){ return 0; }
  }
  return val;
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1900);
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- history ---------- */
function snapshot(){ return JSON.parse(JSON.stringify(state)); }
function commit(){
  // truncate redo branch and push
  history = history.slice(0, hidx+1);
  history.push(snapshot());
  if(history.length>60) history.shift();
  hidx = history.length-1;
  updateHistoryButtons();
}
function undo(){
  if(hidx<=0){ toast("已经是最早一步"); return; }
  hidx--; state = JSON.parse(JSON.stringify(history[hidx])); afterStateChange();
}
function redo(){
  if(hidx>=history.length-1){ toast("已经是最新一步"); return; }
  hidx++; state = JSON.parse(JSON.stringify(history[hidx])); afterStateChange();
}
function gotoHistory(){ state = JSON.parse(JSON.stringify(history[hidx])); afterStateChange(); }
function updateHistoryButtons(){
  $("undoBtn").style.opacity = hidx>0 ? 1 : .45;
  $("redoBtn").style.opacity = hidx<history.length-1 ? 1 : .45;
}
function afterStateChange(){
  cardW = DIMS[state.orientation][0]; cardH = DIMS[state.orientation][1];
  applyCanvasSize(); applyBackground(); render(); renderRightPanel();
}

/* ---------- canvas size ---------- */
function applyCanvasSize(){
  card.style.width = cardW+"px";
  card.style.height = cardH+"px";
  $("dimPill").textContent = cardW+" × "+cardH;
  // confetti canvas
  const cf = $("confetti");
  cf.width = cardW; cf.height = cardH;
  // bg layer size match
  bgLayer.style.width = cardW+"px"; bgLayer.style.height = cardH+"px";
}

/* ---------- background ---------- */
function applyBackground(){
  const b = state.bg;
  bgLayer.style.backgroundImage = "";
  bgLayer.style.backgroundColor = "";
  bgLayer.style.backgroundSize = "";
  bgLayer.style.backgroundPosition = "";
  if(b.type==="solid"){
    bgLayer.style.backgroundColor = b.color;
  } else if(b.type==="gradient"){
    bgLayer.style.backgroundImage = `linear-gradient(${b.angle}deg, ${b.c1}, ${b.c2})`;
  } else if(b.type==="image"){
    if(b.image){
      bgLayer.style.backgroundImage = `url(${b.image})`;
      bgLayer.style.backgroundSize = b.cover ? "cover" : "contain";
      bgLayer.style.backgroundPosition = "center";
      bgLayer.style.backgroundRepeat = "no-repeat";
    } else {
      bgLayer.style.backgroundColor = "#ddd";
    }
  }
}

/* ---------- render card elements ---------- */
function render(){
  // remove existing .el and any leftover floating toolbar (keep bg-layer & confetti)
  [...card.querySelectorAll(".el")].forEach(n=>n.remove());
  [...card.querySelectorAll(".el-toolbar")].forEach(n=>n.remove());
  state.elements.forEach(el=>{
    const node = document.createElement("div");
    node.className = "el "+el.type + (el.id===selectedId ? " selected":"");
    node.dataset.id = el.id;
    positionNode(node, el);
    if(el.type==="text"){
      node.style.width = (typeof el.width==="number"? el.width : resolve(el.width))+"px";
      node.style.textAlign = el.align;
      node.style.fontSize = el.fontSize+"px";
      node.style.color = el.color;
      node.style.fontFamily = el.fontFamily;
      node.style.fontWeight = el.bold ? "700":"400";
      node.style.fontStyle = el.italic ? "italic":"normal";
      node.style.textShadow = el.shadow ? "0 2px 6px rgba(0,0,0,.35)":"none";
      node.style.opacity = el.opacity;
      node.textContent = el.content;
      if(state.animation==="float") node.classList.add("float-anim");
    } else if(el.type==="emoji"){
      node.style.fontSize = el.size+"px";
      node.style.opacity = el.opacity;
      node.textContent = el.content;
      if(state.animation==="float") node.classList.add("float-anim");
    } else if(el.type==="shape"){
      node.style.width = el.size+"px";
      node.style.height = el.size+"px";
      node.style.opacity = el.opacity;
      node.innerHTML = shapeSVG(el.shape, el.color, 100);
      if(state.animation==="float") node.classList.add("float-anim");
    }
    card.appendChild(node);
  });
  // selected floating toolbar
  if(selectedId){
    const sel = state.elements.find(e=>e.id===selectedId);
    if(sel){
      const tb = document.createElement("div");
      tb.className = "el-toolbar";
      tb.innerHTML = `
        <button data-act="up" title="上移一层">⬆</button>
        <button data-act="down" title="下移一层">⬇</button>
        <button data-act="dup" title="复制">⧉</button>
        <button data-act="del" class="del" title="删除">✕</button>`;
      tb.addEventListener("click", e=>{
        const act = e.target.dataset.act; if(!act) return;
        if(act==="up") bringForward(sel.id);
        if(act==="down") sendBackward(sel.id);
        if(act==="dup") duplicateEl(sel.id);
        if(act==="del") deleteEl(sel.id);
      });
      const snode = card.querySelector(`.el[data-id="${sel.id}"]`);
      if(snode){
        const r = snode.getBoundingClientRect();
        const wr = card.getBoundingClientRect();
        tb.style.left = (r.left-wr.left)+"px";
        tb.style.top = (r.top-wr.top)+"px";
        card.appendChild(tb);
      }
    }
  }
}
function positionNode(node, el){
  const x = resolve(el.x), y = resolve(el.y);
  node.style.left = x+"px";
  node.style.top = y+"px";
  node.style.transform = `rotate(${el.rotation||0}deg)`;
}
function shapeSVG(type, color, size){
  const s = 100;
  const common = `width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"`;
  switch(type){
    case "heart": return `<svg ${common}><path d="M50 88 C10 58 8 30 28 22 C40 17 50 28 50 36 C50 28 60 17 72 22 C92 30 90 58 50 88 Z" fill="${color}"/></svg>`;
    case "star": return `<svg ${common}><path d="M50 6 L61 38 L95 39 L68 60 L78 93 L50 72 L22 93 L32 60 L5 39 L39 38 Z" fill="${color}"/></svg>`;
    case "circle": return `<svg ${common}><circle cx="50" cy="50" r="44" fill="${color}"/></svg>`;
    case "square": return `<svg ${common}><rect x="8" y="8" width="84" height="84" rx="10" fill="${color}"/></svg>`;
    case "flower": return `<svg ${common}><g fill="${color}"><circle cx="50" cy="22" r="16"/><circle cx="50" cy="78" r="16"/><circle cx="22" cy="50" r="16"/><circle cx="78" cy="50" r="16"/><circle cx="50" cy="50" r="15" fill="#fff8c4"/></g></svg>`;
    case "butterfly": return `<svg ${common}><g fill="${color}"><path d="M50 50 C30 20 5 25 12 45 C18 60 40 58 50 50 Z"/><path d="M50 50 C70 20 95 25 88 45 C82 60 60 58 50 50 Z"/><path d="M50 52 C34 70 14 70 18 56 C22 48 42 52 50 52 Z"/><path d="M50 52 C66 70 86 70 82 56 C78 48 58 52 50 52 Z"/><rect x="48" y="40" width="4" height="28" rx="2" fill="#333"/></g></svg>`;
    case "note": return `<svg ${common}><g fill="${color}"><ellipse cx="34" cy="72" rx="20" ry="14"/><rect x="50" y="30" width="6" height="44"/><path d="M56 30 C74 28 82 38 80 52 C72 44 62 46 56 50 Z"/></g></svg>`;
    case "sun": return `<svg ${common}><g fill="${color}"><circle cx="50" cy="50" r="22"/><g stroke="${color}" stroke-width="6" stroke-linecap="round"><line x1="50" y1="6" x2="50" y2="20"/><line x1="50" y1="80" x2="50" y2="94"/><line x1="6" y1="50" x2="20" y2="50"/><line x1="80" y1="50" x2="94" y2="50"/><line x1="18" y1="18" x2="28" y2="28"/><line x1="72" y1="72" x2="82" y2="82"/><line x1="82" y1="18" x2="72" y2="28"/><line x1="28" y1="72" x2="18" y2="82"/></g></g></svg>`;
    default: return `<svg ${common}><circle cx="50" cy="50" r="44" fill="${color}"/></svg>`;
  }
}

/* ---------- element ops ---------- */
function addText(x,y){
  const w = cardW;
  const el = {id:newId(),type:"text",x:x??0,y:y??120,width:w,align:"center",fontSize:34,color:"#333",fontFamily:FONTS[1].value,bold:false,italic:false,shadow:false,rotation:0,opacity:1,content:"双击编辑文字"};
  state.elements.push(el); selectedId=el.id; commit(); render(); renderRightPanel(); return el;
}
function addEmoji(content,x,y){
  const el = {id:newId(),type:"emoji",content,x:x??cardW/2-20,y:y??cardH/2-20,size:40,rotation:0,opacity:1};
  state.elements.push(el); selectedId=el.id; commit(); render(); renderRightPanel(); return el;
}
function addShape(shape,x,y){
  const el = {id:newId(),type:"shape",shape,color:"#ff7eb6",x:x??cardW/2-25,y:y??cardH/2-25,size:50,rotation:0,opacity:1};
  state.elements.push(el); selectedId=el.id; commit(); render(); renderRightPanel(); return el;
}
function deleteEl(id){
  state.elements = state.elements.filter(e=>e.id!==id);
  if(selectedId===id) selectedId=null;
  commit(); render(); renderRightPanel();
}
function duplicateEl(id){
  const el = state.elements.find(e=>e.id===id); if(!el) return;
  const copy = JSON.parse(JSON.stringify(el));
  copy.id = newId();
  copy.x = resolve(copy.x)+20; copy.y = resolve(copy.y)+20;
  state.elements.push(copy); selectedId=copy.id;
  commit(); render(); renderRightPanel();
}
function bringForward(id){
  const i = state.elements.findIndex(e=>e.id===id); if(i<0||i===state.elements.length-1) return;
  [state.elements[i],state.elements[i+1]]=[state.elements[i+1],state.elements[i]];
  commit(); render();
}
function sendBackward(id){
  const i = state.elements.findIndex(e=>e.id===id); if(i<=0) return;
  [state.elements[i],state.elements[i-1]]=[state.elements[i-1],state.elements[i]];
  commit(); render();
}

/* ---------- selection & drag ---------- */
let drag = null;
card.addEventListener("pointerdown", e=>{
  if(e.target.closest(".el-toolbar")) return; // toolbar buttons handle their own click
  const elNode = e.target.closest(".el");
  if(!elNode) return; // empty area inside card -> handled by global listener
  const id = elNode.dataset.id;
  selectedId = id; render(); renderRightPanel();
  const el = state.elements.find(x=>x.id===id);
  // start drag
  drag = {id, startX:e.clientX, startY:e.clientY, origX:resolve(el.x), origY:resolve(el.y), moved:false};
  elNode.setPointerCapture(e.pointerId);
});
// click anywhere outside an element / toolbar / property panel -> deselect & hide toolbar
document.addEventListener("pointerdown", e=>{
  if(e.target.closest(".el-toolbar")) return;
  if(e.target.closest(".el")) return;
  if(e.target.closest(".right")) return; // keep editing the selected element in the right panel
  if(selectedId){
    selectedId=null; render(); renderRightPanel();
  }
});
card.addEventListener("pointermove", e=>{
  if(!drag) return;
  const dx = (e.clientX-drag.startX)/stageScale;
  const dy = (e.clientY-drag.startY)/stageScale;
  if(Math.abs(dx)>2||Math.abs(dy)>2) drag.moved=true;
  const el = state.elements.find(x=>x.id===drag.id);
  if(!el) return;
  el.x = clamp(drag.origX+dx, -50, cardW-10);
  el.y = clamp(drag.origY+dy, -50, cardH-10);
  const node = card.querySelector(`.el[data-id="${el.id}"]`);
  if(node){ node.style.left=el.x+"px"; node.style.top=el.y+"px"; }
});
card.addEventListener("pointerup", e=>{
  if(drag){
    if(drag.moved) commit();
    drag=null;
  }
});
// double click to edit text
card.addEventListener("dblclick", e=>{
  const elNode = e.target.closest(".el.text");
  if(!elNode) return;
  const id = elNode.dataset.id;
  const el = state.elements.find(x=>x.id===id);
  elNode.contentEditable = "true";
  elNode.style.cursor="text";
  elNode.focus();
  document.execCommand && document.getSelection().selectAllChildren(elNode);
  const finish = ()=>{
    elNode.contentEditable="false";
    el.content = elNode.innerText;
    elNode.removeEventListener("blur", finish);
    commit(); render(); renderRightPanel();
  };
  elNode.addEventListener("blur", finish);
});

/* ---------- template apply ---------- */
function applyTemplate(key){
  const t = TEMPLATES[key]; if(!t) return;
  state.template = key;
  cardW = DIMS[state.orientation][0]; cardH = DIMS[state.orientation][1];
  state.bg = JSON.parse(JSON.stringify(t.bg));
  state.elements = [];
  t.elements.forEach(def=>state.elements.push(Object.assign({id:newId()}, def)));
  if(t.decos) t.decos.forEach(d=>state.elements.push(Object.assign({id:newId()}, d)));
  selectedId=null;
  commit(); applyCanvasSize(); applyBackground(); render(); renderRightPanel(); renderLeftPanel();
  toast("已应用模板：" + t.name);
}

/* ---------- orientation ---------- */
function setOrientation(o){
  const oldW=cardW, oldH=cardH;
  state.orientation = o;
  cardW = DIMS[o][0]; cardH = DIMS[o][1];
  const rx = cardW/oldW, ry = cardH/oldH;
  state.elements.forEach(el=>{
    el.x = resolve(el.x)*rx;
    el.y = resolve(el.y)*ry;
    if(typeof el.width==="number") el.width = el.width*rx;
  });
  commit(); applyCanvasSize(); applyBackground(); render(); renderRightPanel();
}

/* ---------- background update ---------- */
function setBg(attr,val){ state.bg[attr]=val; commit(); applyBackground(); }

/* ---------- animation / confetti ---------- */
let confettiRAF=null, confParticles=[];
function startConfetti(){
  const cf = $("confetti");
  confParticles=[];
  const colors=["#ff7eb6","#6c8cff","#ffd54a","#46d69a","#ff944d","#c792ea"];
  for(let i=0;i<90;i++){
    confParticles.push({
      x:Math.random()*cardW, y:Math.random()*-cardH,
      w:4+Math.random()*7, h:8+Math.random()*10,
      vx:(Math.random()-.5)*1.2, vy:1+Math.random()*2.2,
      rot:Math.random()*360, vr:(Math.random()-.5)*8,
      c:colors[(Math.random()*colors.length)|0]
    });
  }
  cancelAnimationFrame(confettiRAF);
  const ctx = cf.getContext("2d");
  const loop=()=>{
    ctx.clearRect(0,0,cardW,cardH);
    confParticles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y>cardH+20){ p.y=-20; p.x=Math.random()*cardW; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    confettiRAF=requestAnimationFrame(loop);
  };
  loop();
}
function stopConfetti(){
  cancelAnimationFrame(confettiRAF); confettiRAF=null;
  const cf=$("confetti"); const ctx=cf.getContext("2d"); ctx.clearRect(0,0,cardW,cardH);
}
function setAnimation(a){
  state.animation=a; commit();
  stopConfetti();
  if(a==="confetti") startConfetti();
  render();
}

/* ---------- export ---------- */
async function exportCard(fmt){
  if(typeof html2canvas==="undefined"){
    toast("导出组件未加载，请联网后重试");
    return;
  }
  toast("正在生成图片…");
  try{
    await document.fonts.ready;
    const scale = +$("exportScale").value || 2;
    const quality = (+$("exportQuality").value||0.92);
    const canvas = await html2canvas(card, {
      scale, useCORS:true, backgroundColor: fmt==="jpg" ? "#ffffff" : null,
      logging:false
    });
    let url;
    if(fmt==="jpg") url = canvas.toDataURL("image/jpeg", quality);
    else url = canvas.toDataURL("image/png");
    const a=document.createElement("a");
    a.href=url; a.download=`贺卡_${state.template}_${Date.now()}.${fmt}`;
    document.body.appendChild(a); a.click(); a.remove();
    toast("已导出 "+fmt.toUpperCase());
  }catch(err){
    console.error(err); toast("导出失败："+err.message);
  }
}

/* ---------- export GIF (animation) ---------- */
let _gifWorkerUrl=null;
function loadGifJS(){
  return new Promise(async (resolve,reject)=>{
    const tryWorker=async()=>{
      try{
        const txt=await fetch("https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js").then(r=>r.text());
        _gifWorkerUrl=URL.createObjectURL(new Blob([txt],{type:"application/javascript"}));
        return true;
      }catch(e){ return false; }
    };
    if(window.GIF){
      if(_gifWorkerUrl===null){ if(!(await tryWorker())) return reject(new Error("GIF worker 加载失败，请联网后重试")); }
      return resolve(window.GIF);
    }
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js";
    s.onload=async()=>{
      if(!window.GIF) return reject(new Error("GIF 库加载失败"));
      if(!(await tryWorker())) return reject(new Error("GIF worker 加载失败，请联网后重试"));
      resolve(window.GIF);
    };
    s.onerror=()=>reject(new Error("GIF 库加载失败，请联网后重试"));
    document.head.appendChild(s);
  });
}
function confettiParticlesForGif(){
  const colors=["#ff7eb6","#7c9bff","#ffd54a","#3fd6a0","#ff944d","#c792ea"];
  const arr=[];
  for(let i=0;i<90;i++){
    arr.push({
      x:Math.random()*cardW, y:Math.random()*-cardH,
      w:4+Math.random()*7, h:8+Math.random()*10,
      vx:(Math.random()-.5)*1.2, vy:1+Math.random()*2.2,
      rot:Math.random()*360, vr:(Math.random()-.5)*8,
      c:colors[(Math.random()*colors.length)|0]
    });
  }
  return arr;
}
function drawConfettiFrame(ctx, scale, parts){
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.y>cardH+20){ p.y=-20; p.x=Math.random()*cardW; }
    ctx.save();
    ctx.translate(p.x*scale, p.y*scale);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle=p.c;
    ctx.fillRect(-p.w*scale/2, -p.h*scale/2, p.w*scale, p.h*scale);
    ctx.restore();
  });
}
function captureBaseImage(scale){
  return new Promise(async (res)=>{
    const cf=$("confetti"); const prevDisp=cf.style.display;
    cf.style.display="none"; // hide live confetti so base is clean
    await document.fonts.ready;
    const canvas = await html2canvas(card, {scale, useCORS:true, backgroundColor:null, logging:false});
    cf.style.display=prevDisp;
    res(canvas);
  });
}
// split card into background-only and elements-only layers (for reliable float animation export)
function captureLayers(scale){
  return new Promise(async (res)=>{
    const cf=$("confetti"); const prevConf=cf.style.display; cf.style.display="none";
    await document.fonts.ready;
    const els=[...card.querySelectorAll(".el")];
    els.forEach(n=>n.style.visibility="hidden");
    const bg=await html2canvas(card,{scale,useCORS:true,backgroundColor:null,logging:false});
    els.forEach(n=>n.style.visibility="");
    const bgLayer=card.querySelector(".bg-layer"); const prevBg=bgLayer.style.display; bgLayer.style.display="none";
    const el=await html2canvas(card,{scale,useCORS:true,backgroundColor:null,logging:false});
    bgLayer.style.display=prevBg;
    cf.style.display=prevConf;
    res({bg,el});
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function exportGif(){
  if(typeof html2canvas==="undefined"){
    toast("导出组件(html2canvas)未加载，请联网后重试");
    return;
  }
  let GIF;
  try{ GIF = await loadGifJS(); }
  catch(e){ toast(e.message); return; }
  const anim = state.animation;
  if(anim==="none"){
    toast("当前未开启动画，正在导出静态 GIF…");
  } else {
    toast("正在录制动画 GIF…（约需数秒，请稍候）");
  }
  const scale = 1.5;
  const W = Math.round(cardW*scale), H = Math.round(cardH*scale);
  const durInput = document.getElementById("gifDuration");
  const duration = Math.min(10, Math.max(0.5, parseFloat(durInput?durInput.value:2)||2));
  const delay = 100;
  const steps = Math.max(2, Math.round(duration*10));
  let finished=false;
  const perFrameMs = 500;
  const guard = setTimeout(()=>{
    if(!finished) toast("GIF 生成超时，请检查网络后重试");
  }, perFrameMs*steps + 8000);
  try{
    let base=null, bg=null, el=null;
    if(anim==="float"){
      const layers = await captureLayers(scale);
      bg = layers.bg; el = layers.el;
    } else {
      base = await captureBaseImage(scale);
    }
    const gif = new GIF({workers:2, quality:10, width:W, height:H, workerScript:_gifWorkerUrl||""});
    const parts = anim==="confetti" ? confettiParticlesForGif() : null;
    for(let i=0;i<steps;i++){
      const fc=document.createElement("canvas"); fc.width=W; fc.height=H;
      const fx=fc.getContext("2d");
      if(anim==="confetti"){
        fx.drawImage(base,0,0,W,H);
        drawConfettiFrame(fx, scale, parts);
      } else if(anim==="float"){
        // bob the elements layer up/down (mirrors the .float-anim CSS keyframes)
        const off = Math.sin((i/steps)*Math.PI*2) * 10 * scale;
        fx.drawImage(bg,0,0,W,H);
        fx.save(); fx.translate(0, off); fx.drawImage(el,0,0,W,H); fx.restore();
      } else {
        fx.drawImage(base,0,0,W,H);
      }
      gif.addFrame(fc, {copy:true, delay});
    }
    gif.on("finished", blob=>{
      finished=true; clearTimeout(guard);
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=`贺卡动画_${state.template}_${Date.now()}.gif`;
      document.body.appendChild(a); a.click(); a.remove();
      toast("已导出 GIF 动画 ✅");
    });
    gif.on("abort", ()=>{ finished=true; clearTimeout(guard); toast("GIF 生成被中断"); });
    gif.render();
  }catch(err){
    finished=true; clearTimeout(guard);
    console.error(err); toast("GIF 导出失败："+err.message);
  }
}

function exportJson(){

function importJson(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.state||!d.state.elements) throw new Error("文件格式不正确");
      state=d.state; cardW=d.cardW||DIMS[d.state.orientation]?.[0]||cardW;
      cardH=d.cardH||DIMS[d.state.orientation]?.[1]||cardH;
      selectedId=null; history=[]; hidx=-1; commit();
      applyCanvasSize(); applyBackground(); render(); renderLeftPanel(); renderRightPanel();
      toast("已导入 JSON 设计");
    }catch(e){ toast("导入失败："+e.message); }
  };
  r.readAsText(file);
}

function bindRightEvents(el){
  const upd=(attr,val,reRender=true)=>{ el[attr]=val; commit(); if(reRender) render(); if(reRender) renderRightPanel(); };
  const updLive=(attr,val)=>{ el[attr]=val; render(); };
  const find=()=>state.elements.find(e=>e.id===el.id);

  if(el.type==="text"){
    $("pContent").addEventListener("input",e=>{ find().content=e.target.value; render(); });
    $("pContent").addEventListener("change",e=>commit());
    $("pFont").addEventListener("change",e=>upd("fontFamily",e.target.value));
    $("pFs").addEventListener("input",e=>{ find().fontSize=+e.target.value; $("pFsVal").textContent=e.target.value; render(); });
    $("pFs").addEventListener("change",e=>commit());
    $("pAlign").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      upd("align",b.dataset.a);
      $("pAlign").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
    }));
    $("pColor").addEventListener("input",e=>upd("color",e.target.value));
    $("pWidth").addEventListener("input",e=>{ find().width=+e.target.value; $("pWVal").textContent=e.target.value; render(); });
    $("pWidth").addEventListener("change",e=>commit());
    $("pBold").addEventListener("click",()=>{ const v=!find().bold; upd("bold",v); $("pBold").classList.toggle("good",v); });
    $("pItalic").addEventListener("click",()=>{ const v=!find().italic; upd("italic",v); $("pItalic").classList.toggle("good",v); });
    $("pShadow").addEventListener("click",()=>{ const v=!find().shadow; upd("shadow",v); $("pShadow").classList.toggle("good",v); });
  } else if(el.type==="emoji"){
    $("pEmoji").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ upd("content",b.dataset.em); }));
    $("pSize").addEventListener("input",e=>{ find().size=+e.target.value; $("pSizeVal").textContent=e.target.value; render(); });
    $("pSize").addEventListener("change",e=>commit());
  } else if(el.type==="shape"){
    $("pShape").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ upd("shape",b.dataset.sh); }));
    $("pSize").addEventListener("input",e=>{ find().size=+e.target.value; $("pSizeVal").textContent=e.target.value; render(); });
    $("pSize").addEventListener("change",e=>commit());
    $("pColor").addEventListener("input",e=>upd("color",e.target.value));
  }
  $("pRot").addEventListener("input",e=>{ find().rotation=+e.target.value; $("pRotVal").textContent=e.target.value+"°"; render(); });
  $("pRot").addEventListener("change",e=>commit());
  $("pOp").addEventListener("input",e=>{ find().opacity=+e.target.value; $("pOpVal").textContent=Math.round(e.target.value*100)+"%"; render(); });
  $("pOp").addEventListener("change",e=>commit());
  $("pUp").addEventListener("click",()=>bringForward(el.id));
  $("pDown").addEventListener("click",()=>sendBackward(el.id));
  $("pDup").addEventListener("click",()=>duplicateEl(el.id));
  $("pDel").addEventListener("click",()=>deleteEl(el.id));
}

/* ---------- small utils ---------- */
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toHex(c){
  if(!c) return "#000000";
  if(c[0]==="#"){
    if(c.length===4) return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    return c.slice(0,7);
  }
  // named/rgb -> try to keep as is for color input (needs hex). fallback black.
  const m=/^rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c);
  if(m){ const h=x=>(+x).toString(16).padStart(2,"0"); return "#"+h(m[1])+h(m[2])+h(m[3]); }
  return "#000000";
}

});

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.isContentEditable || t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT") return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); }
  else if((e.key==="Delete"||e.key==="Backspace")&&selectedId){
    e.preventDefault(); deleteEl(selectedId);
  }
  else if(e.key==="Escape"){ selectedId=null; render(); renderRightPanel(); }
});

/* ---------- top toolbar ---------- */
$("undoBtn").addEventListener("click",undo);
$("redoBtn").addEventListener("click",redo);
$("saveBtn").addEventListener("click",exportJson);
$("loadBtn").addEventListener("click",()=>$("jsonInput").click());
$("jsonInput").addEventListener("change",e=>{ if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=""; });
$("clearBtn").addEventListener("click",clearAll);
$("exportPngBtn").addEventListener("click",()=>exportCard("png"));
$("exportJpgBtn").addEventListener("click",()=>exportCard("jpg"));

/* ---------- init ---------- */
function init(){
  cardW=DIMS[state.orientation][0]; cardH=DIMS[state.orientation][1];
  applyCanvasSize();
  applyBackground();
  renderLeftPanel();
  applyTemplate("birthday");
  commit();
  updateHistoryButtons();
}
init();
</script>
</body>
</html>
