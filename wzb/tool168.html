<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - Changelog</title>
    <style>
        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8ed;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --accent-blue: #0071e3;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --accent-red: #ff3b30;
            --accent-purple: #af52de;
            --accent-teal: #5ac8fa;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --card-hover: rgba(255, 255, 255, 0.9);
            --divider: rgba(0, 0, 0, 0.06);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --sidebar-width: 240px;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #6e6e73;
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --accent-red: #ff453a;
            --accent-purple: #bf5af2;
            --accent-teal: #64d2ff;
            --glass-bg: rgba(28, 28, 30, 0.72);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --card-hover: rgba(44, 44, 46, 0.9);
            --divider: rgba(255, 255, 255, 0.08);
            --gradient-start: #1a1a2e;
            --gradient-end: #16213e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            opacity: 0.15;
            z-index: -1;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-actions {
            display: flex;
            gap: 8px;
        }

        .sidebar-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .sidebar-btn:hover {
            background: var(--accent-blue);
            color: white;
        }

        .sidebar-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border-radius: 10px;
            border: 1px solid var(--divider);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            padding: 0 8px;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-tag {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--divider);
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        .filter-tag:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .filter-tag.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .version-list {
            margin-top: 16px;
        }

        .version-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .version-nav-item:hover {
            background: var(--bg-tertiary);
        }

        .version-nav-item.active {
            background: var(--accent-blue);
            color: white;
        }

        .version-nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .version-nav-item.active .version-nav-dot {
            background: white;
        }

        .version-nav-item.latest .version-nav-dot {
            background: var(--accent-green);
        }

        .version-nav-text {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .version-nav-date {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            margin-left: auto;
        }

        .version-nav-item.active .version-nav-date {
            color: rgba(255, 255, 255, 0.8);
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            width: calc(100% - var(--sidebar-width));
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 4px;
        }

        .view-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-btn.active {
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .toolbar-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--divider);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--divider);
            background: var(--bg-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-shadow);
        }

        .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timeline-view {
            display: none;
        }

        .timeline-view.active {
            display: block;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--divider);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 32px;
        }

        .timeline-dot {
            position: absolute;
            left: -33px;
            top: 24px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: 3px solid var(--bg-primary);
        }

        .timeline-item.latest .timeline-dot {
            background: var(--accent-green);
            box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.2);
        }

        .cards-view {
            display: none;
        }

        .cards-view.active {
            display: block;
        }

        .version-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .version-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .version-card.compare-selected {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        .version-header {
            padding: 20px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .version-header:hover {
            background: var(--card-hover);
        }

        .version-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .version-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--divider);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: var(--bg-secondary);
        }

        .version-checkbox.checked {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .version-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 0.75rem;
        }

        .version-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .version-date {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .version-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .badge-latest {
            background: var(--accent-green);
            color: white;
        }

        .badge-stable {
            background: var(--accent-blue);
            color: white;
        }

        .badge-beta {
            background: var(--accent-orange);
            color: white;
        }

        .version-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--accent-blue);
            color: white;
        }

        .toggle-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .version-card.expanded .toggle-icon {
            transform: rotate(180deg);
            background: var(--accent-blue);
            color: white;
        }

        .version-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .version-card.expanded .version-content {
            max-height: 2000px;
        }

        .content-inner {
            padding: 0 24px 24px;
            border-top: 1px solid var(--divider);
        }

        .change-category {
            margin-top: 20px;
        }

        .change-category:last-child {
            margin-bottom: 0;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .category-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .category-features .category-title {
            color: var(--accent-green);
        }

        .category-features .category-icon {
            background: rgba(52, 199, 89, 0.15);
            color: var(--accent-green);
        }

        .category-improvements .category-title {
            color: var(--accent-blue);
        }

        .category-improvements .category-icon {
            background: rgba(0, 113, 227, 0.15);
            color: var(--accent-blue);
        }

        .category-fixes .category-title {
            color: var(--accent-red);
        }

        .category-fixes .category-icon {
            background: rgba(255, 59, 48, 0.15);
            color: var(--accent-red);
        }

        .category-breaking .category-title {
            color: var(--accent-orange);
        }

        .category-breaking .category-icon {
            background: rgba(255, 149, 0, 0.15);
            color: var(--accent-orange);
        }

        .change-list {
            list-style: none;
            padding: 0;
        }

        .change-list li {
            position: relative;
            padding: 8px 0 8px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .change-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .category-features .change-list li::before {
            background: var(--accent-green);
        }

        .category-improvements .change-list li::before {
            background: var(--accent-blue);
        }

        .category-fixes .change-list li::before {
            background: var(--accent-red);
        }

        .category-breaking .change-list li::before {
            background: var(--accent-orange);
        }

        .no-changes {
            color: var(--text-tertiary);
            font-style: italic;
            padding: 10px 0;
            font-size: 0.85rem;
        }

        .compare-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 16px 24px;
            display: none;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }

        .compare-bar.visible {
            display: flex;
        }

        .compare-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .compare-count {
            color: var(--accent-blue);
        }

        .compare-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent-blue);
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .compare-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .compare-btn:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .compare-cancel {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--divider);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .compare-cancel:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--accent-red);
            color: white;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(80vh - 80px);
        }

        .compare-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .compare-column {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 20px;
        }

        .compare-column-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--accent-blue);
        }

        .compare-section {
            margin-bottom: 16px;
        }

        .compare-section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .compare-item {
            padding: 6px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .compare-item.added {
            color: var(--accent-green);
        }

        .compare-item.removed {
            color: var(--accent-red);
            text-decoration: line-through;
        }

        .keyboard-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kbd {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.7rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3000;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }

            }

            }

            }
        }

                flex-direction: column;
                align-items: stretch;
            }

<body>

    <div class="app-container">

        <aside class="sidebar" id="sidebar">

                    <button class="sidebar-btn" onclick="expandAll()" title="展开全部">+</button>
                    <button class="sidebar-btn" onclick="collapseAll()" title="折叠全部">−</button>
                </div>
            </div>
            
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="搜索版本或内容..." id="searchInput" oninput="filterVersions()">
            </div>
            
            <div class="filter-section">
                <div class="filter-title">按类型筛选</div>
                <div class="filter-tags">
                    <span class="filter-tag active" data-filter="all" onclick="setFilter('all')">全部</span>
                    <span class="filter-tag" data-filter="features" onclick="setFilter('features')">新功能</span>
                    <span class="filter-tag" data-filter="fixes" onclick="setFilter('fixes')">修复</span>

            <div class="filter-section">

                    <span class="filter-tag" data-status="latest" onclick="setStatusFilter('latest')">最新</span>
                    <span class="filter-tag" data-status="stable" onclick="setStatusFilter('stable')">稳定</span>

                </div>
            </div>
            
            <div class="version-list" id="versionList">

        </aside>
        
        <main class="main-content">
            <div class="toolbar">

                    <div class="view-toggle">
                        <button class="view-btn active" onclick="setView('cards')">卡片视图</button>
                        <button class="view-btn" onclick="setView('timeline')">时间线</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <button class="toolbar-btn" onclick="exportMarkdown()">📄 导出 MD</button>
                    <button class="toolbar-btn" onclick="toggleCompareMode()">🔄 对比</button>
                    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">☀️</button>
                </div>
            </div>
            
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-icon">📦</div>
                    <div class="stat-value" id="total-versions">0</div>
                    <div class="stat-label">总版本数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✨</div>
                    <div class="stat-value" id="total-features">0</div>

                <div class="stat-card">

                    <div class="stat-value" id="total-fixes">0</div>

            <div class="timeline-view" id="timelineView">

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">🔍</div>
                <div class="empty-state-text">没有找到匹配的版本</div>

                breaking: []

        let currentFilter = 'all';
        let currentStatusFilter = 'all';
        let currentView = 'cards';
        let compareMode = false;
        let selectedVersions = [];

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        function getBadgeClass(badge) {
            const classes = {
                'latest': 'badge-latest',
                'stable': 'badge-stable',
                'beta': 'badge-beta'
            };
            return classes[badge] || 'badge-stable';
        }

        function getBadgeText(badge) {
            const texts = {
                'latest': '最新',
                'stable': '稳定版',
                'beta': '测试版'
            };
            return texts[badge] || badge;
        }

        function createChangeList(items) {
            if (!items || items.length === 0) {
                return '<p class="no-changes">无相关更新</p>';
            }
            return `<ul class="change-list">${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
        }

        function getFilteredData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            return changelogData.filter(version => {
                const matchesSearch = searchTerm === '' || 
                    version.version.includes(searchTerm) ||
                    version.features.some(f => f.toLowerCase().includes(searchTerm)) ||
                    version.improvements.some(i => i.toLowerCase().includes(searchTerm)) ||
                    version.fixes.some(f => f.toLowerCase().includes(searchTerm)) ||
                    version.breaking.some(b => b.toLowerCase().includes(searchTerm));
                
                const matchesTypeFilter = currentFilter === 'all' ||
                    (currentFilter === 'features' && version.features.length > 0) ||
                    (currentFilter === 'fixes' && version.fixes.length > 0) ||
                    (currentFilter === 'breaking' && version.breaking.length > 0);
                
                const matchesStatusFilter = currentStatusFilter === 'all' ||
                    version.badge === currentStatusFilter;
                
                return matchesSearch && matchesTypeFilter && matchesStatusFilter;
            });
        }

        function renderVersionList() {
            const container = document.getElementById('versionList');
            const filteredData = getFilteredData();
            
            container.innerHTML = filteredData.map((version, index) => `
                <div class="version-nav-item ${index === 0 ? 'active' : ''} ${version.badge === 'latest' ? 'latest' : ''}" 
                     onclick="scrollToVersion('${version.version}')" data-version="${version.version}">
                    <span class="version-nav-dot"></span>
                    <span class="version-nav-text">v${version.version}</span>
                    <span class="version-nav-date">${formatDate(version.date)}</span>
                </div>
            `).join('');
        }

        function renderCardsView() {
            const container = document.getElementById('cardsView');
            const filteredData = getFilteredData();
            
            if (filteredData.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            
            document.getElementById('emptyState').style.display = 'none';
            
            container.innerHTML = filteredData.map((version, index) => `
                <div class="version-card ${index === 0 ? 'expanded' : ''}" data-version="${version.version}" id="card-${version.version}">
                    <div class="version-header" onclick="toggleVersion(this)">
                        <div class="version-info">
                            ${compareMode ? `
                                <div class="version-checkbox ${selectedVersions.includes(version.version) ? 'checked' : ''}" 
                                     onclick="event.stopPropagation(); toggleVersionSelect('${version.version}')"></div>
                            ` : ''}
                            <span class="version-number">v${version.version}</span>
                            <span class="version-date">${formatDate(version.date)}</span>
                            <span class="version-badge ${getBadgeClass(version.badge)}">${getBadgeText(version.badge)}</span>
                        </div>
                        <div class="version-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); copyVersionInfo('${version.version}')" title="复制版本信息">📋</button>

                        </div>
                    </div>

                            ` : ''}
                            
                            ${version.improvements.length > 0 ? `

                                    <div class="category-title">

                                        改进
                                    </div>
                                    ${createChangeList(version.improvements)}
                                </div>
                            ` : ''}
                            
                            ${version.fixes.length > 0 ? `

                                </div>

                            ${version.breaking.length > 0 ? `

                                    <div class="category-title">
                                        <span class="category-icon">!</span>
                                        破坏性变更
                                    </div>
                                    ${createChangeList(version.breaking)}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

                                <span class="version-number">v${version.version}</span>

                            <div class="version-actions">

            `).join('');
        }

        function renderAll() {
            renderVersionList();
            renderCardsView();
            renderTimelineView();
            updateStats();
        }

        function toggleVersion(header) {
            const card = header.parentElement;
            card.classList.toggle('expanded');
        }

        function scrollToVersion(version) {
            const element = document.getElementById(`card-${version}`) || document.getElementById(`timeline-${version}`);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                document.querySelectorAll('.version-nav-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.version === version) {
                        item.classList.add('active');
                    }
                });
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tag[data-filter]').forEach(tag => {
                tag.classList.toggle('active', tag.dataset.filter === filter);
            });
            renderAll();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-tag[data-status]').forEach(tag => {
                tag.classList.toggle('active', tag.dataset.status === status);
            });
            renderAll();
        }

        function filterVersions() {
            renderAll();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(view === 'cards' ? '卡片' : '时间线'));
            });
            
            document.getElementById('cardsView').classList.toggle('active', view === 'cards');
            document.getElementById('timelineView').classList.toggle('active', view === 'timeline');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '🌙' : '☀️';
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
        }

        function updateStats() {
            const filteredData = getFilteredData();
            const totalVersions = filteredData.length;
            const totalFeatures = filteredData.reduce((sum, v) => sum + v.features.length, 0);
            const totalImprovements = filteredData.reduce((sum, v) => sum + v.improvements.length, 0);
            const totalFixes = filteredData.reduce((sum, v) => sum + v.fixes.length, 0);

            document.getElementById('total-versions').textContent = totalVersions;
            document.getElementById('total-features').textContent = totalFeatures;
            document.getElementById('total-improvements').textContent = totalImprovements;
            document.getElementById('total-fixes').textContent = totalFixes;
        }

        function updateLastUpdated() {
            const latestVersion = changelogData[0];
            document.getElementById('last-updated').textContent = formatDate(latestVersion.date);
        }

        function expandAll() {
            document.querySelectorAll('.version-card').forEach(card => {
                card.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.version-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }

        function toggleCompareMode() {
            compareMode = !compareMode;
            selectedVersions = [];
            updateCompareUI();
            renderAll();
        }

        function toggleVersionSelect(version) {
            const index = selectedVersions.indexOf(version);
            if (index === -1) {
                if (selectedVersions.length < 2) {
                    selectedVersions.push(version);
                }
            } else {
                selectedVersions.splice(index, 1);
            }
            updateCompareUI();
            renderAll();
        }

        function updateCompareUI() {
            const compareBar = document.getElementById('compareBar');
            const compareCount = document.getElementById('compareCount');
            const compareBtn = document.getElementById('compareBtn');
            
            compareBar.classList.toggle('visible', compareMode);
            compareCount.textContent = selectedVersions.length;
            compareBtn.disabled = selectedVersions.length !== 2;
        }

        function compareVersions() {
            if (selectedVersions.length !== 2) return;
            
            const [v1, v2] = selectedVersions;
            const version1 = changelogData.find(v => v.version === v1);
            const version2 = changelogData.find(v => v.version === v2);
            
            if (!version1 || !version2) return;
            
            const compareBody = document.getElementById('compareBody');
            compareBody.innerHTML = `
                <div class="compare-columns">
                    <div class="compare-column">
                        <div class="compare-column-header">v${version1.version} (${formatDate(version1.date)})</div>
                        ${renderCompareSection('新功能', version1.features)}
                        ${renderCompareSection('改进', version1.improvements)}
                        ${renderCompareSection('修复', version1.fixes)}
                        ${renderCompareSection('破坏性变更', version1.breaking)}
                    </div>
                    <div class="compare-column">
                        <div class="compare-column-header">v${version2.version} (${formatDate(version2.date)})</div>
                        ${renderCompareSection('新功能', version2.features)}
                        ${renderCompareSection('改进', version2.improvements)}
                        ${renderCompareSection('修复', version2.fixes)}
                        ${renderCompareSection('破坏性变更', version2.breaking)}
                    </div>
                </div>
            `;
            
            document.getElementById('compareModal').classList.add('visible');
        }

        function renderCompareSection(title, items) {
            if (items.length === 0) return '';
            return `
                <div class="compare-section">
                    <div class="compare-section-title">${title}</div>
                    ${items.map(item => `<div class="compare-item">${item}</div>`).join('')}
                </div>
            `;
        }

        function closeCompareModal() {
            document.getElementById('compareModal').classList.remove('visible');
        }

        function cancelCompare() {
            compareMode = false;
            selectedVersions = [];
            updateCompareUI();
            renderAll();
        }

        function copyVersionInfo(version) {
            const versionData = changelogData.find(v => v.version === version);
            if (!versionData) return;
            
            let text = `v${versionData.version} (${formatDate(versionData.date)})\n\n`;
            
            if (versionData.features.length > 0) {
                text += '新功能:\n';
                versionData.features.forEach(f => text += `  • ${f}\n`);
                text += '\n';
            }
            
            if (versionData.improvements.length > 0) {
                text += '改进:\n';
                versionData.improvements.forEach(i => text += `  • ${i}\n`);
                text += '\n';
            }
            
            if (versionData.fixes.length > 0) {
                text += '修复:\n';
                versionData.fixes.forEach(f => text += `  • ${f}\n`);
                text += '\n';
            }
            
            if (versionData.breaking.length > 0) {
                text += '破坏性变更:\n';
                versionData.breaking.forEach(b => text += `  • ${b}\n`);
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板');
            });
        }

        function exportMarkdown() {
            let md = '# 更新日志\n\n';
            
            changelogData.forEach(version => {
                md += `## v${version.version} (${formatDate(version.date)})\n\n`;
                
                if (version.features.length > 0) {
                    md += '### 新功能\n';
                    version.features.forEach(f => md += `- ${f}\n`);
                    md += '\n';
                }
                
                if (version.improvements.length > 0) {
                    md += '### 改进\n';
                    version.improvements.forEach(i => md += `- ${i}\n`);
                    md += '\n';
                }
                
                if (version.fixes.length > 0) {
                    md += '### 修复\n';
                    version.fixes.forEach(f => md += `- ${f}\n`);
                    md += '\n';
                }
                
                if (version.breaking.length > 0) {
                    md += '### 破坏性变更\n';
                    version.breaking.forEach(b => md += `- ${b}\n`);
                    md += '\n';
                }
            });
            
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'changelog.md';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Markdown文件已导出');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            
            setTimeout(() => {
                toast.classList.remove('visible');
            }, 2000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        }

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case '/':
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                    break;
                case 'd':
                case 'D':
                    toggleTheme();
                    break;
                case 'e':
                case 'E':
                    expandAll();
                    break;
                case 'Escape':
                    closeCompareModal();
                    closeSidebar();
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            renderAll();
            updateLastUpdated();
        });
    </script>
</body>
</html>
