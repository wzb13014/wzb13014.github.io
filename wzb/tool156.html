<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作汇报「废话文学」模仿器</title>
<style>
:root{
  --bg1:#0f1020; --bg2:#1b1c38; --card:#232447; --card2:#2b2d5e;
  --ink:#eef0ff; --muted:#a7a9d8; --accent:#7c6cff; --accent2:#ff6bb0;
  --good:#3ddc97; --warn:#ffc86b; --bad:#ff6b6b;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--ink); min-height:100vh; padding:24px 16px 60px;
}
.wrap{max-width:1180px;margin:0 auto;}
header{text-align:center;margin-bottom:22px;}
h1{font-size:30px;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;}
.sub{color:var(--muted);margin-top:6px;font-size:14px;}
header .badge{display:inline-block;margin-left:10px;font-size:12px;color:var(--accent2);
  border:1px solid var(--accent2);border-radius:20px;padding:2px 10px;vertical-align:middle;}

/* Layout */
.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}
@media(max-width:920px){.grid{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);
  padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
.card h2{font-size:15px;margin-bottom:14px;color:var(--accent);letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.card h2::before{content:"";width:4px;height:16px;background:linear-gradient(var(--accent),var(--accent2));border-radius:2px;}

label.ctl{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
.ctl-row{display:flex;gap:10px;flex-wrap:wrap;}
select,input[type=text]{width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.1);
  color:var(--ink);padding:9px 12px;border-radius:10px;font-size:14px;outline:none;}
select:focus,input[type=text]:focus{border-color:var(--accent);}
.field{display:flex;gap:8px;}
.field input{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);
  color:var(--ink);border:1px solid rgba(255,255,255,.1);padding:9px 14px;border-radius:10px;
  cursor:pointer;font-size:14px;transition:.15s;}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-weight:600;flex:1;}
.btn.primary:hover{filter:brightness(1.1);}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);}

/* Slider */
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--good),var(--warn) 50%,var(--bad));outline:none;}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);cursor:pointer;}
.slider-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;}
.pct{color:var(--warn);font-weight:700;}

/* Output */
#output{background:var(--card2);border-radius:var(--radius);padding:22px 26px;min-height:280px;
  white-space:pre-wrap;line-height:2.05;font-size:15px;font-family:"Kaiti","STKaiti","KaiTi",serif;}
#output .sign{margin-top:14px;text-align:right;color:var(--muted);font-size:13px;}
.placeholder{color:var(--muted);font-family:"Segoe UI","Microsoft YaHei",sans-serif;text-align:center;padding:60px 0;opacity:.6;}
.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;}
.metric{flex:1;min-width:120px;background:var(--card2);border-radius:12px;padding:12px;text-align:center;}
.metric .num{font-size:24px;font-weight:700;}
.metric .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;}
.metric.gauge .num{color:var(--warn);}
.metric.words .num{color:var(--good);}
.metric.phrases .num{color:var(--accent2);}
.metric.poison .num{color:var(--bad);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}

/* Quotes */
.quotes{display:flex;flex-direction:column;gap:8px;}
.qcat{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--card2);border:1px solid rgba(255,255,255,.08);color:var(--ink);
  font-size:12.5px;padding:6px 11px;border-radius:20px;cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-1px);}

/* History */
#history,#fav{display:flex;flex-direction:column;gap:8px;}
.hitem{background:var(--card2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;
  cursor:pointer;font-size:12.5px;color:var(--muted);transition:.15s;}
.hitem:hover{border-color:var(--accent);color:var(--ink);}
.hitem .t{color:var(--muted);font-size:11px;display:block;margin-top:3px;}
.empty{color:var(--muted);font-size:12.5px;opacity:.6;text-align:center;padding:10px;}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:13px;color:var(--muted);
  background:var(--card2);cursor:pointer;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.panel{display:none;}
.panel.active{display:block;}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;opacity:.6;}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:#fff;color:#222;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:99;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:560px){ h1{font-size:23px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工作汇报「废话文学」模仿器</h1><span class="badge">v2.0 · 领导听了直点头</span>
    <div class="sub">一键生成字字珠玑、句句空泛的职场汇报，主打一个「说了等于没说」。</div>
  </header>

  <div class="grid">
    <!-- 控制面板 -->
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="card">
        <h2>汇报配置</h2>

        <label class="ctl">汇报类型</label>
        <select id="type">
          <option value="year">年度总结</option>
          <option value="week">周报 / 月报</option>
          <option value="job">述职报告</option>
          <option value="meeting">会议发言</option>
          <option value="project">项目汇报</option>
          <option value="self">自我批评</option>
          <option value="inaug">就职表态</option>
          <option value="thanks">感谢致辞</option>
        </select>

        <label class="ctl">汇报语气</label>
        <select id="mood">
          <option value="up">昂扬自信 · 乘势而上</option>
          <option value="mod">谦虚低调 · 仍有不足</option>
          <option value="formal">正经八百 · 滴水不漏</option>
          <option value="self">痛心疾首 · 深刻检讨</option>
        </select>

        <label class="ctl">废话浓度 <span class="pct" id="densVal">80%</span></label>
        <input type="range" id="dens" min="0" max="100" value="80">
        <div class="slider-meta"><span>正常发言</span><span>纯纯废话</span></div>

        <label class="ctl">篇幅</label>
        <div class="ctl-row">
          <select id="len" style="flex:1;">
            <option value="short">短 · 三句打完卡</option>
            <option value="med" selected>中 · 常规汇报</option>
            <option value="long">长 · 会议时长凑足</option>
          </select>
        </div>

        <label class="ctl">汇报人信息</label>
        <div class="field">
          <input type="text" id="name" placeholder="姓名" value="王建国">
          <button class="btn sm" id="dice" title="随机代入">🎲</button>
        </div>
        <div class="field" style="margin-top:8px;">
          <input type="text" id="pos" placeholder="职位" value="副经理">
        </div>

        <label class="ctl">部门 / 单位</label>
        <input type="text" id="dept" placeholder="如：综合管理部" value="综合管理部">

        <label class="ctl">主题关键词（可填 1~3 个，逗号分隔）</label>
        <input type="text" id="tags" placeholder="如：党建, 数字化, 安全生产">

        <div style="margin-top:16px;display:flex;gap:8px;">
          <button class="btn primary" id="gen">✦ 生成废话</button>
          <button class="btn" id="clearOut" title="清空输出">清空</button>
        </div>
      </div>

      <div class="card">
        <div class="tabs">
          <div class="tab active" data-tab="quotes">金句库</div>
          <div class="tab" data-tab="hist">历史</div>
          <div class="tab" data-tab="fav">收藏</div>
        </div>
        <div id="quotes" class="panel active"></div>
        <div id="hist" class="panel"></div>
        <div id="fav" class="panel"></div>
      </div>
    </div>

    <!-- 输出区 -->
    <div class="card">
      <h2>汇报正文（点击金句可直接插入）</h2>
      <div class="metrics">
        <div class="metric gauge"><div class="num" id="mGauge">--</div><div class="lbl">废话指数</div></div>
        <div class="metric words"><div class="num" id="mWords">0</div><div class="lbl">字数</div></div>
        <div class="metric phrases"><div class="num" id="mPhrases">0</div><div class="lbl">高频套话</div></div>
        <div class="metric poison"><div class="num" id="mPoison">0</div><div class="lbl">毒句</div></div>
      </div>
      <div id="output"><div class="placeholder">配置好左侧参数，点击「生成废话」开始你的表演。</div></div>
      <div class="actions" style="margin-top:14px;">
        <button class="btn" id="copy">📋 复制全文</button>
        <button class="btn" id="download">⬇ 下载 .txt</button>
        <button class="btn" id="favBtn">⭐ 收藏</button>
      </div>
    </div>
  </div>

  <footer>仅供娱乐 · 切勿对号入座 · 被领导点名概不负责</footer>
</div>

<div id="toast"></div>

/* ============ 工具函数 ============ */
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function fill(s,c){return s.replace(/\$\{(\w+)\}/g,(m,k)=>c[k]||m);}
function uni(a){return a[Math.floor(Math.random()*a.length)];}

function buildCtx(tags){
  const thing=L.thing.slice();
  (tags||[]).forEach(t=>{const x=(t||"").trim();if(x)thing.push(x);});
  return {thing:uniq(thing)};
}
function uniq(a){return a.filter((v,i)=>a.indexOf(v)===i);}

/* ============ 句子构造器 ============ */
function outcome(){return "呈现出"+pick(L.outcome)+"的良好态势";}
function cliche(){return pick(L.cliche);}

function wrap(s,ctx,dens){
  // 用废话浓度决定加多少"空话调味"
  let out=s;
  if(dens>.15&&chance(dens)) out=fill(pick(L.guideSrc),{L:pick(L.leader)})+"，"+out;
  if(dens>.3&&chance(dens*.8)) out=pick(L.parPref)+"，"+out;
  if(dens>.5&&chance((dens-.3))) out=out+pick(L.parSuff);
  if(dens>.65&&chance((dens-.4))) out=out+"。同时，"+pick(L.empty);
  return out;
}

/* 分节生成 */
function sOpen(typeC,ctx,mood){
  const lead=fill(pick(L.open),{L:pick(L.leader),D:ctx.dept||"本部门"});
  let s=lead+"。";
  if(chance(.8)) s+=pick(L.intro)+"。";
  return s;
}
function sOverview(typeC,ctx,mood){
  const th=pick(ctx.thing), scope=ctx.dept?"全"+ctx.dept+"上下":"全部门上下";
  let s=`一年来，${scope}${pick(L.adv)}${pick(L.verbs)}${th}，`;
  s+=pick(L.height)+"；"+pick(L.par)+"，整体上"+outcome()+"。";
  if(chance(.7)) s+=cliche()+"。";
  return s;
}
function sAchieve(i,typeC,ctx,mood){
  const th=pick(ctx.thing), nm=pick(L.nouns);
  let s=`在${pick(L.adv)}${pick(L.verbs)}${th}的过程中，我们坚持${pick(L.par)}，`;
  s+=`围绕${pick(L.obj)}，做到了${pick(L.adv)}${pick(L.verbs)}${nm}、${pick(L.adv)}${pick(L.verbs)}${pick(L.nouns)}，`;
  s+=pick(L.empty)+"，最终"+outcome()+"。"+cliche()+"。";
  return s;
}
function sReflect(typeC,ctx,mood){
  let s="同时，我们也清醒地认识到：";
  const items=[pick(L.self),pick(L.self),pick(L.self)];
  s+=items.slice(0,chance(.5)?1:2).join("；")+"。";
  if(chance(.6)) s+=`这与${pick(L.par)}的要求相比，还存在不小差距。`;
  return s;
}
function sPlan(i,typeC,ctx,mood){
  const th=pick(ctx.thing), m=L.mood[mood]||L.mood.formal;
  let s=`下一步，我们将${pick(L.adv)}${pick(L.verbs)}${th}，`;
  s+=`坚持${pick(L.par)}，把${pick(L.obj)}抓实抓细、落细落实，`;
  s+=`努力做到${pick(L.height)}，同时${pick(L.plan)}，`;
  s+=pick(m.w)+"、"+pick(m.hot)+"。"+pick(m.resp)+"。";
  return s;
}
function sNums(typeC,ctx,mood){
  return `我们按照${pick(L.nums)}的总体思路，统筹推进、协同发力，`+
    `${pick(L.adv)}${pick(L.verbs)}${pick(ctx.thing)}，确保各项部署贯通到底、落地见效。`;
}
function sAssure(typeC,ctx,mood){
  const m=L.mood[mood]||L.mood.formal;
  return `${pick(L.par)}，力争${pick(L.adv)}${pick(L.verbs)}${pick(L.nouns)}、${pick(L.adv)}${pick(L.verbs)}${pick(L.nouns)}，`
    +`以${pick(L.obj)}的实绩实效，回报${pick(L.leader)}的信任与期望。${pick(m.resp)}。`;
}
function sClose(typeC,ctx){
  let s="";
  if(chance(.5)) s+=pick(L.dateClose)+" ";
  s+=pick(L.closeArr);
  return fill(s,{L:pick(L.leader)});
}

/* ============ 生成主流程 ============ */
function generate(){
  const type=$("type").value;
  const typeC=TYPE[type]||TYPE.year;
  const mood=$("mood").value;
  const dens=parseInt($("dens").value)/100;
  const len=$("len").value;
  const name=$("name").value.trim()||"王建国";
  const pos=$("pos").value.trim()||"";
  const dept=$("dept").value.trim()||"";
  const tags=$("tags").value.split(/[,，、\s]+/).filter(Boolean);

  const fullCtx=buildCtx(tags);
  fullCtx.dept=dept; fullCtx.name=name; fullCtx.pos=pos;

  const paras=[];
  // 标题
  paras.push(`关于${dept||"本部门"}${typeC.label}工作情况的汇报`);
  // 称呼
  paras.push(typeC.greeting);

  const selfFirst = typeC.selfFirst && mood==="self";
  if(selfFirst) paras.push(wrap(sReflect(typeC,fullCtx,mood),fullCtx,dens));

  paras.push(wrap(sOpen(typeC,fullCtx,mood),fullCtx,dens));
  paras.push(wrap(sOverview(typeC,fullCtx,mood),fullCtx,dens));

  const numN= len==="short"?0: len==="med"?1:2;
  for(let i=0;i<numN;i++) paras.push(wrap(sNums(typeC,fullCtx,mood),fullCtx,dens));

  const achN= len==="short"?2: len==="med"?3:5;
  for(let i=0;i<achN;i++) paras.push(wrap(sAchieve(i,typeC,fullCtx,mood),fullCtx,dens));

  if(!selfFirst && (typeC.doReflect||dens>.55))
    paras.push(wrap(sReflect(typeC,fullCtx,mood),fullCtx,dens));

  const planN= len==="short"?1: len==="med"?2:3;
  for(let i=0;i<planN;i++) paras.push(wrap(sPlan(i,typeC,fullCtx,mood),fullCtx,dens));

  if(len==="long") paras.push(wrap(sAssure(typeC,fullCtx,mood),fullCtx,dens));

  // 结尾 + 落款
  const closePar=sClose(typeC,fullCtx);
  paras.push(closePar);
  const today=new Date();
  const ds=`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
  paras.push(`汇报人：${name}${pos?"（"+pos+"）":""}\n${typeC.greeting.includes("致辞")?"":"\n"+ds}`);

  return paras.join("\n\n");
}

/* ============ 渲染 & 交互 ============ */
function render(){
  const out=generate();
  $("output").innerHTML=out.split("\n").map(line=>line===""?"<br>":line).join("\n");
  calcMetrics(out);
}
function calcMetrics(text){
  const total=text.replace(/\s/g,"").length;
  const hit=(text.match(/(进一步|高度重视|切实提高|不断推进|深入贯彻|认真落实|切实抓好|扎实做好|持续提升|着力推动|全面加强|确保到位|落地见效|思想上|行动上|层层传导|久久为功|钉钉子|稳中有进|态势良好|明显增强|不断增强|取得实效|见到实效|再上新台阶|迈上新台阶|抓深抓实|压实责任|最后一公里|两手抓|闭环|对标对表|可感可及)/g)||[]);
  const poison=(text.match(/(说了等于没说|纯属|一个字都没有听进去)/g)||[]).length;
  const density=parseInt($("dens").value);
  const score=Math.min(100, Math.round(hit.length*2 + total*0.03 + density*0.45));
  $("mGauge").textContent=score+"%";
  $("mGauge").style.color=score>70?"var(--bad)":score>40?"var(--warn)":"var(--good)";
  $("mWords").textContent=total;
  $("mPhrases").textContent=hit.length;
  $("mPoison").textContent=poison;
}

  const txt=getText(); if(!txt)return toast("还没有内容");
  try{await navigator.clipboard.writeText(txt);}catch(e){
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  toast("已复制，去群里装逼吧");
});
$("download").addEventListener("click",()=>{
  const txt=getText(); if(!txt)return toast("还没有内容");
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`工作汇报废话文学_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();URL.revokeObjectURL(a.href);
});
$("favBtn").addEventListener("click",()=>{
  const txt=getText(); if(!txt)return toast("还没有内容");
  favs.unshift({text:txt,t:new Date().toLocaleString()});favs=favs.slice(0,20);
  localStorage.setItem("wf_fav",JSON.stringify(favs));renderFav();toast("已收藏");
});
$("clearOut").addEventListener("click",()=>{
  $("output").innerHTML=`<div class="placeholder">已清空。领导问起来就说「还在整理」。</div>`;
  $("mGauge").textContent="--";$("mWords").textContent=0;$("mPhrases").textContent=0;$("mPoison").textContent=0;
});
$("dens").addEventListener("input",e=>$("densVal").textContent=e.target.value+"%");
$("dice").addEventListener("click",()=>{
  const names=["王建国","李富贵","赵铁柱","孙彩凤","钱满仓","周立言","吴德贵","郑多金"];
  const poss=["副经理","主任科员","项目负责人","小组长","专员","科员","负责人","协调员"];
  $("name").value=pick(names);$("pos").value=pick(poss);
  toast("人物已随机代入");
});
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  tab.classList.add("active");$(tab.dataset.tab).classList.add("active");
}));

/* 输出区点击任意位置可编辑追加（金句插入后自动换行） */
$("output").addEventListener("click",()=>{});

/* 初始化 */
renderQuotes();renderHist();renderFav();
</script>
</body>
</html>
