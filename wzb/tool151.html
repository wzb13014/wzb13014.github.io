<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>图片搜索聚合 · 液态玻璃</title>
<style>
/* ============================================================
   Liquid Glass Design System  (iOS 26 style)
   ============================================================ */
:root {
    --bg-base: #eef1f7;

    --glass-bg:        rgba(255, 255, 255, 0.50);
    --glass-bg-strong: rgba(255, 255, 255, 0.68);
    --glass-bg-soft:   rgba(255, 255, 255, 0.34);
    --glass-border:    rgba(255, 255, 255, 0.60);
    --glass-inner:     rgba(255, 255, 255, 0.90);
    --glass-edge:      rgba(255, 255, 255, 0.85);

    --text:           #14141a;
    --text-secondary: #55555f;
    --text-tertiary:  #8b8b95;

    --accent:        #0a84ff;
    --accent-hover:  #3395ff;
    --accent-2:      #5e5ce6;
    --accent-light:  rgba(10, 132, 255, 0.14);
    --danger:        #ff453a;
    --success:       #30d158;
    --warning:       #ff9f0a;

    --radius-sm: 14px;
    --radius:    20px;
    --radius-lg: 26px;
    --radius-xl: 32px;

    --ease:        cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-slow:   cubic-bezier(0.25, 0.1, 0.25, 1);

    --blur: 28px;
    --sat:  190%;

    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
}

[data-theme="dark"] {
    --bg-base: #08080c;

    --glass-bg:        rgba(42, 42, 50, 0.48);
    --glass-bg-strong: rgba(48, 48, 58, 0.66);
    --glass-bg-soft:   rgba(58, 58, 70, 0.30);
    --glass-border:    rgba(255, 255, 255, 0.14);
    --glass-inner:     rgba(255, 255, 255, 0.20);
    --glass-edge:      rgba(255, 255, 255, 0.55);

    --text:           #f5f5f7;
    --text-secondary: #a8a8b3;
    --text-tertiary:  #71717d;

    --accent:        #4da3ff;
    --accent-hover:  #66b2ff;
    --accent-2:      #7b79ff;
    --accent-light:  rgba(77, 163, 255, 0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
                 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg-base);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.7s var(--ease), color 0.5s var(--ease);
}

/* ============ 极光背景 ============ */
.aurora {
    position: fixed;
    inset: -30%;
    z-index: 0;
    pointer-events: none;
    filter: blur(70px) saturate(150%);
    transition: opacity 0.8s var(--ease);
}
.aurora::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(30% 34% at 16% 20%, rgba(255, 138, 180, 0.60) 0%, transparent 70%),
        radial-gradient(28% 32% at 84% 14%, rgba(122, 167, 255, 0.60) 0%, transparent 70%),
        radial-gradient(32% 36% at 76% 84%, rgba(112, 235, 205, 0.55) 0%, transparent 70%),
        radial-gradient(28% 32% at 18% 82%, rgba(196, 152, 255, 0.55) 0%, transparent 70%),
        radial-gradient(26% 28% at 50% 46%, rgba(255, 226, 138, 0.45) 0%, transparent 72%);
    animation: auroraFloat 30s ease-in-out infinite alternate;
}
[data-theme="dark"] .aurora { opacity: 0.62; filter: blur(80px) saturate(130%); }
[data-theme="dark"] .aurora::before {
    background:
        radial-gradient(30% 34% at 16% 20%, rgba(122, 58, 148, 0.80) 0%, transparent 70%),
        radial-gradient(28% 32% at 84% 14%, rgba(38, 78, 168, 0.85) 0%, transparent 70%),
        radial-gradient(32% 36% at 76% 84%, rgba(22, 118, 110, 0.75) 0%, transparent 70%),
        radial-gradient(28% 32% at 18% 82%, rgba(88, 52, 150, 0.75) 0%, transparent 70%),
        radial-gradient(26% 28% at 50% 46%, rgba(150, 90, 40, 0.40) 0%, transparent 72%);
}
@keyframes auroraFloat {
    0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
    50%  { transform: translate3d(3%, -2.5%, 0) scale(1.14) rotate(7deg); }
    100% { transform: translate3d(-3%, 2%, 0) scale(1.06) rotate(-6deg); }
}

/* ============ 布局（已修复两侧留白） ============ */
.main-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1680px;              /* 由 1120px 扩展，充分利用宽屏 */
    margin: 0 auto;
    padding: 24px clamp(16px, 2.2vw, 44px) 60px;
}

/* 超宽屏进一步铺满 */
@media (min-width: 1900px) {
    .main-container { max-width: 1840px; }
}
@media (min-width: 2400px) {
    .main-container { max-width: 96vw; }
}

/* ============ 顶部栏 ============ */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 10px 14px 10px 18px;
    border-radius: 26px;
    margin-bottom: 18px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border: 1px solid var(--glass-border);
    box-shadow:
        0 14px 34px -18px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 0 var(--glass-inner);
    position: relative;
}
.top-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        var(--glass-edge) 0%, rgba(255,255,255,0.15) 30%,
        rgba(255,255,255,0) 55%, rgba(255,255,255,0.35) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    pointer-events: none;
}

.logo-area { display: flex; align-items: center; gap: 12px; user-select: none; }

.logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(145deg, #2ea3ff 0%, #0a84ff 45%, #5e5ce6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -3px 8px rgba(0, 0, 0, 0.18),
        0 8px 20px -8px rgba(10, 132, 255, 0.85);
}
.logo-text {
    font-size: 1.12rem;
    font-weight: 700;
    letter-spacing: -0.4px;
    white-space: nowrap;
}
.logo-sub {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    font-weight: 400;
    letter-spacing: 0.1px;
}

.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: transform 0.4s var(--ease-spring), background 0.3s var(--ease),
                box-shadow 0.3s var(--ease), color 0.3s var(--ease);
    position: relative;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 var(--glass-inner);
}
.btn-icon:hover {
    background: var(--glass-bg-strong);
    color: var(--text);
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 10px 22px -10px rgba(0, 0, 0, 0.45), inset 0 1px 0 var(--glass-inner);
}
.btn-icon:active { transform: scale(0.92); transition: 0.1s; }
.btn-icon.active {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 140%);
    border-color: rgba(255, 255, 255, 0.4);
    color: #fff;
    box-shadow: 0 10px 24px -8px rgba(10, 132, 255, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

/* ============ 搜索区 ============ */
.search-section { margin-bottom: 22px; }

.search-wrapper {
    position: relative;
    border-radius: var(--radius-xl);
    background: var(--glass-bg-strong);
    backdrop-filter: blur(40px) saturate(210%);
    -webkit-backdrop-filter: blur(40px) saturate(210%);
    border: 1px solid var(--glass-border);
    box-shadow:
        0 28px 60px -28px rgba(0, 0, 0, 0.42),
        0 4px 14px -6px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 0 var(--glass-inner),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.5s var(--ease-spring), box-shadow 0.45s var(--ease),
                border-color 0.45s var(--ease);
    z-index: 10;
}
.search-wrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        var(--glass-edge) 0%, rgba(255, 255, 255, 0.12) 32%,
        rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, 0.40) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    pointer-events: none;
    z-index: 5;
}
.search-wrapper:focus-within {
    transform: translateY(-2px);
    box-shadow:
        0 34px 70px -28px rgba(10, 132, 255, 0.55),
        0 0 0 4px rgba(10, 132, 255, 0.16),
        inset 0 1px 0 0 var(--glass-inner);
    border-color: rgba(10, 132, 255, 0.45);
}

.search-inner {
    display: flex;
    align-items: center;
    padding: 8px 10px 8px 20px;
    gap: 8px;
}
.search-icon {
    font-size: 19px;
    color: var(--text-tertiary);
    flex-shrink: 0;
    transition: color 0.3s var(--ease), transform 0.4s var(--ease-spring);
}
.search-wrapper:focus-within .search-icon {
    color: var(--accent);
    transform: scale(1.12);
}
.search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 1.05rem;
    background: transparent;
    color: var(--text);
    padding: 12px 4px;
    min-width: 0;
    font-family: inherit;
    letter-spacing: 0.2px;
}
.search-input::placeholder { color: var(--text-tertiary); }

.search-clear {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: var(--glass-bg-soft);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.7);
    transition: all 0.35s var(--ease-spring);
}
.search-clear.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.search-clear:hover { background: var(--glass-bg-strong); color: var(--text); transform: scale(1.1); }

.search-submit {
    padding: 12px 26px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.32);
    background: linear-gradient(180deg, #2ea3ff 0%, #0a84ff 55%, #0a6fe0 100%);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.4px;
    font-family: inherit;
    box-shadow:
        0 10px 24px -10px rgba(10, 132, 255, 0.95),
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -2px 6px rgba(0, 0, 0, 0.15);
    transition: transform 0.4s var(--ease-spring), box-shadow 0.3s var(--ease), filter 0.3s;
}
.search-submit:hover {
    transform: translateY(-2px) scale(1.02);
    filter: brightness(1.06);
    box-shadow:
        0 16px 32px -12px rgba(10, 132, 255, 1),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.search-submit:active { transform: scale(0.95); transition: 0.08s; }

/* ============ 选项栏 ============ */
.search-options-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
    padding: 0 4px;
}
.option-chip {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.82rem;
    white-space: nowrap;
    user-select: none;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: inset 0 1px 0 var(--glass-inner);
    transition: transform 0.4s var(--ease-spring), background 0.3s var(--ease),
                box-shadow 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s;
}
.option-chip:hover {
    background: var(--glass-bg-strong);
    color: var(--text);
    transform: translateY(-2px);
}
.option-chip.active {
    background: linear-gradient(180deg, #2ea3ff 0%, #0a84ff 100%);
    border-color: rgba(255, 255, 255, 0.45);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 10px 22px -10px rgba(10, 132, 255, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.divider-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-tertiary); opacity: 0.5; flex-shrink: 0;
}

/* ============ 热门标签 ============ */
.hot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    padding: 0 4px;
}
.hot-tag {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px dashed var(--glass-border);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(14px) saturate(170%);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    font-family: inherit;
    letter-spacing: 0.2px;
    box-shadow: inset 0 1px 0 var(--glass-inner);
    transition: transform 0.4s var(--ease-spring), background 0.3s, color 0.3s, border-color 0.3s;
}
.hot-tag:hover {
    background: var(--glass-bg-strong);
    border-style: solid;
    color: var(--accent);
    border-color: rgba(10, 132, 255, 0.55);
    transform: translateY(-2px) scale(1.03);
}
.hot-tag .tag-fire { margin-right: 3px; }

/* ============ 标题 ============ */
.section-title {
    font-size: 0.76rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-tertiary);
    margin: 30px 0 14px 8px;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--glass-border), transparent);
    margin-left: 4px;
}

/* ============ 引擎卡片 ============ */
.engines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
}

.engine-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 16px;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
        0 10px 26px -16px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 0 var(--glass-inner),
        inset 0 -1px 1px 0 rgba(255, 255, 255, 0.06);
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    user-select: none;
    text-decoration: none;
    color: inherit;
    transition: transform 0.55s var(--ease-spring), box-shadow 0.45s var(--ease),
                background 0.4s var(--ease);
}

.engine-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        var(--glass-edge) 0%, rgba(255, 255, 255, 0.16) 30%,
        rgba(255, 255, 255, 0) 54%, rgba(255, 255, 255, 0.36) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    pointer-events: none;
    z-index: 5;
}

.engine-card::after {
    content: '';
    position: absolute;
    top: -60%;
    left: -70%;
    width: 38%;
    height: 220%;
    background: linear-gradient(100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 100%);
    transform: rotate(18deg);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: left 0.85s var(--ease), opacity 0.35s var(--ease);
}
.engine-card:hover::after { left: 135%; opacity: 1; }
[data-theme="dark"] .engine-card::after {
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
}

.engine-card:hover {
    transform: translateY(-5px) scale(1.018);
    background: var(--glass-bg-strong);
    box-shadow:
        0 24px 46px -20px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 0 var(--glass-inner);
}
.engine-card:active {
    transform: translateY(-1px) scale(0.975);
    transition: 0.12s;
}

.engine-card .card-glow {
    position: absolute;
    top: -40px;
    right: -40px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    filter: blur(18px);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
.engine-card:hover .card-glow { opacity: 0.7; transform: scale(1.25); }

.engine-card .ec-icon {
    position: relative;
    z-index: 3;
    width: 46px;
    height: 46px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    flex-shrink: 0;
    letter-spacing: -0.5px;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -3px 8px rgba(0, 0, 0, 0.22),
        0 8px 18px -8px rgba(0, 0, 0, 0.7);
    transition: transform 0.55s var(--ease-spring);
}
.engine-card:hover .ec-icon { transform: scale(1.08) rotate(-3deg); }

.engine-card .ec-info { position: relative; z-index: 3; min-width: 0; }
.engine-card .ec-name {
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: -0.2px;
    color: var(--text);
}
.engine-card .ec-desc {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.engine-card .ec-shortcut {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 0.62rem;
    font-family: var(--font-mono);
    color: var(--text-tertiary);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    padding: 2px 7px;
    border-radius: 9px;
    z-index: 4;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s var(--ease), transform 0.35s var(--ease-spring);
    letter-spacing: 0.5px;
}
.engine-card:hover .ec-shortcut { opacity: 1; transform: translateY(0); }

.engine-card .ec-check {
    position: absolute;
    bottom: 10px;
    right: 12px;
    z-index: 6;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--glass-border);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.4s var(--ease-spring);
}
.engine-card.multi-select-mode .ec-check { opacity: 1; transform: scale(1); }
.engine-card.selected .ec-check {
    opacity: 1;
    transform: scale(1);
    background: linear-gradient(180deg, #2ea3ff, #0a84ff);
    border-color: rgba(255, 255, 255, 0.6);
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(10, 132, 255, 1), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.engine-card.selected {
    border-color: rgba(10, 132, 255, 0.55);
    box-shadow:
        0 0 0 3px rgba(10, 132, 255, 0.16),
        0 18px 38px -20px rgba(10, 132, 255, 0.7),
        inset 0 1px 0 var(--glass-inner);
    background: var(--glass-bg-strong);
}

/* ============ 多选操作栏 ============ */
.multi-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 13px 18px;

/* ============ 历史下拉 ============ */

    display: none;
}
.history-dropdown.show {
    display: block;
    animation: glassDrop 0.35s var(--ease-spring);
}
@keyframes glassDrop {
    from { opacity: 0; transform: translateY(-10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 18px;
    border-bottom: 1px solid var(--glass-border);

    color: var(--text-tertiary);
    font-weight: 600;
    letter-spacing: 0.8px;

}
.history-clear-btn {
    background: none;
    border: none;
    color: var(--danger);

    font-size: 0.76rem;
    font-family: inherit;
    padding: 4px 10px;

}
.history-clear-btn:hover { background: rgba(255, 69, 58, 0.12); }

.history-list { max-height: 240px; overflow-y: auto; padding: 6px 0; }
.history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;

    font-size: 0.9rem;

}
.history-item:hover { background: var(--glass-bg-soft); }
.history-item .hi-icon { font-size: 13px; color: var(--text-tertiary); flex-shrink: 0; }
.history-item .hi-text {
    flex: 1;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.history-item .hi-delete {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 11px;
    flex-shrink: 0;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s var(--ease);
}
.history-item:hover .hi-delete { opacity: 1; }
.history-item .hi-delete:hover { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
.history-empty {
    padding: 28px;
    text-align: center;
    color: var(--text-tertiary);

}

/* ============ 设置面板 ============ */
.settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.28);

    -webkit-backdrop-filter: blur(10px) saturate(130%);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s var(--ease);
}
.settings-overlay.show { opacity: 1; pointer-events: auto; }

.settings-panel {
    position: relative;
    width: 90%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 30px 32px;
    border-radius: 32px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(50px) saturate(220%);
    -webkit-backdrop-filter: blur(50px) saturate(220%);

        0 50px 100px -40px rgba(0, 0, 0, 0.7),

}
.settings-overlay.show .settings-panel { transform: scale(1) translateY(0); opacity: 1; }
.settings-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        var(--glass-edge) 0%, rgba(255, 255, 255, 0.14) 30%,
        rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, 0.38) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    pointer-events: none;
}
.settings-panel h3 {
    font-size: 1.15rem;
    margin-bottom: 22px;
    letter-spacing: -0.3px;
    font-weight: 700;
}
.setting-row {

    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--glass-border);
    gap: 14px;
}
.setting-row:last-of-type { border-bottom: none; }
.setting-label { font-size: 0.9rem; font-weight: 500; }
.setting-desc { font-size: 0.74rem; color: var(--text-tertiary); margin-top: 3px; }

.toggle-switch {
    width: 50px;
    height: 30px;
    border-radius: 15px;
    background: var(--glass-bg-soft);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 0.35s var(--ease), border-color 0.35s;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.12);
}
.toggle-switch.active {
    background: linear-gradient(180deg, #2ea3ff, #0a84ff);
    border-color: rgba(255, 255, 255, 0.35);
}
.toggle-switch::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 -1px 2px rgba(0, 0, 0, 0.08);
    transition: transform 0.4s var(--ease-spring);
}
.toggle-switch.active::after { transform: translateX(20px); }

.select-mini {
    padding: 8px 14px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-soft);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;

}

}

.btn-close-panel {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-soft);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.9rem;
    box-shadow: inset 0 1px 0 var(--glass-inner);
    transition: transform 0.4s var(--ease-spring), background 0.3s;
}
.btn-close-panel:hover { background: var(--glass-bg-strong); transform: translateY(-2px); }
.btn-close-panel:active { transform: scale(0.97); }

/* ============ Toast ============ */
.toast-container {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}
.toast {
    padding: 13px 22px;
    border-radius: 999px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(34px) saturate(210%);
    -webkit-backdrop-filter: blur(34px) saturate(210%);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
    box-shadow:
        0 22px 46px -18px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 var(--glass-inner);
    animation: toastIn 0.45s var(--ease-spring), toastOut 0.45s var(--ease) forwards;
    pointer-events: auto;
}
.toast.success { color: var(--success); border-color: rgba(48, 209, 88, 0.35); }
.toast.warning { color: var(--warning); border-color: rgba(255, 159, 10, 0.35); }

@keyframes toastIn {
    from { transform: translateX(120%) scale(0.9); opacity: 0; }
    to   { transform: translateX(0) scale(1); opacity: 1; }
}
@keyframes toastOut {
    0%, 70% { opacity: 1; transform: translateX(0) scale(1); }
    100%    { opacity: 0; transform: translateY(-16px) scale(0.94); }
}

/* ============ 滚动条 ============ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: rgba(140, 140, 160, 0.35);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(140, 140, 160, 0.6); background-clip: content-box; }

/* ============ 响应式 ============ */
@media (max-width: 768px) {
    .main-container { padding: 16px 16px 48px; }
    .engines-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
    .engine-card { padding: 13px 14px; gap: 10px; border-radius: 20px; }
    .engine-card .ec-icon { width: 38px; height: 38px; font-size: 0.9rem; border-radius: 12px; }

    .search-inner { padding: 6px 8px 6px 16px; gap: 6px; }

    .search-wrapper { border-radius: 26px; }
    .logo-text { font-size: 1rem; }

    .option-chip { font-size: 0.74rem; padding: 7px 12px; }
    .hot-tag { font-size: 0.72rem; padding: 6px 11px; }
    .multi-bar { gap: 8px; padding: 11px 14px; border-radius: 20px; }
    .multi-bar .btn-multi { font-size: 0.74rem; padding: 8px 14px; }
    .settings-panel { padding: 24px 20px; border-radius: 28px; }
    .top-bar { border-radius: 22px; padding: 9px 10px 9px 14px; }
}

@media (max-width: 400px) {
    .engines-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .engine-card { padding: 11px; gap: 8px; flex-direction: column; align-items: flex-start; }
    .engine-card .ec-icon { width: 34px; height: 34px; font-size: 0.82rem; border-radius: 11px; }
    .search-submit { padding: 10px 14px; font-size: 0.78rem; }

}

/* ============ 减少动效 ============ */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.12s !important;
    }
    .aurora::before { animation: none; }
}
</style>
</head>

            icon: 'DD', color: '#de5833', colorBg: '#fef0eb',
            url: 'https://duckduckgo.com/?q={query}&iax=images&ia=images',
            sizeMap: { large: '&iaSize=large', medium: '&iaSize=medium', small: '&iaSize=small',
                wallpaper: '&iaSize=wallpaper', square: '&iaSize=square', all: '' },
            safeParam: '&safe=1'
        }],
        stock: [{
            id: 'unsplash', name: 'Unsplash', desc: '高质量免费摄影图库',
            icon: 'U', color: '#111111', colorBg: '#e8e8e8',
            url: 'https://unsplash.com/s/photos/{query}',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }, {
            id: 'pexels', name: 'Pexels', desc: '免费高质量图片视频',
            icon: 'P', color: '#05a081', colorBg: '#e6f7f3',
            url: 'https://www.pexels.com/search/{query}/',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }, {
            id: 'pixabay', name: 'Pixabay', desc: '全球免费正版图库',
            icon: 'Pi', color: '#2ec66d', colorBg: '#eafbf2',
            url: 'https://pixabay.com/images/search/{query}/',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }, {
            id: 'flickr', name: 'Flickr', desc: '摄影社区与图库',
            icon: 'F', color: '#ff0084', colorBg: '#ffe6f2',
            url: 'https://www.flickr.com/search/?text={query}&license=4,5,6,7,8,9,10',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }],
        design: [{
            id: 'pinterest', name: 'Pinterest', desc: '全球创意灵感平台',
            icon: 'Pt', color: '#e60023', colorBg: '#ffe6ea',
            url: 'https://www.pinterest.com/search/pins/?q={query}',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }, {
            id: 'behance', name: 'Behance', desc: 'Adobe创意作品平台',
            icon: 'Be', color: '#0057ff', colorBg: '#e6eeff',
            url: 'https://www.behance.net/search/projects?search={query}&field=photography',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }, {
            id: 'dribbble', name: 'Dribbble', desc: 'UI/UX设计作品展示',
            icon: 'Dr', color: '#ea4c89', colorBg: '#fde8f0',
            url: 'https://dribbble.com/search/{query}',
            sizeMap: { all: '', large: '', medium: '', small: '', wallpaper: '', square: '' }, safeParam: ''
        }]
    };

    // 国内搜索引擎
    const domesticEngines = [{
        id: 'sogou', name: '搜狗图片', desc: '搜狗图片搜索',
        icon: '搜', color: '#ff6c00', colorBg: '#fff3e6',
        url: 'https://pic.sogou.com/pics?query={query}',
        sizeMap: { large: '&picdim=5', medium: '&picdim=3', small: '&picdim=1',
            wallpaper: '&picdim=5', square: '', all: '' },
        safeParam: '', category: 'search'
    }, {
        id: '360', name: '360图片', desc: '360图片搜索',
        icon: '360', color: '#3dbb3d', colorBg: '#ecf9ec',
        url: 'https://image.so.com/i?q={query}',
        sizeMap: { large: '&imgtype=1', medium: '&imgtype=2', small: '&imgtype=3',
            wallpaper: '&imgtype=1', square: '', all: '' },
        safeParam: '', category: 'search'
    }, {
        id: 'bing_cn', name: '必应国内', desc: '必应中国图片搜索',
        icon: '必', color: '#0067b8', colorBg: '#e6f1f9',
        url: 'https://cn.bing.com/images/search?q={query}',
        sizeMap: { large: '&qft=+filterui:imagesize-wallpaper', medium: '&qft=+filterui:imagesize-medium',
            small: '&qft=+filterui:imagesize-small', wallpaper: '&qft=+filterui:imagesize-wallpaper',
            square: '&qft=+filterui:aspect-square', all: '' },
        safeParam: '&safeSearch=strict', category: 'search'
    }];

    const fullSearchEngines = [...enginesData.search, ...domesticEngines.filter(e => e.category === 'search')];
    const allEngines = [...fullSearchEngines, ...enginesData.stock, ...enginesData.design];

    // ==================== 状态管理 ====================
    let state = {
        theme: localStorage.getItem('imgsearch_theme') || 'light',
        searchHistory: JSON.parse(localStorage.getItem('imgsearch_history') || '[]'),
        defaultEngine: localStorage.getItem('imgsearch_default_engine') || 'google',
        openMode: localStorage.getItem('imgsearch_open_mode') || 'new_tab',
        safeSearch: localStorage.getItem('imgsearch_safe') === 'true',
        showShortcutHint: localStorage.getItem('imgsearch_shortcut_hint') !== 'false',
        rememberHistory: localStorage.getItem('imgsearch_remember_history') !== 'false',
        selectedSize: 'all',
        multiSelectMode: false,
        selectedEngines: new Set(),
        currentQuery: ''
    };

    function saveState() {
        localStorage.setItem('imgsearch_theme', state.theme);
        localStorage.setItem('imgsearch_history', JSON.stringify(state.searchHistory));
        localStorage.setItem('imgsearch_default_engine', state.defaultEngine);
        localStorage.setItem('imgsearch_open_mode', state.openMode);
        localStorage.setItem('imgsearch_safe', state.safeSearch);
        localStorage.setItem('imgsearch_shortcut_hint', state.showShortcutHint);
        localStorage.setItem('imgsearch_remember_history', state.rememberHistory);
    }

    // ==================== DOM ====================
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const searchInput = $('#searchInput');
    const searchClear = $('#searchClear');
    const searchSubmit = $('#searchSubmit');
    const searchWrapper = $('#searchWrapper');
    const historyDropdown = $('#historyDropdown');
    const historyList = $('#historyList');
    const historyClearAll = $('#historyClearAll');
    const multiBar = $('#multiBar');
    const multiCount = $('#multiCount');
    const btnMultiSearch = $('#btnMultiSearch');
    const btnMultiClear = $('#btnMultiClear');
    const btnMultiMode = $('#btnMultiMode');
    const btnSettings = $('#btnSettings');
    const btnTheme = $('#btnTheme');
    const settingsOverlay = $('#settingsOverlay');
    const btnCloseSettings = $('#btnCloseSettings');
    const settingDefaultEngine = $('#settingDefaultEngine');
    const settingOpenMode = $('#settingOpenMode');
    const toggleSafeDefault = $('#toggleSafeDefault');
    const toggleShortcutHint = $('#toggleShortcutHint');
    const toggleHistory = $('#toggleHistory');
    const btnSafeSearch = $('#btnSafeSearch');
    const toastContainer = $('#toastContainer');
    const enginesGridSearch = $('#enginesGridSearch');
    const enginesGridStock = $('#enginesGridStock');
    const enginesGridDesign = $('#enginesGridDesign');

    // ==================== 初始化 ====================
    function init() {
        applyTheme();
        renderAllEngineCards();
        renderHistory();
        updateSearchClear();
        updateSafeSearchBtn();
        updateMultiBar();
        populateSettings();
        bindEvents();
        setTimeout(() => searchInput.focus(), 350);
    }

    function applyTheme() {
        document.body.setAttribute('data-theme', state.theme);
        btnTheme.textContent = state.theme === 'dark' ? '☀️' : '🌓';
        btnTheme.classList.toggle('active', state.theme === 'dark');
    }

    // ==================== 渲染卡片 ====================
    function renderAllEngineCards() {
        renderEngineCards(enginesGridSearch, fullSearchEngines, 1);
        renderEngineCards(enginesGridStock, enginesData.stock, fullSearchEngines.length + 1);
        renderEngineCards(enginesGridDesign, enginesData.design,
            fullSearchEngines.length + enginesData.stock.length + 1);
        updateAllCardShortcuts();
        updateAllCardSelectionUI();
    }

    function renderEngineCards(container, engines, startIndex) {
        container.innerHTML = '';
        engines.forEach((engine, i) => {
            const index = startIndex + i;
            const card = document.createElement('a');
            card.className = 'engine-card';
            card.href = '#';
            card.setAttribute('data-engine-id', engine.id);
            card.setAttribute('data-index', index);
            card.setAttribute('title', `${engine.name} - ${engine.desc}\n点击搜索 | Ctrl+点击多选`);
            card.innerHTML = `
                <div class="card-glow" style="background:radial-gradient(circle, ${engine.color}aa 0%, transparent 70%);"></div>
                <div class="ec-icon" style="background:linear-gradient(150deg, ${engine.color} 0%, ${engine.color}cc 100%);">${engine.icon}</div>
                <div class="ec-info">
                    <div class="ec-name">${engine.name}</div>
                    <div class="ec-desc">${engine.desc}</div>
                </div>
                <span class="ec-shortcut">Alt+${index}</span>
                <span class="ec-check">✓</span>
            `;
            if (engine.id === state.defaultEngine) {
                const badge = document.createElement('span');
                badge.style.cssText =
                    'position:absolute;top:0;left:0;font-size:0.55rem;font-weight:600;' +
                    'background:linear-gradient(135deg,#2ea3ff,#5e5ce6);color:#fff;' +
                    'padding:2px 9px 3px 10px;border-radius:22px 0 14px 0;z-index:7;' +
                    'letter-spacing:0.6px;box-shadow:0 6px 16px -6px rgba(10,132,255,0.9);';
                badge.textContent = '默认';
                card.appendChild(badge);
            }
            container.appendChild(card);
        });
    }

    function updateAllCardShortcuts() {
        $$('.engine-card .ec-shortcut').forEach(el => {
            el.style.display = state.showShortcutHint ? '' : 'none';
        });
    }

    // ==================== URL 构建 ====================
    function buildSearchUrl(engine, query, size) {
        let url = engine.url.replace('{query}', encodeURIComponent(query));
        const sizeKey = size || state.selectedSize || 'all';
        if (engine.sizeMap && engine.sizeMap[sizeKey]) url += engine.sizeMap[sizeKey];
        if (state.safeSearch && engine.safeParam) url += engine.safeParam;
        return url;
    }

    function findEngineById(id) { return allEngines.find(e => e.id === id); }
    function getDefaultEngine() { return findEngineById(state.defaultEngine) || allEngines[0]; }

    // ==================== 搜索 ====================
    function doSearch(engineId, query) {
        const engine = findEngineById(engineId);
        if (!engine) return;
        const q = query || searchInput.value.trim();
        if (!q) {
            showToast('请输入搜索关键词', 'warning');
            searchInput.focus();
            return;
        }
        const url = buildSearchUrl(engine, q);
        if (state.openMode === 'current') window.location.href = url;
        else window.open(url, '_blank');
        addToHistory(q);
        state.currentQuery = q;
        updateSearchClear();
    }

    function doMultiSearch() {
        const q = searchInput.value.trim();
        if (!q) {
            showToast('请输入搜索关键词', 'warning');
            searchInput.focus();
            return;
        }
        if (state.selectedEngines.size === 0) {
            showToast('请先选择至少一个搜索引擎', 'warning');
            return;
        }
        const ids = Array.from(state.selectedEngines);
        ids.forEach((id, i) => {
            setTimeout(() => {
                const engine = findEngineById(id);
                if (engine) window.open(buildSearchUrl(engine, q), '_blank');
            }, i * 150);
        });
        addToHistory(q);
        state.currentQuery = q;
        showToast(`已在 ${ids.length} 个引擎中搜索「${q}」`, 'success');
        if (ids.length >= 2) {
            state.multiSelectMode = false;
            state.selectedEngines.clear();
            updateMultiBar();
            updateAllCardSelectionUI();
            btnMultiMode.classList.remove('active');
        }
    }

    // ==================== 历史记录 ====================
    function addToHistory(query) {
        if (!state.rememberHistory) return;
        state.searchHistory = state.searchHistory.filter(h => h.query !== query);
        state.searchHistory.unshift({ query, time: Date.now() });
        if (state.searchHistory.length > 50) state.searchHistory = state.searchHistory.slice(0, 50);
        saveState();
        renderHistory();
    }

    function renderHistory() {
        if (!state.rememberHistory || state.searchHistory.length === 0) {
            historyList.innerHTML = '<div class="history-empty">暂无搜索记录</div>';
        } else {
            historyList.innerHTML = state.searchHistory.map((h, i) => `
                <div class="history-item" data-query="${escapeHtml(h.query)}">
                    <span class="hi-icon">🕐</span>
                    <span class="hi-text">${escapeHtml(h.query)}</span>
                    <button class="hi-delete" data-index="${i}" title="删除此记录">✕</button>
                </div>
            `).join('');
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function clearAllHistory() {
        state.searchHistory = [];
        saveState();
        renderHistory();
        showToast('搜索历史已清空', 'success');
    }

    function deleteHistoryItem(index) {
        state.searchHistory.splice(index, 1);
        saveState();
        renderHistory();
        showToast('已删除该记录', 'success');
    }

    // ==================== Toast ====================
    function showToast(msg, type = '') {
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = msg;
        toast.style.animationDuration = '2.6s, 2.6s';
        toastContainer.appendChild(toast);
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2700);
    }

    // ==================== UI 更新 ====================
    function updateSearchClear() {
        searchClear.classList.toggle('visible', !!searchInput.value.trim());
    }

    function updateSafeSearchBtn() {
        if (state.safeSearch) {
            btnSafeSearch.textContent = '🔒 开';
            btnSafeSearch.classList.add('active');
            btnSafeSearch.dataset.safe = 'on';
        } else {
            btnSafeSearch.textContent = '🔓 关';
            btnSafeSearch.classList.remove('active');
            btnSafeSearch.dataset.safe = 'off';
        }
    }

    function updateMultiBar() {
        const count = state.selectedEngines.size;
        multiCount.textContent = `已选 ${count} 个引擎`;
        multiBar.classList.toggle('active', state.multiSelectMode || count > 0);
    }

    function updateAllCardSelectionUI() {
        $$('.engine-card').forEach(card => {
            const engineId = card.getAttribute('data-engine-id');
            card.classList.toggle('multi-select-mode', state.multiSelectMode);
            card.classList.toggle('selected', state.selectedEngines.has(engineId));
        });
    }

    function populateSettings() {
        settingDefaultEngine.innerHTML = allEngines.map(e =>
            `<option value="${e.id}" ${e.id === state.defaultEngine ? 'selected' : ''}>${e.name}</option>`
        ).join('');
        settingOpenMode.value = state.openMode;
        toggleSafeDefault.classList.toggle('active', state.safeSearch);
        toggleShortcutHint.classList.toggle('active', state.showShortcutHint);
        toggleHistory.classList.toggle('active', state.rememberHistory);
    }

    // ==================== 事件绑定 ====================
    function bindEvents() {
        searchInput.addEventListener('input', () => {
            updateSearchClear();
            if (searchInput.value.trim() && state.rememberHistory && state.searchHistory.length > 0) {
                historyDropdown.classList.add('show');
            } else {
                historyDropdown.classList.remove('show');
            }
        });
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim() && state.rememberHistory && state.searchHistory.length > 0) {
                historyDropdown.classList.add('show');
            }
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    const prev = state.openMode;
                    state.openMode = 'new_tab';
                    doSearch(state.defaultEngine);
                    state.openMode = prev;
                } else {
                    doSearch(state.defaultEngine);
                }
            }
            if (e.key === 'Escape') {
                searchInput.value = '';
                updateSearchClear();
                historyDropdown.classList.remove('show');
                searchInput.blur();
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            updateSearchClear();
            historyDropdown.classList.remove('show');
            searchInput.focus();
        });

        searchSubmit.addEventListener('click', () => doSearch(state.defaultEngine));

        document.addEventListener('click', (e) => {
            if (!searchWrapper.contains(e.target)) historyDropdown.classList.remove('show');
        });

        historyList.addEventListener('click', (e) => {
            const item = e.target.closest('.history-item');
            const deleteBtn = e.target.closest('.hi-delete');
            if (deleteBtn) {
                e.stopPropagation();
                const index = parseInt(deleteBtn.getAttribute('data-index'));
                if (!isNaN(index)) deleteHistoryItem(index);
                return;
            }
            if (item) {
                const query = item.getAttribute('data-query');
                if (query) {
                    searchInput.value = query;
                    updateSearchClear();
                    historyDropdown.classList.remove('show');
                    doSearch(state.defaultEngine, query);
                }
            }
        });

        historyClearAll.addEventListener('click', clearAllHistory);

        // 卡片点击（事件委托）
        document.querySelectorAll('.engines-grid').forEach(grid => {
            grid.addEventListener('click', (e) => {
                e.preventDefault();
                const card = e.target.closest('.engine-card');
                if (!card) return;
                const engineId = card.getAttribute('data-engine-id');
                if (!engineId) return;

                if (state.multiSelectMode || e.ctrlKey || e.metaKey) {
                    if (!state.multiSelectMode && (e.ctrlKey || e.metaKey)) {
                        state.multiSelectMode = true;
                        btnMultiMode.classList.add('active');
                    }
                    if (state.selectedEngines.has(engineId)) state.selectedEngines.delete(engineId);
                    else state.selectedEngines.add(engineId);

                    updateMultiBar();
                    updateAllCardSelectionUI();
                    if (state.selectedEngines.size === 0 && state.multiSelectMode &&
                        !e.ctrlKey && !e.metaKey) {
                        state.multiSelectMode = false;
                        btnMultiMode.classList.remove('active');
                        updateAllCardSelectionUI();
                    }
                } else {
                    if (state.selectedEngines.size > 0 && !state.multiSelectMode) {
                        state.selectedEngines.clear();
                        updateMultiBar();
                        updateAllCardSelectionUI();
                    }
                    doSearch(engineId);
                }
            });
        });

        btnMultiMode.addEventListener('click', () => {
            state.multiSelectMode = !state.multiSelectMode;
            if (!state.multiSelectMode) {
                state.selectedEngines.clear();
                updateMultiBar();
            }
            btnMultiMode.classList.toggle('active', state.multiSelectMode);
            updateAllCardSelectionUI();
            if (state.multiSelectMode) showToast('多选模式已开启，点击卡片选择引擎', '');
        });

        btnMultiSearch.addEventListener('click', doMultiSearch);

        btnMultiClear.addEventListener('click', () => {
            state.selectedEngines.clear();
            state.multiSelectMode = false;
            btnMultiMode.classList.remove('active');
            updateMultiBar();
            updateAllCardSelectionUI();
        });

        // 尺寸选择
        document.querySelectorAll('.option-chip[data-size]').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.option-chip[data-size]')
                    .forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                state.selectedSize = chip.getAttribute('data-size');
            });
        });

        // 安全搜索
        btnSafeSearch.addEventListener('click', () => {
            state.safeSearch = !state.safeSearch;
            updateSafeSearchBtn();
            saveState();
            showToast(state.safeSearch ? '安全搜索已开启' : '安全搜索已关闭',
                state.safeSearch ? 'success' : '');
        });

        // 热门标签
        document.getElementById('hotTags').addEventListener('click', (e) => {
            const tag = e.target.closest('.hot-tag');
            if (!tag) return;
            const text = tag.textContent.replace(/🔥/g, '').trim();
            searchInput.value = text;
            updateSearchClear();
            doSearch(state.defaultEngine, text);
        });

        // 主题
        btnTheme.addEventListener('click', () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme();
            saveState();
            showToast(state.theme === 'dark' ? '已切换到深色模式 🌙' : '已切换到浅色模式 ☀️', 'success');
        });

        // 设置面板
        btnSettings.addEventListener('click', openSettings);
        btnCloseSettings.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) closeSettings();
        });

        settingDefaultEngine.addEventListener('change', () => {
            state.defaultEngine = settingDefaultEngine.value;
            saveState();
            renderAllEngineCards();
            showToast('默认搜索引擎已更新', 'success');
        });

        settingOpenMode.addEventListener('change', () => {
            state.openMode = settingOpenMode.value;
            saveState();
            showToast('打开方式已更新', 'success');
        });

        toggleSafeDefault.addEventListener('click', () => {
            state.safeSearch = !state.safeSearch;
            toggleSafeDefault.classList.toggle('active', state.safeSearch);
            updateSafeSearchBtn();
            saveState();
        });

        toggleShortcutHint.addEventListener('click', () => {
            state.showShortcutHint = !state.showShortcutHint;
            toggleShortcutHint.classList.toggle('active', state.showShortcutHint);
            updateAllCardShortcuts();
            saveState();
        });

        toggleHistory.addEventListener('click', () => {
            state.rememberHistory = !state.rememberHistory;
            toggleHistory.classList.toggle('active', state.rememberHistory);
            if (!state.rememberHistory) {
                state.searchHistory = [];
                renderHistory();
            }
            saveState();
            showToast(state.rememberHistory ? '搜索历史已启用' : '搜索历史已禁用并清空', '');
        });

        // 全局快捷键
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key >= '1' && e.key <= '9') {
                e.preventDefault();
                const index = parseInt(e.key) - 1;
                const allCards = $$('.engine-card');
                if (index < allCards.length) {
                    const engineId = allCards[index].getAttribute('data-engine-id');
                    if (engineId) doSearch(engineId);
                }
            }
            if (e.key === '/' && document.activeElement !== searchInput &&
                !e.target.closest('input,textarea,select')) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        window.addEventListener('beforeunload', saveState);
    }

    function openSettings() {
        populateSettings();
        settingsOverlay.classList.add('show');
    }
    function closeSettings() {
        settingsOverlay.classList.remove('show');
    }

    // ==================== 启动 ====================
    init();

    console.log('%c🚀 图片搜索聚合 · 液态玻璃版', 'color:#0a84ff;font-weight:700;font-size:14px');
    console.log('  📋 多引擎搜索 | 搜索历史 | 深色模式 | 多选批量 | 尺寸筛选 | 安全搜索');
    console.log('  ⌨️ Enter=默认引擎 | Alt+数字=指定引擎 | /=聚焦 | Ctrl+点击=多选');
    console.log('  🔗 支持引擎：' + allEngines.length + ' 个');
})();
</script>
</body>
</html>
