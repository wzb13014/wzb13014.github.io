<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网址库</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">

        <!-- ========== 顶部导航（一级菜单） ========== -->
        <nav class="top-nav" id="topNav">
            <!-- Logo -->
            <div class="logo">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span>网址库</span>
            </div>

            <!-- 搜索框（居中） -->
            <div class="search-wrap">
                <svg class="icon-svg search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索名称 / 网址 / 用途…" autocomplete="off" />
                <button class="search-clear" id="searchClear" title="清除搜索" aria-label="清除搜索">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                </button>
                <!-- 搜索历史下拉 -->
                <div class="search-history" id="searchHistory"></div>
            </div>

            <!-- 右侧按钮组 -->
            <div class="right-actions">
                <button class="icon-btn" id="statsBtn" title="数据统计">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="4" y1="20" x2="20" y2="20"></line>
                        <rect x="6" y="11" width="3" height="7"></rect>
                        <rect x="11" y="6" width="3" height="12"></rect>
                        <rect x="16" y="13" width="3" height="5"></rect>
                    </svg>
                </button>
                <div class="dropdown" id="recentDropdown">
                    <button class="icon-btn" id="recentBtn" title="最近访问">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <polyline points="12 7 12 12 15 14"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu recent-panel" id="recentPanel">
                        <div class="recent-panel-head">
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:15px;height:15px;">
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 14"></polyline>
                            </svg>
                            最近访问
                        </div>
                        <div class="recent-panel-items" id="recentPanelItems"></div>
                    </div>
                </div>
                <button class="icon-btn" id="viewBtn" title="切换卡片/列表视图">
                    <span id="viewIcon">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <line x1="8" y1="6" x2="20" y2="6"></line>
                            <line x1="8" y1="12" x2="20" y2="12"></line>
                            <line x1="8" y1="18" x2="20" y2="18"></line>
                            <line x1="3.5" y1="6" x2="3.5" y2="6"></line>
                            <line x1="3.5" y1="12" x2="3.5" y2="12"></line>
                            <line x1="3.5" y1="18" x2="3.5" y2="18"></line>
                        </svg>
                    </span>
                </button>
                <div class="dropdown" id="settingsDropdown">
                    <button class="icon-btn" id="settingsBtn" title="设置">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                    <div class="dropdown-menu settings-menu" id="settingsMenu">
                        <button data-action="favfilter"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> <span>仅看收藏</span></button>
                        <button data-action="density"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 14 4 20 10 20"></polyline><line x1="10" y1="20" x2="4" y2="14"></line><polyline points="20 10 20 4 14 4"></polyline><line x1="14" y1="4" x2="20" y2="10"></line><polyline points="14 14 14 20 20 20"></polyline><line x1="14" y1="20" x2="20" y2="14"></line><polyline points="4 10 4 4 10 4"></polyline><line x1="4" y1="10" x2="10" y2="4"></line></svg> <span>密度：舒适</span></button>
                        <button data-action="favicon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg> <span>网站图标：开</span></button>
                        <button data-action="shortcut"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6" y2="10"></line><line x1="10" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="14" y2="10"></line><line x1="18" y1="10" x2="18" y2="10"></line><line x1="7" y1="14" x2="17" y2="14"></line></svg> <span>快捷键帮助</span></button>
                    </div>
                </div>
                <button class="icon-btn" id="themeToggle" title="切换主题 (T)">
                    <span id="themeIcon">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                </button>
                <a class="icon-btn" href="https://www.wjx.top/vm/wAGGMpW.aspx#" target="_blank" rel="noopener noreferrer" title="网址征集">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </a>
            </div>

            <!-- 一级菜单列表 -->
            <div class="nav-level1" id="navLevel1">
                <!-- 由 JS 动态生成 -->
            </div>
        </nav>

        <!-- ========== 二级菜单（卡片上方横排） ========== -->
        <div class="subnav-wrap" id="subnavWrap">
            <div class="subnav-inner" id="subnavInner">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- ========== 工具栏 ========== -->
        <div class="toolbar" id="toolbar">
            <span class="result-count" id="resultCount"></span>
        </div>

        <!-- ========== 网址卡片区域 ========== -->
        <main id="bookmarksContainer">
            <!-- 由 JS 动态生成 -->
        </main>

    </div>

    <!-- ========== 添加 / 编辑 网址 弹窗 ========== -->
    <div class="modal-overlay" id="siteModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="siteModalTitle">添加网址</h3>
                <button class="modal-close" data-close="siteModal"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>名称 <span class="req">*</span></label>
                    <input type="text" id="fName" placeholder="例如：百度" />
                </div>
                <div class="form-row">
                    <label>网址 <span class="req">*</span></label>
                    <input type="text" id="fUrl" placeholder="https://..." />
                    <small class="form-hint" id="urlHint"></small>
                </div>
                <div class="form-row">
                    <label>描述</label>
                    <input type="text" id="fDesc" placeholder="一句话说明用途（可选）" />
                </div>
                <div class="form-row two-col">
                    <div>
                        <label>所属分组</label>
                        <select id="fGroup"></select>
                    </div>
                    <div>
                        <label>所属分类</label>
                        <select id="fCategory"></select>
                    </div>
                </div>
                <div class="form-row checkbox-row">
                    <label class="checkbox-inline">
                        <input type="checkbox" id="fNewCat" /> 新建分类
                    </label>
                    <input type="text" id="fNewCatName" placeholder="新分类名称" style="display:none;" />
                    <select id="fNewCatIcon" style="display:none;">
                        <option value="fa-folder">📁 文件夹</option>
                        <option value="fa-star">⭐ 星标</option>
                        <option value="fa-book">📖 书</option>
                        <option value="fa-code">💻 代码</option>
                        <option value="fa-shopping-cart">🛒 购物</option>
                        <option value="fa-graduation-cap">🎓 学习</option>
                        <option value="fa-briefcase">💼 商务</option>
                        <option value="fa-flask">🧪 实验</option>
                        <option value="fa-link">🔗 链接</option>
                        <option value="fa-gamepad">🎮 娱乐</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn ghost" data-close="siteModal">取消</button>
                <button class="btn primary" id="siteSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- ========== 分类管理 弹窗 ========== -->
    <div class="modal-overlay" id="catModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="catModalTitle">添加分类</h3>
                <button class="modal-close" data-close="catModal"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>分类名称 <span class="req">*</span></label>
                    <input type="text" id="cName" placeholder="例如：设计素材" />
                </div>
                <div class="form-row two-col">
                    <div>
                        <label>所属分组</label>
                        <select id="cGroup"></select>
                    </div>
                    <div>
                        <label>图标</label>
                        <select id="cIcon">
                            <option value="fa-folder">📁 文件夹</option>
                            <option value="fa-star">⭐ 星标</option>
                            <option value="fa-book">📖 书</option>
                            <option value="fa-code">💻 代码</option>
                            <option value="fa-shopping-cart">🛒 购物</option>
                            <option value="fa-graduation-cap">🎓 学习</option>
                            <option value="fa-briefcase">💼 商务</option>
                            <option value="fa-flask">🧪 实验</option>
                            <option value="fa-link">🔗 链接</option>
                            <option value="fa-gamepad">🎮 娱乐</option>
                            <option value="fa-image">🖼️ 图片</option>
                            <option value="fa-music">🎵 音乐</option>
                            <option value="fa-heart">❤️  heart</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn ghost" data-close="catModal">取消</button>
                <button class="btn primary" id="catSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- ========== 统计面板 弹窗 ========== -->
    <div class="modal-overlay" id="statsModal" style="display:none;">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="20"></line><rect x="6" y="11" width="3" height="7"></rect><rect x="11" y="6" width="3" height="12"></rect><rect x="16" y="13" width="3" height="5"></rect></svg> 数据统计</h3>
                <button class="modal-close" data-close="statsModal"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
            </div>
            <div class="modal-body" id="statsBody">
                <!-- 由 JS 生成 -->
            </div>
        </div>
    </div>

    <!-- ========== 快捷键帮助 弹窗 ========== -->
    <div class="modal-overlay" id="helpModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6" y2="10"></line><line x1="10" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="14" y2="10"></line><line x1="18" y1="10" x2="18" y2="10"></line><line x1="7" y1="14" x2="17" y2="14"></line></svg> 快捷键</h3>
                <button class="modal-close" data-close="helpModal"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
            </div>
            <div class="modal-body">
                <ul class="shortcut-list">
                    <li><kbd>/</kbd> 聚焦搜索框</li>
                    <li><kbd>Esc</kbd> 清除搜索 / 关闭弹窗</li>
                    <li><kbd>N</kbd> 添加网址</li>
                    <li><kbd>T</kbd> 切换主题</li>
                    <li><kbd>F</kbd> 仅看收藏</li>
                    <li><kbd>V</kbd> 切换视图</li>
                    <li><kbd>?</kbd> 打开本帮助</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- ========== 右键菜单 ========== -->
    <div class="context-menu" id="contextMenu" style="display:none;">
        <button data-action="open"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg> 打开</button>
        <button data-action="copy"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制链接</button>
        <button data-action="fav"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> 收藏 / 取消</button>
        <button data-action="edit"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> 编辑</button>
        <button data-action="delete" class="danger"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> 删除</button>
    </div>

    <!-- ========== Toast 容器 ========== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
