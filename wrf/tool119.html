<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素周期表 · Interactive Periodic Table</title>
<style>
  :root{
    --bg:#0f1320; --panel:#171c2e; --panel2:#1f2740; --line:#2a3350;
    --text:#e8ecf6; --muted:#9aa6c4; --accent:#5b8cff; --accent2:#7c5cff;
    --tile-border:rgba(255,255,255,.08); --shadow:0 8px 30px rgba(0,0,0,.45);
    --radius:10px;
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#d8deec;
    --text:#1a2238; --muted:#5a6a8c; --accent:#3b6cff; --accent2:#7c5cff;
    --tile-border:rgba(0,0,0,.08); --shadow:0 8px 30px rgba(20,30,60,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:18px 22px 10px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
    border-bottom:1px solid var(--line);
  }
  h1{font-size:22px; margin:0; letter-spacing:.5px;}
  h1 small{font-size:13px; color:var(--muted); font-weight:400; margin-left:8px;}
  .controls{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-left:auto;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; color:var(--muted); letter-spacing:.3px;}
  input[type=text], select, input[type=number]{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:13px; outline:none; min-width:130px;
  }
  input[type=text]:focus, select:focus{border-color:var(--accent);}
  input[type=range]{width:150px; accent-color:var(--accent);}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; transition:.15s;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;}
  button.primary:hover{filter:brightness(1.08); color:#fff;}

  .wrap{padding:14px 22px 40px; overflow-x:auto;}
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center;}
  .legend .chip{
    display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    font-size:12px; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    user-select:none; transition:.15s;
  }
  .legend .chip:hover{border-color:var(--accent);}
  .legend .chip.active{border-color:var(--accent); box-shadow:0 0 0 2px rgba(91,140,255,.25);}
  .legend .dot{width:12px; height:12px; border-radius:3px;}

  .grid{
    display:grid; grid-template-columns:repeat(18, minmax(42px,1fr));
    grid-auto-rows:minmax(46px,auto); gap:4px; min-width:980px; align-items:center;
  }
  .cell{
    position:relative; border-radius:7px; padding:3px 4px; cursor:pointer;
    border:1px solid var(--tile-border); background:var(--panel2); color:#15192b;
    display:flex; flex-direction:column; justify-content:center; min-height:46px;
    transition:transform .12s, box-shadow .12s, opacity .12s; overflow:hidden;
  }
  .cell:hover{transform:translateY(-3px) scale(1.04); box-shadow:var(--shadow); z-index:5;}
  .cell.dim{opacity:.16; filter:grayscale(.6);}
  .cell .num{font-size:9px; line-height:1; opacity:.85;}
  .cell .sym{font-size:16px; font-weight:700; line-height:1.05; text-align:center;}
  .cell .name{font-size:8.5px; line-height:1; text-align:center; opacity:.8; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cell .val{font-size:8px; line-height:1; text-align:center; opacity:.9; margin-top:1px;}
  .placeholder{
    background:transparent; border:1px dashed var(--line); color:var(--muted);
    cursor:default; display:flex; align-items:center; justify-content:center; font-size:9px;
  }
  .placeholder:hover{transform:none; box-shadow:none;}

  .fblock-label{
    grid-column:3 / 4; font-size:10px; color:var(--muted); display:flex; align-items:center;
    justify-content:center; text-align:center;
  }

  /* color overlay for gradient/phase modes uses background; keep text dark */
  .cell.grad, .cell.phase{color:#11151f;}

  /* tooltip */
  #tooltip{
    position:fixed; z-index:50; pointer-events:none; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px;
    box-shadow:var(--shadow); max-width:240px; display:none; color:var(--text);
  }
  #tooltip .tt-sym{font-size:20px; font-weight:700;}
  #tooltip .tt-row{color:var(--muted); margin-top:3px;}

  /* modal */
  #modal{
    position:fixed; inset:0; background:rgba(5,8,16,.6); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  #modal.show{display:flex;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:min(560px,96vw); max-height:90vh; overflow:auto; box-shadow:var(--shadow);
  }
  .card-head{padding:20px 22px; display:flex; gap:16px; align-items:center; position:relative;}
  .card-badge{
    width:84px; height:84px; border-radius:12px; flex:0 0 auto; display:flex;
    flex-direction:column; align-items:center; justify-content:center; color:#11151f;
  }
  .card-badge .b-num{font-size:11px;}
  .card-badge .b-sym{font-size:30px; font-weight:800; line-height:1;}
  .card-badge .b-mass{font-size:10px;}
  .card-title{flex:1;}
  .card-title h2{margin:0; font-size:22px;}
  .card-title .en{color:var(--muted); font-size:14px;}
  .card-title .cat{display:inline-block; margin-top:8px; font-size:12px; padding:3px 10px; border-radius:20px; color:#11151f; font-weight:600;}
  .close{position:absolute; top:14px; right:16px; cursor:pointer; font-size:20px; color:var(--muted); border:none; background:none;}
  .close:hover{color:var(--text);}
  .card-body{padding:6px 22px 22px; display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;}
  .info{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .info .k{font-size:11px; color:var(--muted);}
  .info .v{font-size:14px; margin-top:2px; font-weight:600;}
  .info.full{grid-column:1 / -1;}
  .info .econf{font-family:"Cascadia Code",Consolas,monospace; font-size:15px; color:var(--accent); word-break:break-word;}
  .meter{height:7px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:7px;}
  .meter > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2));}
  @media (max-width:560px){ .card-body{grid-template-columns:1fr;} }

  .hint{color:var(--muted); font-size:12px; margin:6px 0 0;}
  .grad-legend{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin-bottom:8px;}
  .grad-bar{height:10px; width:160px; border-radius:6px; background:linear-gradient(90deg,#3b6cff,#36d399,#ffd43b,#ff6b6b);}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:0 22px 30px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>元素周期表 <small>Interactive Periodic Table · 118 种元素</small></h1>
  </div>
  <div class="controls">
    <div class="field">
      <label>搜索（名称/符号/序数）</label>
      <input type="text" id="search" placeholder="如 Fe / 铁 / 26">
    </div>
    <div class="field">
      <label>格内数值</label>
      <select id="dispMode">
        <option value="num">原子序数</option>
        <option value="mass">相对原子质量</option>
        <option value="pa">电负性</option>
        <option value="mp">熔点 (°C)</option>
        <option value="bp">沸点 (°C)</option>
        <option value="density">密度</option>
      </select>
    </div>
    <div class="field">
      <label>配色方案</label>
      <select id="colorMode">
        <option value="cat">分类颜色</option>
        <option value="pa">电负性</option>
        <option value="mass">相对原子质量</option>
        <option value="mp">熔点</option>
        <option value="bp">沸点</option>
        <option value="density">密度</option>
        <option value="phase">温度相态</option>
      </select>
    </div>
    <div class="field">
      <label>温度 (°C)：<span id="tempVal">25</span></label>
      <input type="range" id="temp" min="-273" max="6000" value="25" step="1">
    </div>
    <button id="reset">重置筛选</button>
    <button id="theme">🌗 主题</button>
  </div>
</header>

<div class="wrap">
  <div class="legend" id="legend"></div>
  <div class="grad-legend" id="gradLegend" style="display:none;">
    <span id="gradMin">低</span><div class="grad-bar"></div><span id="gradMax">高</span>
    <span style="margin-left:6px;">（颜色 = 该属性数值大小）</span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">提示：单击元素查看完整信息（电子排布、电负性、熔沸点、密度、发现年份等）；悬停查看速览；点击上方分类图例可单独高亮；拖动温度滑块并选择“温度相态”配色可观察不同温度下的物态。</p>
</div>

<div id="tooltip"></div>

<div id="modal">
  <div class="card" id="card"></div>
</div>

<footer>数据来源：基于 IUPAC 标准元素数据的可视化整理，超重金属部分性质标注为估算/未知。</footer>

"Mt":"人工合成超重元素（第9族），以迈特纳命名。",

"Nh":"人工合成超重元素（第13族），以日本命名。",
"Fl":"人工合成超重元素（第14族），以弗列罗夫命名。",
"Mc":"人工合成超重元素（第15族），以莫斯科命名。",

"Og":"人工合成超重元素（第18族），以奥加涅相命名，理论上或具反应性。"
};

/* ============ 电子排布 ============ */
const ORBITALS=[["1s",2],["2s",2],["2p",6],["3s",2],["3p",6],["4s",2],["3d",10],["4p",6],["5s",2],["4d",10],["5p",6],["6s",2],["4f",14],["5d",10],["6p",6],["7s",2],["5f",14],["6d",10],["7p",6]];
const NG={
  2:["He","1s2"],10:["Ne","1s2 2s2 2p6"],18:["Ar","1s2 2s2 2p6 3s2 3p6"],
  36:["Kr","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6"],
  54:["Xe","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6"],
  86:["Rn","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6 6s2 4f14 5d10 6p6"]
};
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";
function toSup(s){return s.replace(/(\d+)/g,m=>[...m].map(d=>SUP[+d]).join(""));}
function aufbauParts(z){let e=z;const p=[];for(const[nm,cap]of ORBITALS){if(e<=0)break;const f=Math.min(e,cap);p.push(nm+f);e-=f;}return p;}
function compress(parts,z){const full=parts.join(" ");let best=null;for(const k in NG){if(+k<z&&full.startsWith(NG[k][1]+" "))best=NG[k];}return best?("["+best[0]+"] "+full.slice(best[1].length+1)):full;}
const EXC={
  24:"[Ar] 3d5 4s1",29:"[Ar] 3d10 4s1",41:"[Kr] 4d4 5s1",42:"[Kr] 4d5 5s1",44:"[Kr] 4d7 5s1",
  45:"[Kr] 4d8 5s1",46:"[Kr] 4d10",47:"[Kr] 4d10 5s1",57:"[Xe] 5d1 6s2",58:"[Xe] 4f1 5d1 6s2",
  64:"[Xe] 4f7 5d1 6s2",71:"[Xe] 4f14 5d1 6s2",78:"[Xe] 4f14 5d9 6s1",79:"[Xe] 4f14 5d10 6s1",
  89:"[Rn] 6d1 7s2",90:"[Rn] 6d2 7s2",91:"[Rn] 5f2 6d1 7s2",92:"[Rn] 5f3 6d1 7s2",93:"[Rn] 5f4 6d1 7s2",
  96:"[Rn] 5f7 6d1 7s2",95:"[Rn] 5f7 7s2",98:"[Rn] 5f10 7s2",99:"[Rn] 5f11 7s2",100:"[Rn] 5f12 7s2",
  101:"[Rn] 5f13 7s2",102:"[Rn] 5f14 7s2",103:"[Rn] 5f14 7s2 7p1"
};
function econf(z){return toSup(EXC[z]?EXC[z]:compress(aufbauParts(z),z));}

/* ============ 工具 ============ */
function fmt(v,d){ if(v===null||v===undefined) return "—"; return (+v).toFixed(d); }
function densityStr(el){
  if(el.density===null||el.density===undefined) return "—";
  if(el.phase==="gas") return (el.density*1000).toFixed(2)+" g/L";
  return el.density.toFixed(3)+" g/cm³";
}
function phaseAt(el,temp){
  if(el.mp===null) return "unknown";
  if(temp<el.mp) return "solid";
  if(el.bp===null) return "liquid";
  if(temp<el.bp) return "liquid";
  return "gas";
}
const PHASE_COLOR={solid:"#4dabf7",liquid:"#ff8787",gas:"#ffd43b",unknown:"#495057"};

/* 统计某属性的 min/max（用于渐变配色） */
function propRange(key){
  let mn=Infinity,mx=-Infinity;
  E.forEach(e=>{const v=e[key]; if(v!==null&&v!==undefined){if(v<mn)mn=v; if(v>mx)mx=v;}});
  return {mn,mx};
}
function gradColor(key,v){
  if(v===null||v===undefined) return "#444b63";
  const {mn,mx}=RANGES[key];
  let t=(v-mn)/(mx-mn); t=Math.max(0,Math.min(1,t));
  // 蓝(240) -> 青(180) -> 绿(120) -> 黄(60) -> 红(0)
  const hue=240-240*t;
  return `hsl(${hue.toFixed(0)},68%,60%)`;
}

/* ============ 渲染 ============ */
const RANGES={};
["pa","mass","mp","bp","density"].forEach(k=>RANGES[k]=propRange(k));

const grid=document.getElementById("grid");
const legendEl=document.getElementById("legend");
let selectedCat=null;

function buildLegend(){
  legendEl.innerHTML="";
  Object.entries(CATS).forEach(([key,c])=>{
    const chip=document.createElement("div");
    chip.className="chip"+(selectedCat===key?" active":"");
    chip.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.name}`;
    chip.onclick=()=>{ selectedCat = (selectedCat===key)?null:key; buildLegend(); applyFilter(); };
    legendEl.appendChild(chip);
  });
}

function buildGrid(){
  grid.innerHTML="";
  // 占位符（第6/7周期第3族）
  addPlaceholder(6,3,"57-71");
  addPlaceholder(7,3,"89-103");
  // 镧系/锕系 引导标签
  const lb1=document.createElement("div");
  lb1.className="fblock-label"; lb1.style.gridRow="9"; lb1.style.gridColumn="1 / 3";
  lb1.textContent="镧系"; grid.appendChild(lb1);
  const lb2=document.createElement("div");
  lb2.className="fblock-label"; lb2.style.gridRow="10"; lb2.style.gridColumn="1 / 3";
  lb2.textContent="锕系"; grid.appendChild(lb2);

  E.forEach(el=>{
    const cell=document.createElement("div");
    cell.className="cell";
    cell.style.gridRow=el.row;
    cell.style.gridColumn=el.col;
    cell.dataset.n=el.n;
    cell.dataset.cat=el.cat;
    cell.innerHTML=`<div class="num">${el.n}</div><div class="sym">${el.sym}</div><div class="name">${el.cn}</div><div class="val"></div>`;
    cell.addEventListener("mouseenter",e=>showTip(el,e));
    cell.addEventListener("mousemove",moveTip);
    cell.addEventListener("mouseleave",hideTip);
    cell.addEventListener("click",()=>openModal(el));
    cell._el=el;
    grid.appendChild(cell);
  });
  updateDisp();
  updateColors();
}
function addPlaceholder(row,col,txt){
  const p=document.createElement("div");
  p.className="placeholder";
  p.style.gridRow=row; p.style.gridColumn=col; p.textContent=txt;
  grid.appendChild(p);
}

function updateDisp(){
  const mode=document.getElementById("dispMode").value;
  document.querySelectorAll(".cell").forEach(cell=>{
    const el=cell._el; let v="";
    if(mode==="num") v=el.n;
    else if(mode==="mass") v=fmt(el.mass,2);
    else if(mode==="pa") v=fmt(el.pa,2);
    else if(mode==="mp") v=fmt(el.mp,0);
    else if(mode==="bp") v=fmt(el.bp,0);
    else if(mode==="density") v = el.density===null?"—":(el.phase==="gas"?(el.density*1000).toFixed(1):el.density.toFixed(2));
    cell.querySelector(".val").textContent=v;
  });
}

function updateColors(){
  const mode=document.getElementById("colorMode").value;
  const grad=document.getElementById("gradLegend");
  if(mode==="cat"){
    grad.style.display="none";
    document.querySelectorAll(".cell").forEach(cell=>{
      cell.classList.remove("grad","phase");
      cell.style.background=CATS[cell._el.cat].color;
    });
    updateDisp();
  } else if(mode==="phase"){
    grad.style.display="none";
    const temp=+document.getElementById("temp").value;
    document.querySelectorAll(".cell").forEach(cell=>{
      cell.classList.add("phase"); cell.classList.remove("grad");
      const ph=phaseAt(cell._el,temp);
      cell.style.background=PHASE_COLOR[ph];
      cell.querySelector(".val").textContent = ph==="solid"?"固":ph==="liquid"?"液":ph==="gas"?"气":"?";
    });
  } else {
    grad.style.display="flex";
    document.getElementById("gradMin").textContent = RANGES[mode].mn.toFixed(1);
    document.getElementById("gradMax").textContent = RANGES[mode].mx.toFixed(1);
    document.querySelectorAll(".cell").forEach(cell=>{
      cell.classList.add("grad"); cell.classList.remove("phase");
      cell.style.background=gradColor(mode,cell._el[mode]);
    });
    updateDisp();
  }
}

function applyFilter(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  document.querySelectorAll(".cell").forEach(cell=>{
    const el=cell._el; let show=true;
    if(selectedCat && el.cat!==selectedCat) show=false;
    if(q){
      const hit = String(el.n)===q || el.sym.toLowerCase()===q || el.sym.toLowerCase().startsWith(q)
        || el.cn.includes(q) || el.en.toLowerCase().includes(q) || el.n===parseInt(q);
      if(!hit) show=false;
    }
    cell.classList.toggle("dim",!show);
  });
}

/* ============ Tooltip ============ */
const tip=document.getElementById("tooltip");
function showTip(el,e){
  tip.innerHTML=`<div class="tt-sym">${el.sym} <span style="font-size:12px;color:var(--muted)">${el.n}</span></div>
    <div>${el.cn} · ${el.en}</div>
    <div class="tt-row">相对原子质量：${fmt(el.mass,3)}</div>
    <div class="tt-row">电负性：${fmt(el.pa,2)} ｜ 第${el.period}周期 ${(el.cat==="lanthanide"||el.cat==="actinide")?"":("第"+el.group+"族")}</div>
    <div class="tt-row">${CATS[el.cat].name}</div>`;
  tip.style.display="block"; moveTip(e);
}
function moveTip(e){
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  if(x+tip.offsetWidth>window.innerWidth) x=e.clientX-tip.offsetWidth-pad;
  if(y+tip.offsetHeight>window.innerHeight) y=e.clientY-tip.offsetHeight-pad;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ tip.style.display="none"; }

/* ============ Modal ============ */
const modal=document.getElementById("modal");
const card=document.getElementById("card");
function openModal(el){
  const color=CATS[el.cat].color;
  const pa=el.pa, paPct = pa? (pa/4*100):0;
  const groupTxt = (el.cat==="lanthanide")?"镧系":(el.cat==="actinide")?"锕系":("第 "+el.group+" 族");
  card.innerHTML=`
    <div class="card-head">
      <div class="card-badge" style="background:${color}">
        <div class="b-num">${el.n}</div>
        <div class="b-sym">${el.sym}</div>
        <div class="b-mass">${fmt(el.mass,3)}</div>
      </div>
      <div class="card-title">
        <h2>${el.cn} <span style="font-size:16px;color:var(--muted)">${el.en}</span></h2>
        <div class="en">${el.sym} · ${groupTxt} · 第 ${el.period} 周期 · ${el.block} 区</div>
        <span class="cat" style="background:${color}">${CATS[el.cat].name}</span>
      </div>
      <button class="close" id="closeBtn">✕</button>
    </div>
    <div class="card-body">
      <div class="info full"><div class="k">电子排布</div><div class="econf">${econf(el.n)}</div></div>
      <div class="info"><div class="k">相对原子质量</div><div class="v">${fmt(el.mass,4)}</div></div>
      <div class="info"><div class="k">鲍林电负性</div><div class="v">${fmt(el.pa,2)}</div>
        <div class="meter"><i style="width:${paPct}%"></i></div></div>
      <div class="info"><div class="k">熔点 (°C)</div><div class="v">${fmt(el.mp,1)}</div></div>
      <div class="info"><div class="k">沸点 (°C)</div><div class="v">${fmt(el.bp,1)}</div></div>
      <div class="info"><div class="k">密度</div><div class="v">${densityStr(el)}</div></div>
      <div class="info"><div class="k">常温物态</div><div class="v">${el.phase?({solid:"固态",liquid:"液态",gas:"气态"})[el.phase]:"未知"}</div></div>
      <div class="info"><div class="k">原子序数</div><div class="v">${el.n}</div></div>
      <div class="info"><div class="k">发现年份</div><div class="v">${el.year<0?("公元前 "+(-el.year)):el.year}</div></div>
      <div class="info full"><div class="k">说明</div><div class="v" style="font-weight:400;font-size:13px;color:var(--muted)">
        ${DESC[el.sym]||""}
        ${el.phase==="gas"?"（常温常压下为气体。）":""}
        ${["lanthanide"].includes(el.cat)?"属于镧系元素（f 区）。":""}
        ${["actinide"].includes(el.cat)?"属于锕系元素（多为放射性）。":""}
        ${el.n>=104?"属于人工合成的超重元素，性质多为理论推测。":""}
      </div></div>
    </div>`;
  modal.classList.add("show");
  document.getElementById("closeBtn").onclick=closeModal;
}
function closeModal(){ modal.classList.remove("show"); }
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ============ 事件 ============ */
document.getElementById("search").addEventListener("input",applyFilter);
document.getElementById("dispMode").addEventListener("change",()=>{updateDisp();});
document.getElementById("colorMode").addEventListener("change",()=>{updateColors();});
document.getElementById("temp").addEventListener("input",e=>{
  document.getElementById("tempVal").textContent=e.target.value;
  if(document.getElementById("colorMode").value==="phase") updateColors();
});
document.getElementById("reset").addEventListener("click",()=>{
  selectedCat=null; buildLegend(); document.getElementById("search").value=""; applyFilter();
});
document.getElementById("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur==="light"?"dark":"light");
});

/* init */
buildLegend();
buildGrid();
</script>
</body>
</html>
